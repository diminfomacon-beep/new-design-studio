<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Studio Portal</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: transparent; /* Blends with your Google Site */
            font-family: sans-serif;
        }

        .launch-btn {
            background-color: #fff;
            color: #000;
            padding: 18px 40px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s, background 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .launch-btn:hover {
            background-color: #0056b3;
            transform: scale(1.05);
        }

        .launch-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <button class="launch-btn" onclick="directToStudio()">
        Customize Now
    </button>

    <script>
       function directToStudio() {
    const desktopURL = "https://diminfomacon-beep.github.io/new-design-studio/";
    const mobileURL = "https://diminfomacon-beep.github.io/new-design-studio/mobile/";

    // 1. Check for Mobile/Tablet User Agent (The most reliable hardware check)
    const isMobileDevice = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

    // 2. Hardware check: Does it have a Touch Screen? 
    // (Desktops usually don't, unless it's a rare touch-monitor)
    const hasTouch = (('ontouchstart' in window) || (navigator.maxTouchPoints > 0));

    // 3. Platform check: Is it Windows, Mac, or Linux? (The "Big Three" Desktops)
    const isDesktopOS = /Win|Mac|Linux/i.test(navigator.platform);

    // LOGIC: 
    // If it's a mobile device OR (it has touch and isn't a desktop OS), go to mobile.
    // Otherwise, force Desktop.
    if (isMobileDevice || (hasTouch && !isDesktopOS)) {
        window.open(mobileURL, '_blank');
    } else {
        window.open(desktopURL, '_blank');
    }
}
    </script>

</body>
</html>
