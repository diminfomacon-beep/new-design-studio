<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>D.I.M. Design Studio</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/themes/classic.min.css"/>
<script src="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/pickr.min.js"></script>
<style>
:root {
  --primary:#111827; --accent:#3b82f6; --bg-light:#f5f5f5; --border-color:#ddd;
}
body{font-family:sans-serif;background:var(--bg-light);margin:0;padding:10px;display:flex;justify-content:center;user-select:none;}
.studio-wrapper {                
  display: grid;
  /* --- CHANGED: First 2 columns are fixed, center expands --- */
  grid-template-columns: 240px 240px 1fr 240px; 
  gap: 15px;                
  width: 100%;                
  padding: 15px;                
  background:#CAE4DB;                
  border-radius:16px;
  box-sizing: border-box;
  /* --- Added to ensure panels don't shrink too small --- */
  min-width: 1200px; 
}

/* --- NEW: Control Panel Style --- */
.control-panel-left {
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 15px;
  background: #f9fafb;
  display: flex;
  flex-direction: column;
  gap: 15px;
  height: 600px;
  overflow-y: auto;
}
.gallery-panel{border:1px solid var(--border-color);border-radius:12px;padding:10px;background:#f9fafb;display:flex;flex-direction:column;height:600px;overflow:hidden;}
.gallery-header{margin-bottom:10px;display:flex;flex-direction:column;gap:5px;}
.gallery-title{font-size:13px;font-weight:bold;color:#333;}
.gallery-search{padding:5px;border-radius:6px;border:1px solid #ddd;font-size:11px;width:100%;box-sizing:border-box;}
.mini-gallery-container{margin-bottom:10px;height:200px;display:flex;flex-direction:column;}
.mini-gallery-title{font-size:10px;color:var(--accent);text-transform:uppercase;font-weight:bold;margin-bottom:5px;}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(45px,1fr));gap:5px;overflow-y:auto;flex-grow:1;padding-right:5px;}
.gallery-item{width:45px;height:45px;border:1px solid #eee;border-radius:6px;cursor:pointer;object-fit:contain;background:white;transition:all 0.2s;}
.gallery-item:hover{border-color:var(--accent);transform:scale(1.05);}

/* --- PRODUCT PREVIEW CSS --- */
.product-stage{
    display:none;
    position:relative;
    width: 100%;
    height: 100%;
    align-items:center;
    justify-content:center;
}
.product-stage.active-product{display:flex;}
.product-view{
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
    position:relative;
    overflow:hidden;
    background-color:white;
    border:3px solid transparent;
    transition:all 0.3s;
}
/* Define shapes for products */
.view-tshirt{width:320px;height:250px;clip-path:polygon(25% 0%,75% 0%,100% 20%,85% 35%,85% 100%,15% 100%,15% 35%,0% 20%);}


/* Ensure the design container is positioned over the chest */
#tshirt-design {
    /* Adjust these to fit the SVG or image you use */
    top: 25%;
    left: 30%;
    width: 40%;
    height: 35%;
    border: 1px dashed rgba(255,0,0,0.3); /* Keep for debugging */
}
.view-tumbler { width: 100px; height: 250px; border-radius: 10px; }
.view-mug { width: 180px; height: 150px; border-radius: 10px 10px 30px 30px; }

/* Combined design layer */
.mockup-layer {
    position: absolute;
    overflow: hidden;
    pointer-events: none;
    border: 1px dashed rgba(255,0,0,0.3); /* Visualization */
}

/* --- DRAGGABLE CSS --- */
.draggable.active-layer{border:2px solid var(--accent);}
.design-text{
  text-align:center;
  pointer-events:auto;   /* FIXED */
  word-break:break-word;
  display:block;
  width:100%;
  line-height:1.1;
  cursor:text;
}
.resize-handle{
  width:10px;
  height:10px;
  background:white;
  border:2px solid var(--accent);
  position:absolute;
  display:none;
  z-index:10;
}

.draggable.active-layer .resize-handle{
  display:block;
}

/* Corners */
.handle-tl{top:-6px;left:-6px;cursor:nwse-resize;}
.handle-tr{top:-6px;right:-6px;cursor:nesw-resize;}
.handle-bl{bottom:-6px;left:-6px;cursor:nesw-resize;}
.handle-br{bottom:-6px;right:-6px;cursor:nwse-resize;}

/* Edges */
.handle-t{top:-6px;left:50%;transform:translateX(-50%);cursor:ns-resize;}
.handle-b{bottom:-6px;left:50%;transform:translateX(-50%);cursor:ns-resize;}
.handle-l{left:-6px;top:50%;transform:translateY(-50%);cursor:ew-resize;}
.handle-r{right:-6px;top:50%;transform:translateY(-50%);cursor:ew-resize;}
.draggable.active-layer .resize-handle{display:block;}
.handle-br{bottom:-5px;right:-5px;}
.draggable img { display: block; width: 100%; height: 100%; object-fit: contain; }
.draggable {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
}

/* --- PANELS --- */
.controls-panel{display:flex;flex-direction:column;gap:10px;}
.control-group{display:flex;flex-direction:column;gap:3px;}
label{font-weight:600;font-size:10px;color:#666;text-transform:uppercase;}
input,select{padding:6px;border-radius:6px;border:1px solid #ddd;font-size:12px;}
.layer-manager{background:#f3f4f6;padding:8px;border-radius:8px;border:1px solid #e5e7eb;max-height:120px;overflow-y:auto;}
.layer-item{display:flex;justify-content:space-between;align-items:center;background:white;padding:6px 8px;border-radius:4px;margin-bottom:4px;font-size:11px;border:1px solid #eee;}
.btn-icon{background:#eee;border:none;padding:2px 5px;border-radius:3px;cursor:pointer;font-size:9px;}
.btn-delete{background:#fee2e2;color:#991b1b;}
.btn-group{display:flex;gap:8px;margin-top:5px;flex-wrap: wrap;}
button{padding:8px;border-radius:8px;border:none;font-weight:600;cursor:pointer;font-size:12px;}
.btn-style{background:#f3f4f6;color:#333;font-weight:bold;padding:6px 10px;border:1px solid #ddd;}
.btn-style.active{background:var(--accent);color:white;border-color:var(--accent);}
.btn-primary{background:var(--primary);color:white;flex:1;}
.btn-action{background:#dbeafe;color:#1e40af;}
.btn-download{background:#d1fae5;color:#065f46;flex:1;}
#textEditor{display:none;background:#f3f4f6;padding:10px;border-radius:8px;border:1px solid #e5e7eb;}
.size-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.size-row input{width:60px;}
.draggable.editing .resize-handle {
  display: none !important;
}
/* --- PREVIEW PANEL --- */
.preview-panel{
    border:1px solid var(--border-color);
    border-radius:12px;
    padding:10px;
    background:#c9c5c5;
    display:flex;
    flex-direction:column;
    height:350px;
    overflow:hidden;
}
.preview-title { font-size: 13px; font-weight: bold; color: #000000; align-self: flex-start; }
.preview-box {
  width: 100%;
  height: 300px;
  border: 1px solid var(--border-color);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  background-color: #e5e7eb;
  background-image:
    linear-gradient(45deg, rgba(0,0,0,0.05) 25%, transparent 25%),
    linear-gradient(-45deg, rgba(0,0,0,0.05) 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, rgba(0,0,0,0.05) 75%),
    linear-gradient(-45deg, transparent 75%, rgba(0,0,0,0.05) 75%);
  background-size: 20px 20px;
  background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
}

/* --- CANVAS --- */
.canvas-container {
  flex: 1;
  background: #ffffff;
  border: 1px solid var(--border-color);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px;
  min-height: 500px;
  position: relative;
  overflow: hidden;
}

.design-canvas {
  /* --- CHANGED: Use 100% instead of fixed pixels --- */
  width: 100%;
  height: 100%;
  
  background: white;
  border: 2px dashed #ccc;
  border-radius: 12px;
  position: relative;
  overflow: hidden;
}
/* Style for the shape buttons in the gallery */
.shape-item {
    cursor: pointer;
    border: 1px solid #eee;
    transition: all 0.2s;
}
.shape-item:hover {
    border-color: var(--accent);
    transform: scale(1.05);
}
.group-container {
    border: 1px dashed transparent;
}
.group-container.active-layer {
    border: 1px dashed #2196F3;
    background: rgba(33, 150, 243, 0.05);
}
/* Hide handles by default */
.draggable .resize-handle {
    display: none !important;
}

/* Show handles ONLY when the item is active */
.draggable.active-layer > .resize-handle {
    display: block !important;
}

/* Visual feedback for the active item */
.active-layer {
    outline: 1px dashed #2196F3;
}

/* Hide handles if we are currently dragging the item (cleaner look) */
.draggable.dragging > .resize-handle {
    display: none;
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
  /********************************************
 * INITIALIZATION
 ********************************************/
const PIXABAY_API_KEY = '54841320-2fc493da46915b0eb0a6f740c';
let designCanvas = document.getElementById('designCanvas');
let currentProduct = 'tshirt';
let historyStack = [];
let redoStack = [];
let selectedItems = [];
let isResizing = false;

designCanvas.addEventListener('mousedown', e => {
    // Check if the click was directly on the canvas background
    if (e.target === designCanvas) {
        // Remove class from all elements
        designCanvas.querySelectorAll('.draggable').forEach(item => {
            item.classList.remove('active-layer');
        });
        
        // Reset variables
        selectedItems = [];
        activeItem = null;
        
        updateLayerList();
    }
});

const extendedSwatches = [
  '#FFFFFF', '#F2F2F2', '#D9D9D9', '#BFBFBF', '#A6A6A6', '#808080', '#595959', '#404040', '#262626', '#000000',
  '#FFCCCC', '#FF9999', '#FF6666', '#FF3333', '#FF0000', '#CC0000', '#990000', '#660000', '#330000',
  '#FFE5CC', '#FFCC99', '#FFB266', '#FF9933', '#FF8000', '#CC6600', '#994C00', '#663300', '#331900',
  '#FFFFCC', '#FFFF99', '#FFFF66', '#FFFF33', '#FFFF00', '#CCCC00', '#999900', '#666600', '#333300',
  '#CCFFCC', '#99FF99', '#66FF66', '#33FF33', '#00FF00', '#00CC00', '#009900', '#006600', '#003300',
  '#CCFFFF', '#99FFFF', '#66FFFF', '#33FFFF', '#00FFFF', '#00CCCC', '#009999', '#006666', '#003333',
  '#CCCCFF', '#9999FF', '#6666FF', '#3333FF', '#0000FF', '#0000CC', '#000099', '#000066', '#000033',
  '#E5CCFF', '#CC99FF', '#B266FF', '#9933FF', '#8000FF', '#6600CC', '#4C0099', '#330066', '#190033',
  '#FFCCFF', '#FF99FF', '#FF66FF', '#FF33FF', '#FF00FF', '#CC00CC', '#990099', '#660066', '#330033'
];

function createPicker(el, def) {
  return Pickr.create({
    el,
    // --- CHANGED: Use a cleaner theme ---
    theme: 'nano', 
    default: def,
    swatches: extendedSwatches,
    components: {
      // --- UPDATED: Focus on Swatches and Interactive Inputs ---
      preview: true,
      opacity: false,
      hue: false, // Hides the main color gradient slider
      interaction: {
        hex: true,
        input: true,
        save: true // The save button handles applying the custom input
      }
    }
  });
}

const bgPicker = createPicker('#bgPicker', '#ffffff');
const fontColorPicker = createPicker('#fontColorPicker', '#000000');
const shapeColorPicker = createPicker('#shapeColorPicker', '#333333');

function hidePickerOnSave(picker) {
    picker.on('save', (color, instance) => {
        instance.hide(); // --- THIS CLOSES THE PICKER BOX ---
    });
}
hidePickerOnSave(bgPicker);
hidePickerOnSave(fontColorPicker);
hidePickerOnSave(shapeColorPicker);
bgPicker.on('change', (color, instance) => {
  const colorStr = color.toRGBA().toString();
  document.querySelectorAll('.product-view').forEach(v => v.style.backgroundColor = colorStr);
  instance.setColor(colorStr);
});

fontColorPicker.on('change', (color, instance) => {
    const colorStr = color.toRGBA().toString();
    if(activeItem) {
        const textEl = activeItem.querySelector('.design-text');
       
        
        if(textEl) textEl.style.color = colorStr;
         
    }
    updatePreview();
});

// --- UPDATED: Shape Picker Change Logic ---
shapeColorPicker.on('change', (color, instance) => {
    const colorStr = color.toRGBA().toString();
    if(activeItem) {
        const svgEl = activeItem.querySelector('svg');
        if(svgEl) {
            svgEl.setAttribute('fill', colorStr);
            updatePreview();
        }
    }
});

shapeColorPicker.on('save', () => {
    if(activeItem){
        saveHistory();
    }
});


/********************************************
 * UTILITY
 ********************************************/
function saveHistory(){
  const snapshot = designCanvas.innerHTML;
  historyStack.push(snapshot);
  if(historyStack.length>50) historyStack.shift();
  redoStack = []; // Clear redo on new action
}
function undo(){
  if(historyStack.length > 0){
    redoStack.push(designCanvas.innerHTML);
    const last = historyStack.pop();
    designCanvas.innerHTML = last;
    updateLayerList();
    rebindDraggables();
    updatePreview();
  }
}
function redo(){
  if(redoStack.length > 0){
    historyStack.push(designCanvas.innerHTML);
    const next = redoStack.pop();
    designCanvas.innerHTML = next;
    updateLayerList();
    rebindDraggables();
    updatePreview();
  }
}
function updatePreview() {
  document.querySelectorAll('.product-stage').forEach(stage => {
    const productView = stage.querySelector('.product-view');
    const designContainer = productView.querySelector('.mockup-layer');
    
    if (!designContainer) return;
    
    designContainer.innerHTML = ""; // Clear existing

    // 1. Calculate the Scaling Ratios
    const scaleX = designContainer.clientWidth / designCanvas.clientWidth;
    const scaleY = designContainer.clientHeight / designCanvas.clientHeight;

    // 2. Clone and Scale Elements (Direct Children Only)
    Array.from(designCanvas.children).forEach(child => {
      // Create the clone
      const clone = child.cloneNode(true);
      clone.classList.remove("active-layer", "editing");
      clone.style.pointerEvents = "none";
      
      // Remove all resize handles from the clone (including nested ones)
      clone.querySelectorAll('.resize-handle').forEach(h => h.remove());

      // 3. Proportional Scaling for the element (or Group Container)
      const canvasLeft = parseInt(child.style.left) || 0;
      const canvasTop = parseInt(child.style.top) || 0;
      const canvasWidth = child.offsetWidth;
      const canvasHeight = child.offsetHeight;

      clone.style.position = 'absolute';
      clone.style.left = (canvasLeft * scaleX) + 'px';
      clone.style.top = (canvasTop * scaleY) + 'px';
      clone.style.width = (canvasWidth * scaleX) + 'px';
      clone.style.height = (canvasHeight * scaleY) + 'px';
      
      // 4. Handle Text Scaling inside the clone
      const textElements = clone.querySelectorAll('.design-text');
      textElements.forEach((text, index) => {
          const originalText = child.querySelectorAll('.design-text')[index];
          const originalFontSize = parseInt(window.getComputedStyle(originalText).fontSize);
          text.style.fontSize = (originalFontSize * scaleX) + 'px';
      });

      // 5. Handle Nested Elements (if it's a group)
      if (clone.classList.contains('group-container')) {
          // The children inside the group are already relatively positioned,
          // so we just need to scale their dimensions and font sizes.
          const nestedItems = clone.querySelectorAll('.draggable');
          nestedItems.forEach((nested, idx) => {
              const originalNested = child.querySelectorAll('.draggable')[idx];
              
              // Scale the nested item's dimensions
              nested.style.left = (parseInt(originalNested.style.left) * scaleX) + 'px';
              nested.style.top = (parseInt(originalNested.style.top) * scaleY) + 'px';
              nested.style.width = (parseInt(originalNested.style.width) * scaleX) + 'px';
              nested.style.height = (parseInt(originalNested.style.height) * scaleY) + 'px';
          });
      }

      designContainer.appendChild(clone);
    });
  });
}
function rebindDraggables(){
  document.querySelectorAll('#designCanvas .draggable')
    .forEach(el => {
      makeDraggable(el);
      enableTextEditing(el);
    });
}
/********************************************
 * PRODUCT SWITCHING
 ********************************************/
const productSelect = document.getElementById('productSelect');
productSelect.addEventListener('change', e => {
  currentProduct = e.target.value;

  document.querySelectorAll('.product-stage')
    .forEach(s => s.classList.remove('active-product'));

  document.getElementById(`stage-${currentProduct}`)
    .classList.add('active-product');

  setDefaultPreviewScale();
  updatePreview();
});

/********************************************
 * ZOOM PREVIEW
 ********************************************/
const zoomSlider = document.getElementById('zoomSlider');
zoomSlider.addEventListener('input', () => {
  const activeProductView =
    document.querySelector(`#stage-${currentProduct} .product-view`);

  activeProductView.style.transform = `scale(${zoomSlider.value})`;
});

/********************************************
 * ADD TEXT
 ********************************************/
const addTextBtn = document.getElementById('addTextBtn');
const textInput = document.getElementById('textInput');
const fontSizeInput = document.getElementById('fontSizeInput');
const fontFamilySelect = document.getElementById('fontFamily');
const btnBold = document.getElementById('btnBold');
const btnItalic = document.getElementById('btnItalic');

addTextBtn.addEventListener('click', () => {
  const div = document.createElement('div');
  div.classList.add('draggable');
  
  // Set initial size
  const initialWidth = 150;
  const initialHeight = 50;
  div.style.width = initialWidth + 'px';
  div.style.height = initialHeight + 'px';

  // Calculate pixel-perfect center
  const centerX = (designCanvas.clientWidth / 2) - (initialWidth / 2);
  const centerY = (designCanvas.clientHeight / 2) - (initialHeight / 2);

  // Apply coordinates and styling
  div.style.left = centerX + 'px';
  div.style.top = centerY + 'px';

  div.innerHTML = `
    <span class="design-text" contenteditable="false"
          style="color:${fontColorPicker.getColor().toHEXA().toString()}">
        ${textInput.value}
    </span>
    <div class="resize-handle handle-tl"></div>
    <div class="resize-handle handle-tr"></div>
    <div class="resize-handle handle-bl"></div>
    <div class="resize-handle handle-br"></div>

    <div class="resize-handle handle-t"></div>
    <div class="resize-handle handle-b"></div>
    <div class="resize-handle handle-l"></div>
    <div class="resize-handle handle-r"></div>
  `;
  
  designCanvas.appendChild(div);
  makeDraggable(div);

  saveHistory();
  updatePreview();

function selectItem(el, additive = false) {
    // 1. If not holding Shift, remove the active class from EVERY draggable on the canvas
    if (!additive) {
        designCanvas.querySelectorAll('.draggable').forEach(item => {
            item.classList.remove('active-layer');
        });
        selectedItems = [];
    }

    // 2. Add the item to the selection if it's not already there
    if (!selectedItems.includes(el)) {
        selectedItems.push(el);
        el.classList.add('active-layer');
        activeItem = el;
    } else if (additive) {
        // Toggle off if Shift-clicking an already selected item
        el.classList.remove('active-layer');
        selectedItems = selectedItems.filter(item => item !== el);
    }

    updateLayerList();
}
/********************************************
 * DRAGGABLE
 ********************************************/
function makeDraggable(el) {
  let startX, startY, initX, initY, initW, initH;
  let currentHandle = null;

  // REMOVED: Separate 'click' listener to prevent double-firing with mousedown

  el.addEventListener('mousedown', e => {
    // If editing text, don't drag
    if (e.target.classList.contains('design-text') && el.classList.contains('editing')) return;
    
    if (e.target.classList.contains('resize-handle')) {
        isResizing = true;
        currentHandle = e.target;
        
        // Initial Group Stats
        initX = parseInt(el.style.left) || 0;
        initY = parseInt(el.style.top) || 0;
        initW = el.offsetWidth;
        initH = el.offsetHeight;

        // Initial Children Stats (Capture these ONLY once at mousedown)
        if (el.classList.contains('group-container')) {
            el.querySelectorAll(':scope > .draggable').forEach(child => {
                child.dataset.startL = parseInt(child.style.left) || 0;
                child.dataset.startT = parseInt(child.style.top) || 0;
                child.dataset.startW = parseInt(child.style.width) || child.offsetWidth;
                child.dataset.startH = parseInt(child.style.height) || child.offsetHeight;
                child.dataset.startFS = parseFloat(window.getComputedStyle(child).fontSize);
            });
        }
    }
    // 1. Handle Selection Logic
    const isShift = e.shiftKey;
    
    // If the item isn't part of the current selection, update selection
    if (!selectedItems.includes(el)) {
      selectItem(el, isShift);
    } else if (isShift) {
      // If Shift is held and it's already selected, remove it (toggle)
      el.classList.remove('active-layer');
      selectedItems = selectedItems.filter(item => item !== el);
      return; // Stop here if we're just deselecting
    }

    // 2. Setup dragging/resizing coordinates
    startX = e.clientX;
    startY = e.clientY;

    if (e.target.classList.contains('resize-handle')) {
      isResizing = true;
      currentHandle = e.target;
      initX = parseInt(el.style.left) || 0;
      initY = parseInt(el.style.top) || 0;
      initW = el.offsetWidth;
      initH = el.offsetHeight;
    } else {
      // Setup group movement
      selectedItems.forEach(item => {
        item.dataset.initX = parseInt(item.style.left) || 0;
        item.dataset.initY = parseInt(item.style.top) || 0;
      });
    }

    document.addEventListener('mousemove', dragMove);
    document.addEventListener('mouseup', dragUp);
    
    // Prevent browser image ghosting/drag defaults
    e.preventDefault(); 
  });

  function dragMove(e) {
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;

    if (isResizing && currentHandle) {
    let newWidth = initW;
    let newHeight = initH;
    let newLeft = initX;
    let newTop = initY;

    // 1. Calculate the new dimensions of the Bound Box
    if (currentHandle.classList.contains('handle-br')) {
        newWidth = initW + dx;
        newHeight = initH + dy;
    } else if (currentHandle.classList.contains('handle-bl')) {
        newWidth = initW - dx;
        newHeight = initH + dy;
        newLeft = initX + dx;
    } else if (currentHandle.classList.contains('handle-tr')) {
        newWidth = initW + dx;
        newHeight = initH - dy;
        newTop = initY + dy;
    } else if (currentHandle.classList.contains('handle-tl')) {
        newWidth = initW - dx;
        newHeight = initH - dy;
        newLeft = initX + dx;
        newTop = initY + dy;
    }

    // Constraints
    newWidth = Math.max(20, newWidth);
    newHeight = Math.max(20, newHeight);

    // 2. Calculate the SCALE RATIO based on the starting size
    const ratioX = newWidth / initW;
    const ratioY = newHeight / initH;

    // 3. Apply to the Bound Box (The Group itself)
    el.style.width = newWidth + 'px';
    el.style.height = newHeight + 'px';
    el.style.left = newLeft + 'px';
    el.style.top = newTop + 'px';

    // 4. Scale Children Proportionally
    if (el.classList.contains('group-container')) {
        const children = el.querySelectorAll(':scope > .draggable');
        children.forEach(child => {
            // Get original positions stored when the group was first created/clicked
            const startL = parseFloat(child.dataset.startL);
            const startT = parseFloat(child.dataset.startT);
            const startW = parseFloat(child.dataset.startW);
            const startH = parseFloat(child.dataset.startH);
            const startFS = parseFloat(child.dataset.startFS);

            child.style.left = (startL * ratioX) + 'px';
            child.style.top = (startT * ratioY) + 'px';
            child.style.width = (startW * ratioX) + 'px';
            child.style.height = (startH * ratioY) + 'px';
            
            if (child.querySelector('.design-text')) {
                child.style.fontSize = (startFS * ratioX) + 'px';
            }
        });
    }
    return;
}

    // --- MULTI-MOVE DRAG ---
    if (!isResizing) {
      selectedItems.forEach(item => {
        const itemInitX = parseInt(item.dataset.initX);
        const itemInitY = parseInt(item.dataset.initY);

        let newLeft = itemInitX + dx;
        let newTop = itemInitY + dy;

        const maxLeft = designCanvas.clientWidth - item.offsetWidth;
        const maxTop = designCanvas.clientHeight - item.offsetHeight;

        item.style.left = Math.max(0, Math.min(newLeft, maxLeft)) + 'px';
        item.style.top = Math.max(0, Math.min(newTop, maxTop)) + 'px';
      });
    }
  }

  function dragUp() {
    document.removeEventListener('mousemove', dragMove);
    document.removeEventListener('mouseup', dragUp);
    if (isResizing || (selectedItems.length > 0)) {
      saveHistory();
      updatePreview();
    }
    isResizing = false;
    currentHandle = null;
  }
}
function enableTextEditing(el) {
  const textEl = el.querySelector('.design-text');
  if (!textEl) return;

  textEl.addEventListener('dblclick', (e) => {
    e.stopPropagation();

    textEl.setAttribute('contenteditable', 'true');
    textEl.focus();
    document.execCommand('selectAll', false, null);

    el.classList.add('editing');
  });

  textEl.addEventListener('blur', () => {
    textEl.setAttribute('contenteditable', 'false');
    el.classList.remove('editing');
    saveHistory();
    updatePreview();
  });

  textEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      textEl.blur();
    }
  });
}

    } else if (type === 'triangle') {

    `;

    // Update dependencies
    if(typeof updateLayerList === 'function') updateLayerList();
    if(typeof saveHistory === 'function') saveHistory();
    if(typeof updatePreview === 'function') updatePreview();
}

function groupSelected() {
    if (selectedItems.length < 2) return;

    // 1. Find the bounding box of all selected items
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;

    selectedItems.forEach(item => {
        const x = parseInt(item.style.left);
        const y = parseInt(item.style.top);
        const w = item.offsetWidth;
        const h = item.offsetHeight;

        if (x < minX) minX = x;
        if (y < minY) minY = y;
        if (x + w > maxX) maxX = x + w;
        if (y + h > maxY) maxY = y + h;
    });

    // 2. Create the Group Container
    const group = document.createElement('div');
    group.classList.add('draggable', 'group-container');
    group.style.left = minX + 'px';
    group.style.top = minY + 'px';
    group.style.width = (maxX - minX) + 'px';
    group.style.height = (maxY - minY) + 'px';
    
    // Add resize handles to the group itself
    group.innerHTML = `
        <div class="resize-handle handle-tl"></div><div class="resize-handle handle-tr"></div>
        <div class="resize-handle handle-bl"></div><div class="resize-handle handle-br"></div>
    `;

    // 3. Move items into the group and adjust their relative positions
    selectedItems.forEach(item => {
        const oldX = parseInt(item.style.left);
        const oldY = parseInt(item.style.top);
        
        item.style.left = (oldX - minX) + 'px';
        item.style.top = (oldY - minY) + 'px';
        item.classList.remove('active-layer');
        
        // Remove individual resize handles while in a group to prevent confusion
        const handles = item.querySelectorAll('.resize-handle');
        handles.forEach(h => h.style.display = 'none');
        
        group.appendChild(item);
    });

    designCanvas.appendChild(group);
    makeDraggable(group);
    
    // Select the new group
    selectedItems = [group];
    group.classList.add('active-layer');

    saveHistory();
    updateLayerList();
}

function ungroupSelected() {
    // Only target items that are actually groups
    const groups = selectedItems.filter(item => item.classList.contains('group-container'));
    
    groups.forEach(group => {
        const groupX = parseInt(group.style.left) || 0;
        const groupY = parseInt(group.style.top) || 0;
        
        // Find all draggable children inside this group
        const children = Array.from(group.children).filter(child => child.classList.contains('draggable'));

        children.forEach(child => {
            const relX = parseInt(child.style.left) || 0;
            const relY = parseInt(child.style.top) || 0;

            // 1. Restore absolute position on the main canvas
            child.style.left = (groupX + relX) + 'px';
            child.style.top = (groupY + relY) + 'px';
            
            // 2. IMPORTANT: Remove selection styling and hide handles
            child.classList.remove('active-layer');
            const handles = child.querySelectorAll('.resize-handle');
            handles.forEach(h => h.style.display = 'none'); // Force hide handles

            // 3. Move back to the main designCanvas
            designCanvas.appendChild(child);
        });

        // 4. Remove the now-empty group container
        group.remove();
    });

    // 5. Reset global selection state so boxes don't "ghost"
    selectedItems = [];
    activeItem = null;
    
    saveHistory();
    updateLayerList();
    updatePreview();
}

window.addEventListener('keydown', e => {
    const key = e.key.toLowerCase();

    // 1. SELECT ALL (Ctrl + A)
    if ((e.ctrlKey || e.metaKey) && key === 'a') {
        // Only run if we aren't currently typing in a text box
        if (document.activeElement.tagName !== 'INPUT' && !document.activeElement.isContentEditable) {
            e.preventDefault();
            
            // Clear existing selection visual
            selectedItems.forEach(item => item.classList.remove('active-layer'));
            
            // Select only top-level draggables (prevents "double-selecting" group children)
            selectedItems = Array.from(designCanvas.querySelectorAll(':scope > .draggable'));
            
            selectedItems.forEach(item => item.classList.add('active-layer'));
            
            if (selectedItems.length > 0) {
                activeItem = selectedItems[selectedItems.length - 1];
            }
            
            updateLayerList();
            console.log("Selected all top-level items");
        }
    }

    // 2. GROUP (Ctrl + G)
    if (e.ctrlKey && key === 'g' && !e.shiftKey) {
        e.preventDefault();
        groupSelected();
    }

    // 3. UNGROUP (Ctrl + Shift + G)
    if (e.ctrlKey && e.shiftKey && key === 'g') {
        e.preventDefault();
        ungroupSelected();
    }

    // 4. DELETE (Delete / Backspace)
    if (e.key === 'Delete' || e.key === 'Backspace') {
        if (selectedItems.length > 0 && !document.activeElement.isContentEditable && document.activeElement.tagName !== 'INPUT') {
            selectedItems.forEach(item => item.remove());
            selectedItems = [];
            saveHistory();
            updateLayerList();
            updatePreview();
        }
    }
});
