<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Custom Design Studio - Precise Text</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/themes/classic.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/pickr.min.js"></script>

  <style>
    :root {
      --primary: #111827;
      --accent: #3b82f6;
      --bg-light: #f5f5f5;
      --border-color: #ddd;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-light);
      margin: 0;
      padding: 10px;
      display: flex;
      justify-content: center;
      user-select: none;
      box-sizing: border-box;
    }

    .studio-wrapper {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      padding: 15px;
      width: 100%;
      display: grid;
      grid-template-columns: 240px 1fr 240px;
      gap: 15px;
      box-sizing: border-box;
    }

    .gallery-panel {
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 10px;
      background: #f9fafb;
      display: flex;
      flex-direction: column;
      height: 550px;
      overflow: hidden;
    }
    .gallery-header { margin-bottom: 10px; display: flex; flex-direction: column; gap: 5px; }
    .gallery-title { font-size: 13px; font-weight: bold; color: #333; }
    
    .gallery-search {
        padding: 5px; border-radius: 6px; border: 1px solid #ddd; font-size: 11px; width: 100%; box-sizing: border-box;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(50px, 1fr));
      gap: 8px;
      overflow-y: auto;
      padding-right: 5px;
      flex-grow: 1;
    }
    .gallery-item {
      width: 50px; height: 50px;
      border: 2px solid #eee;
      border-radius: 8px;
      cursor: pointer;
      object-fit: contain;
      background: white;
      transition: all 0.2s;
    }
    .gallery-item:hover { border-color: var(--accent); transform: scale(1.05); }

    .preview-container {
      background: #e5e7eb;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
      position: relative;
      min-height: 500px;
      gap: 15px;
      overflow: hidden;
    }

    .product-stage {
        display: none;
        position: relative;
        transform-origin: center;
        transition: transform 0.1s ease-out;
        align-items: center;
        justify-content: center;
    }
    .product-stage.active-product {
        display: flex;
        gap: 10px;
    }

    .product-view {
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      position: relative;
      overflow: hidden;
      background-color: white;
      cursor: pointer;
      border: 3px solid transparent; 
      transition: all 0.3s;
    }

    .view-tshirt { width: 240px; height: 250px; clip-path: polygon(25% 0%, 75% 0%, 100% 20%, 85% 35%, 85% 100%, 15% 100%, 15% 35%, 0% 20%); }
    .view-tumbler { width: 100px; height: 250px; border-radius: 10px; }
    .view-mug { width: 150px; height: 130px; border-radius: 10px 10px 50px 50px; }

    .draggable {
      position: absolute;
      cursor: move;
      border: 2px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 20px;
      min-height: 20px;
      box-sizing: border-box;
      touch-action: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .draggable.active-layer { border: 2px solid var(--accent); }
    .draggable img { max-width: 100%; max-height: 100%; pointer-events: none; }
    
    .design-text { 
        text-align: center; 
        pointer-events: none;
        word-break: break-word;
        display: block;
        width: 100%;
        line-height: 1.2;
    }

    .resize-handle {
        width: 10px; height: 10px; background: white; border: 2px solid var(--accent);
        position: absolute; display: none; cursor: nwse-resize;
    }
    .draggable.active-layer .resize-handle { display: block; }
    .handle-br { bottom: -5px; right: -5px; }

    .controls-panel { display: flex; flex-direction: column; gap: 10px; }
    .control-group { display: flex; flex-direction: column; gap: 3px; }
    label { font-weight: 600; font-size: 10px; color: #666; text-transform: uppercase; }
    input, select { padding: 6px; border-radius: 6px; border: 1px solid #ddd; font-size: 12px;}
    
    #bgPicker { border: 1px solid #ddd; border-radius: 6px; padding: 3px; background: white; display: inline-block;}

    .layer-manager {
        background: #f3f4f6; padding: 8px; border-radius: 8px; border: 1px solid #e5e7eb;
        max-height: 150px; overflow-y: auto;
    }
    
    .layer-item {
        display: flex; justify-content: space-between; align-items: center;
        background: white; padding: 6px 8px; border-radius: 4px; margin-bottom: 4px; font-size: 11px;
        border: 1px solid #eee;
        cursor: grab;
    }
    
    .btn-icon { background: #eee; border: none; padding: 2px 5px; border-radius: 3px; cursor: pointer; font-size: 9px; }
    .btn-delete { background: #fee2e2; color: #991b1b; }

    .btn-group { display: flex; gap: 8px; margin-top: 5px; }
    button { padding: 8px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; font-size: 12px;}
    
    .btn-style { background: #f3f4f6; color: #333; font-weight: bold; padding: 6px 10px; font-size: 14px; border: 1px solid #ddd;}
    .btn-style.active { background: var(--accent); color: white; border-color: var(--accent); }
    
    .btn-primary { background: var(--primary); color: white; flex: 1; }
    .btn-action { background: #dbeafe; color: #1e40af; }
    .btn-download { background: #d1fae5; color: #065f46; flex: 1; }
    
    #textEditor { display: none; background: #f3f4f6; padding: 8px; border-radius: 8px; }
    .size-controls { display: flex; align-items: center; gap: 5px; margin-bottom: 5px; }
    .size-controls input { width: 50px; }
  </style>
  
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Bungee&family=Creepster&family=Lobster&family=Monoton&family=Montserrat:wght@400;900&family=Pacifico&family=Playfair+Display:wght@700&family=Press+Start+2P&family=Rock+Salt&family=Special+Elite&display=swap" rel="stylesheet">
</head>
<body>

<div class="studio-wrapper">
  
  <div class="gallery-panel">
    <div class="gallery-header">
        <div class="gallery-title">Assets (Pixabay)</div>
        <input type="text" id="gallerySearch" class="gallery-search" placeholder="Search icons...">
    </div>
    <div class="gallery-grid" id="galleryGrid"></div>
    <hr style="border: 0; border-top: 1px solid #eee; margin: 10px 0;">
    <div class="control-group">
        <label>Upload Local Image</label>
        <input type="file" id="imageInput" accept="image/*" style="padding: 3px;" />
    </div>
  </div>

  <div class="preview-container">
    <div id="stage-tshirt" class="product-stage active-product">
        <div id="view-tshirt" class="product-view view-tshirt"></div>
    </div>
    <div id="stage-tumbler" class="product-stage">
        <div id="view-tumbler" class="product-view view-tumbler"></div>
    </div>
    <div id="stage-mug" class="product-stage">
        <div id="view-mug" class="product-view view-mug"></div>
    </div>
  </div>

  <div class="controls-panel">
    <h3 style="margin:0; font-size: 16px;">Editor</h3>
    
    <div class="control-group">
        <label>Select Product</label>
        <select id="productSelect">
            <option value="tshirt">T-Shirt</option>
            <option value="tumbler">Tumbler</option>
            <option value="mug">Mug</option>
        </select>
    </div>
    
    <div class="control-group">
        <label>Zoom</label>
        <input type="range" id="zoomSlider" min="0.5" max="2" step="0.1" value="1">
    </div>

    <div class="control-group">
        <label>Product Color</label>
        <div id="bgPicker"></div>
    </div>

    <div class="control-group">
        <label>Add Text</label>
        <div style="display:flex; gap:3px;">
            <input type="text" id="textInput" placeholder="Enter text..." value="Text" style="flex:1"/>
            <button class="btn-action" id="addTextBtn">Add</button>
        </div>
    </div>
    
    <div id="textEditor">
        <label style="color: var(--accent); font-size: 10px;">Text Style</label>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 3px; align-items: center;">
            <div id="fontColorPicker" style="border: 1px solid #ddd; border-radius: 6px; padding: 2px; background: white; height: 20px;"></div>
            
            <div class="size-controls">
                <label style="font-size: 9px;">SIZE</label>
                <input type="number" id="fontSizeInput" min="8" max="150" value="24">
            </div>

            <select id="fontFamily" style="grid-column: span 2; padding: 4px;">
                <option value="'Montserrat', sans-serif">Modern: Montserrat</option>
                <option value="'Playfair Display', serif">Classic: Playfair</option>
                <option value="'Pacifico', cursive">Script: Pacifico</option>
                <option value="'Lobster', cursive">Bold Script: Lobster</option>
                <option value="'Bungee', cursive">Block: Bungee</option>
                <option value="'Anton', sans-serif">Impact: Anton</option>
                <option value="'Bangers', cursive">Comic: Bangers</option>
                <option value="'Rock Salt', cursive">Handwritten: Rock Salt</option>
                <option value="'Monoton', cursive">Retro: Monoton</option>
                <option value="'Special Elite', cursive">Typewriter: Special Elite</option>
                <option value="'Creepster', cursive">Horror: Creepster</option>
                <option value="'Press Start 2P', cursive">Pixel: Press Start</option>
            </select>
            
            <button id="btnBold" class="btn-style" title="Bold">B</button>
            <button id="btnItalic" class="btn-style" title="Italic"><em>I</em></button>
        </div>
    </div>

    <div class="layer-manager">
        <label style="color: var(--accent); margin-bottom: 5px; display: block; font-size: 10px;">Layers</label>
        <div id="layerList"></div>
    </div>

    <div class="btn-group">
        <button class="btn-download" id="downloadBtn">💾 PNG</button>
        <button class="btn-primary" id="submitDesign">Submit</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>
  const PIXABAY_API_KEY = '54841320-2fc493da46915b0eb0a6f740c';
  let activeViewId = 'view-tshirt';
  let currentProduct = 'tshirt';

  document.getElementById('productSelect').addEventListener('change', (e) => {
      currentProduct = e.target.value;
      document.querySelectorAll('.product-stage').forEach(s => s.classList.remove('active-product'));
      const stage = document.getElementById('stage-' + currentProduct);
      stage.classList.add('active-product');
      activeViewId = stage.querySelector('.product-view').id;
      document.getElementById('zoomSlider').value = 1;
      stage.style.transform = 'scale(1)';
  });

  document.getElementById('zoomSlider').addEventListener('input', (e) => {
      document.querySelector('.active-product').style.transform = `scale(${e.target.value})`;
  });

  const swatches = ['#FFFFFF', '#000000', '#FF0000', '#00FF00', '#0000FF', '#FFFF00', '#FF00FF', '#00FFFF'];
  const createColorPicker = (selector, defaultColor) => Pickr.create({
      el: selector, theme: 'classic', default: defaultColor, swatches: swatches,
      components: { preview: true, opacity: true, hue: true, interaction: { hex: true, input: true, save: true } }
  });

  const bgPicker = createColorPicker('#bgPicker', '#ffffff');
  const fontColorPicker = createColorPicker('#fontColorPicker', '#000000');

  bgPicker.on('change', (color) => document.querySelectorAll('.product-view').forEach(v => v.style.backgroundColor = color.toRGBA().toString()));
  fontColorPicker.on('change', (color) => {
      const active = document.querySelector('.active-layer .design-text');
      if(active) active.style.color = color.toRGBA().toString();
  });
  
  document.getElementById('fontFamily').addEventListener('change', (e) => {
      const active = document.querySelector('.active-layer .design-text');
      if(active) active.style.fontFamily = e.target.value;
  });

  // --- TEXT SIZE INPUT ---
  document.getElementById('fontSizeInput').addEventListener('input', (e) => {
      const active = document.querySelector('.active-layer');
      if(active) {
          const text = active.querySelector('.design-text');
          if(text) {
              const size = e.target.value;
              text.style.fontSize = size + 'px';
              // Update container width to fit text roughly
              active.style.width = 'auto';
              active.style.height = 'auto';
          }
      }
  });
  
  document.getElementById('btnBold').addEventListener('click', (e) => {
      const active = document.querySelector('.active-layer .design-text');
      if(active) active.style.fontWeight = active.style.fontWeight === 'bold' ? 'normal' : 'bold';
  });

  document.getElementById('btnItalic').addEventListener('click', (e) => {
      const active = document.querySelector('.active-layer .design-text');
      if(active) active.style.fontStyle = active.style.fontStyle === 'italic' ? 'normal' : 'italic';
  });

  async function loadGallery(searchTerm = '') {
    const grid = document.getElementById('galleryGrid');
    const apiUrl = `https://pixabay.com/api/?key=${PIXABAY_API_KEY}&q=${encodeURIComponent(searchTerm)}&image_type=all&per_page=15`;
    try {
        const response = await fetch(apiUrl);
        const data = await response.json();
        grid.innerHTML = '';
        data.hits.forEach(image => {
            const img = document.createElement('img');
            img.src = image.previewURL;
            img.className = 'gallery-item';
            img.onclick = () => createLayer('image', image.largeImageURL);
            grid.appendChild(img);
        });
    } catch (error) {}
  }
  document.getElementById('gallerySearch').addEventListener('input', (e) => loadGallery(e.target.value));
  loadGallery();

  let layerCount = 0;
  function createLayer(type, content) {
    layerCount++;
    const layerId = 'layer_' + layerCount;
    const layer = document.createElement('div');
    layer.id = layerId;
    layer.className = 'draggable active-layer';
    const activeView = document.getElementById(activeViewId);
    layer.style.top = '100px'; layer.style.left = '50px';
    
    if (type === 'image') {
        const img = document.createElement('img');
        img.src = content; img.style.width = '50px'; 
        layer.appendChild(img);
        addLayerToList(layerId, 'Image');
        document.getElementById('textEditor').style.display = 'none';
    } else {
        const text = document.createElement('div');
        text.className = 'design-text';
        text.textContent = content;
        text.style.fontSize = '24px';
        text.style.fontFamily = document.getElementById('fontFamily').value;
        layer.appendChild(text);
        addLayerToList(layerId, 'Text');
        document.getElementById('textEditor').style.display = 'block';
        document.getElementById('fontSizeInput').value = 24;
    }

    const handle = document.createElement('div');
    handle.className = 'resize-handle handle-br';
    layer.appendChild(handle);
    activeView.appendChild(layer);
    makeDraggable(layer);
    makeResizable(layer, handle, type);
    document.querySelectorAll('.draggable').forEach(d => d.classList.remove('active-layer'));
    layer.classList.add('active-layer');
  }

  function addLayerToList(id, name) {
      const item = document.createElement('div');
      item.className = 'layer-item';
      item.id = 'list_' + id;
      item.innerHTML = `<span>${name}</span><button class="btn-icon btn-delete" onclick="removeLayer('${id}')">X</button>`;
      document.getElementById('layerList').prepend(item);
  }

  function removeLayer(id) {
      document.getElementById(id).remove();
      document.getElementById('list_' + id).remove();
  }

  let activeItem = null, offset = { x: 0, y: 0 }, isResizing = false;

  function makeDraggable(el) {
    el.addEventListener('mousedown', (e) => {
      if (isResizing) return;
      activeItem = el;
      document.querySelectorAll('.draggable').forEach(d => d.classList.remove('active-layer'));
      el.classList.add('active-layer');
      const rect = el.getBoundingClientRect();
      offset.x = e.clientX - rect.left;
      offset.y = e.clientY - rect.top;
      
      const text = el.querySelector('.design-text');
      if(text) {
          document.getElementById('textEditor').style.display = 'block';
          document.getElementById('fontFamily').value = text.style.fontFamily.replace(/"/g, "'");
          document.getElementById('fontSizeInput').value = parseInt(text.style.fontSize);
      } else {
          document.getElementById('textEditor').style.display = 'none';
      }
    });
  }

  function makeResizable(el, handle, type) {
      handle.addEventListener('mousedown', (e) => {
          isResizing = true; activeItem = el; e.stopPropagation();
          document.addEventListener('mousemove', resize);
          document.addEventListener('mouseup', () => { isResizing = false; document.removeEventListener('mousemove', resize); });
      });

      function resize(e) {
          const elRect = el.getBoundingClientRect();
          const nw = e.clientX - elRect.left, nh = e.clientY - elRect.top;
          el.style.width = Math.max(15, nw) + 'px';
          el.style.height = Math.max(15, nh) + 'px';
          if(type === 'image') el.querySelector('img').style.width = '100%';
          else {
              const newSize = Math.max(8, Math.round(nw * 0.3));
              el.querySelector('.design-text').style.fontSize = newSize + 'px';
              document.getElementById('fontSizeInput').value = newSize;
          }
      }
  }

  document.addEventListener('mousemove', (e) => {
    if (!activeItem || isResizing) return;
    const container = activeItem.parentNode.getBoundingClientRect();
    activeItem.style.left = (e.clientX - container.left - offset.x) + 'px';
    activeItem.style.top = (e.clientY - container.top - offset.y) + 'px';
  });
  document.addEventListener('mouseup', () => activeItem = null);

  document.getElementById('addTextBtn').addEventListener('click', () => {
      const val = document.getElementById('textInput').value;
      if(val) createLayer('text', val);
  });

  document.getElementById('imageInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = (ev) => createLayer('image', ev.target.result);
      reader.readAsDataURL(file);
    }
  });

  document.getElementById('downloadBtn').addEventListener('click', () => {
    document.querySelectorAll('.draggable').forEach(d => d.classList.remove('active-layer'));
    html2canvas(document.querySelector('.active-product'), { backgroundColor: null }).then(canvas => {
        const link = document.createElement('a');
        link.download = currentProduct + '-design.png';
        link.href = canvas.toDataURL();
        link.click();
    });
  });

  document.getElementById('submitDesign').addEventListener('click', () => alert('Design Submitted!'));
</script>
</body>
</html>
