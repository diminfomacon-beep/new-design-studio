<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Custom Design Studio - Color Swatches</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/themes/classic.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/pickr.min.js"></script>

  <style>
    :root {
      --primary: #111827;
      --accent: #3b82f6;
      --bg-light: #f5f5f5;
      --border-color: #ddd;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-light);
      margin: 0;
      padding: 10px;
      display: flex;
      justify-content: center;
      user-select: none;
      box-sizing: border-box;
    }

    .studio-wrapper {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      padding: 15px;
      width: 100%;
      display: grid;
      grid-template-columns: 240px 1fr 240px;
      gap: 15px;
      box-sizing: border-box;
    }

    /* GALLERY PANEL */
    .gallery-panel {
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 10px;
      background: #f9fafb;
      display: flex;
      flex-direction: column;
      height: 550px;
      overflow: hidden;
    }
    .gallery-header { margin-bottom: 10px; display: flex; flex-direction: column; gap: 5px; }
    .gallery-title { font-size: 13px; font-weight: bold; color: #333; }
    
    .gallery-search {
        padding: 5px; border-radius: 6px; border: 1px solid #ddd; font-size: 11px; width: 100%; box-sizing: border-box;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(50px, 1fr));
      gap: 8px;
      overflow-y: auto;
      padding-right: 5px;
      flex-grow: 1;
    }
    .gallery-item {
      width: 50px; height: 50px;
      border: 2px solid #eee;
      border-radius: 8px;
      cursor: pointer;
      object-fit: contain;
      background: white;
      transition: all 0.2s;
    }
    .gallery-item:hover { border-color: var(--accent); transform: scale(1.05); }

    /* PREVIEW PANEL */
    .preview-container {
      background: #e5e7eb;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
      position: relative;
      min-height: 500px;
      gap: 15px;
      overflow: hidden;
    }

    .product-stage {
        display: none;
        position: relative;
        transform-origin: center;
        transition: transform 0.1s ease-out;
        align-items: center;
        justify-content: center;
    }
    .product-stage.active-product {
        display: flex;
        gap: 10px;
    }

    .product-view {
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      position: relative;
      overflow: hidden;
      background-color: white;
      cursor: pointer;
      border: 3px solid transparent;
      transition: all 0.3s;
    }
    .product-view.active-view {
        border: 3px solid var(--accent);
    }

    /* PRODUCT SHAPES & PRINT AREAS */
    
    /* T-Shirt */
    .view-tshirt { width: 240px; height: 250px; clip-path: polygon(25% 0%, 75% 0%, 100% 20%, 85% 35%, 85% 100%, 15% 100%, 15% 35%, 0% 20%); }
    .print-area-tshirt-front { width: 45px; height: 45px; top: 65px; right: 50px; }
    .print-area-tshirt-back { width: 100px; height: 60px; top: 40px; left: 70px; }

    /* Tumbler */
    .view-tumbler { width: 100px; height: 250px; border-radius: 10px; }
    .print-area-tumbler { width: 70px; height: 180px; top: 35px; left: 15px; }

    /* Mug */
    .view-mug { width: 150px; height: 130px; border-radius: 10px 10px 50px 50px; }
    .print-area-mug { width: 100px; height: 90px; top: 20px; left: 25px; }

    .print-area {
        position: absolute;
        border: 2px dashed rgba(0,0,0,0.3);
        pointer-events: none;
        background: rgba(255,255,255,0.1);
    }
    
    /* LAYERS */
    .draggable {
      position: absolute;
      cursor: move;
      border: 2px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 20px;
      min-height: 20px;
      box-sizing: border-box;
      touch-action: none;
    }
    .draggable.active-layer { border: 2px solid var(--accent); }
    .draggable img { max-width: 100%; max-height: 100%; pointer-events: none; }
    
    .design-text { 
        text-align: center; 
        pointer-events: none;
        word-break: break-word;
        display: block;
        width: 100%;
        line-height: 1.2;
    }

    /* RESIZE HANDLES */
    .resize-handle {
        width: 10px; height: 10px; background: white; border: 2px solid var(--accent);
        position: absolute; display: none; cursor: nwse-resize;
    }
    .draggable.active-layer .resize-handle { display: block; }
    .handle-br { bottom: -5px; right: -5px; }

    /* CONTROLS PANEL */
    .controls-panel { display: flex; flex-direction: column; gap: 10px; }
    .control-group { display: flex; flex-direction: column; gap: 3px; }
    label { font-weight: 600; font-size: 10px; color: #666; text-transform: uppercase; }
    input, select { padding: 6px; border-radius: 6px; border: 1px solid #ddd; font-size: 12px;}
    
    #bgPicker { border: 1px solid #ddd; border-radius: 6px; padding: 3px; background: white; display: inline-block;}

    .layer-manager {
        background: #f3f4f6; padding: 8px; border-radius: 8px; border: 1px solid #e5e7eb;
        max-height: 150px; overflow-y: auto;
    }
    
    .layer-item {
        display: flex; justify-content: space-between; align-items: center;
        background: white; padding: 6px 8px; border-radius: 4px; margin-bottom: 4px; font-size: 11px;
        border: 1px solid #eee;
        cursor: grab;
    }
    
    .btn-icon { background: #eee; border: none; padding: 2px 5px; border-radius: 3px; cursor: pointer; font-size: 9px; }
    .btn-delete { background: #fee2e2; color: #991b1b; }

    .btn-group { display: flex; gap: 8px; margin-top: 5px; }
    button { flex: 1; padding: 8px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; font-size: 12px;}
    .btn-primary { background: var(--primary); color: white; }
    .btn-action { background: #dbeafe; color: #1e40af; }
    .btn-download { background: #d1fae5; color: #065f46; }
    
    #textEditor { display: none; background: #f3f4f6; padding: 8px; border-radius: 8px; }
  </style>
  
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Lobster&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="studio-wrapper">
  
  <div class="gallery-panel">
    <div class="gallery-header">
        <div class="gallery-title">Assets (Pixabay)</div>
        <input type="text" id="gallerySearch" class="gallery-search" placeholder="Search icons...">
    </div>
    
    <div id="galleryLoader" style="display:none; font-size:12px; text-align:center;">Loading...</div>
    
    <div class="gallery-grid" id="galleryGrid"></div>
    
    <hr style="border: 0; border-top: 1px solid #eee; margin: 10px 0;">
    <div class="control-group">
        <label>Upload Local Image</label>
        <input type="file" id="imageInput" accept="image/*" style="padding: 3px;" />
    </div>
  </div>

  <div class="preview-container">
    <label style="font-size: 12px; color: #333;">Click a side to edit</label>
    
    <div id="stage-tshirt" class="product-stage active-product">
        <div id="view-tshirt-front" class="product-view view-tshirt active-view" onclick="setActiveView('view-tshirt-front')">
            <div class="print-area print-area-tshirt-front"></div>
        </div>
        <div id="view-tshirt-back" class="product-view view-tshirt" onclick="setActiveView('view-tshirt-back')">
            <div class="print-area print-area-tshirt-back"></div>
        </div>
    </div>

    <div id="stage-tumbler" class="product-stage">
        <div id="view-tumbler-front" class="product-view view-tumbler active-view" onclick="setActiveView('view-tumbler-front')">
            <div class="print-area print-area-tumbler"></div>
        </div>
    </div>

    <div id="stage-mug" class="product-stage">
        <div id="view-mug-front" class="product-view view-mug active-view" onclick="setActiveView('view-mug-front')">
            <div class="print-area print-area-mug"></div>
        </div>
    </div>
  </div>

  <div class="controls-panel">
    <h3 style="margin:0; font-size: 16px;">Editor</h3>
    
    <div class="control-group">
        <label>Select Product</label>
        <select id="productSelect">
            <option value="tshirt">T-Shirt</option>
            <option value="tumbler">Tumbler</option>
            <option value="mug">Mug</option>
        </select>
    </div>
    
    <div class="control-group">
        <label>Zoom</label>
        <input type="range" id="zoomSlider" min="0.5" max="2" step="0.1" value="1">
    </div>

    <div class="control-group">
        <label>Color</label>
        <div id="bgPicker"></div>
    </div>

    <div class="control-group">
        <label>Add Text</label>
        <div style="display:flex; gap:3px;">
            <input type="text" id="textInput" placeholder="Enter text..." value="Text" style="flex:1"/>
            <button class="btn-action" id="addTextBtn">Add</button>
        </div>
    </div>
    
    <div id="textEditor">
        <label style="color: var(--accent); font-size: 10px;">Text Style</label>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 3px; align-items: center;">
            <div id="fontColorPicker" style="border: 1px solid #ddd; border-radius: 6px; padding: 2px; background: white; height: 20px;"></div>
            <select id="fontFamily" style="grid-column: span 2; padding: 4px;">
                <option value="Roboto">Roboto</option>
                <option value="'Playfair Display'">Playfair</option>
            </select>
        </div>
    </div>

    <div class="layer-manager">
        <label style="color: var(--accent); margin-bottom: 5px; display: block; font-size: 10px;">Layers</label>
        <div id="layerList"></div>
    </div>

    <div class="btn-group">
        <button class="btn-download" id="downloadBtn">💾 PNG</button>
        <button class="btn-primary" id="submitDesign">Submit</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>
  const PIXABAY_API_KEY = '54841320-2fc493da46915b0eb0a6f740c';
  let activeViewId = 'view-tshirt-front';
  let currentProduct = 'tshirt';

  // --- PRODUCT SWITCHER ---
  document.getElementById('productSelect').addEventListener('change', (e) => {
      currentProduct = e.target.value;
      document.querySelectorAll('.product-stage').forEach(s => s.classList.remove('active-product'));
      const stage = document.getElementById('stage-' + currentProduct);
      stage.classList.add('active-product');
      setActiveView(stage.querySelector('.product-view').id);
      document.getElementById('zoomSlider').value = 1;
      stage.style.transform = 'scale(1)';
  });

  // --- ZOOM FUNCTIONALITY ---
  document.getElementById('zoomSlider').addEventListener('input', (e) => {
      const scale = e.target.value;
      document.querySelector('.active-product').style.transform = `scale(${scale})`;
  });

  function setActiveView(viewId) {
      activeViewId = viewId;
      document.querySelectorAll('.product-view').forEach(v => v.classList.remove('active-view'));
      document.getElementById(viewId).classList.add('active-view');
  }

  // --- COLOR PICKERS WITH SWATCHES ---
  const swatches = [
      '#FFFFFF', '#000000', '#FF0000', '#00FF00', '#0000FF', 
      '#FFFF00', '#FF00FF', '#00FFFF', '#FFA500', '#800080'
  ];

  const createColorPicker = (selector, defaultColor) => {
      return Pickr.create({
          el: selector,
          theme: 'classic', 
          default: defaultColor,
          swatches: swatches, // ADDED SWATCHES
          components: { 
              preview: true, 
              opacity: true, 
              hue: true, 
              interaction: { hex: true, input: true, save: true } 
          }
      });
  };

  const bgPicker = createColorPicker('#bgPicker', '#ffffff');
  const fontColorPicker = createColorPicker('#fontColorPicker', '#000000');

  bgPicker.on('change', (color) => {
      document.querySelectorAll('.product-view').forEach(v => v.style.backgroundColor = color.toRGBA().toString());
  });

  fontColorPicker.on('change', (color) => {
      const active = document.querySelector('.active-layer .design-text');
      if(active) active.style.color = color.toRGBA().toString();
  });

  // --- API ---
  async function loadGallery(searchTerm = '') {
    const grid = document.getElementById('galleryGrid');
    const apiUrl = `https://pixabay.com/api/?key=${PIXABAY_API_KEY}&q=${encodeURIComponent(searchTerm)}&image_type=all&per_page=15`;
    try {
        const response = await fetch(apiUrl);
        const data = await response.json();
        grid.innerHTML = '';
        data.hits.forEach(image => {
            const img = document.createElement('img');
            img.src = image.previewURL;
            img.className = 'gallery-item';
            img.onclick = () => createLayer('image', image.largeImageURL);
            grid.appendChild(img);
        });
    } catch (error) {}
  }
  document.getElementById('gallerySearch').addEventListener('input', (e) => loadGallery(e.target.value));
  loadGallery();

  // --- LAYERS ---
  const layerList = document.getElementById('layerList');
  const textEditor = document.getElementById('textEditor');
  let layerCount = 0;

  function createLayer(type, content) {
    layerCount++;
    const layerId = 'layer_' + layerCount;
    const layer = document.createElement('div');
    layer.id = layerId;
    layer.className = 'draggable active-layer';
    
    const activeView = document.getElementById(activeViewId);
    const printArea = activeView.querySelector('.print-area');
    
    layer.style.top = (printArea.offsetTop + printArea.offsetHeight/2 - 15) + 'px';
    layer.style.left = (printArea.offsetLeft + printArea.offsetWidth/2 - 15) + 'px';
    
    if (type === 'image') {
        const img = document.createElement('img');
        img.src = content;
        img.style.width = '30px'; 
        layer.appendChild(img);
        addLayerToList(layerId, 'Image');
        textEditor.style.display = 'none';
    } else {
        const text = document.createElement('div');
        text.className = 'design-text';
        text.textContent = content;
        text.style.fontSize = '14px';
        text.style.color = '#000000';
        layer.appendChild(text);
        addLayerToList(layerId, 'Text');
        textEditor.style.display = 'block';
    }

    const handle = document.createElement('div');
    handle.className = 'resize-handle handle-br';
    layer.appendChild(handle);
    
    activeView.appendChild(layer);
    makeDraggable(layer);
    makeResizable(layer, handle, type);
    
    document.querySelectorAll('.draggable').forEach(d => d.classList.remove('active-layer'));
    layer.classList.add('active-layer');
  }

  function addLayerToList(id, name) {
      const item = document.createElement('div');
      item.className = 'layer-item';
      item.id = 'list_' + id;
      item.innerHTML = `<span>${name}</span><button class="btn-icon btn-delete" onclick="removeLayer('${id}')">X</button>`;
      layerList.prepend(item);
  }

  function removeLayer(id) {
      document.getElementById(id).remove();
      document.getElementById('list_' + id).remove();
  }

  // --- DRAG/RESIZE LOGIC ---
  let activeItem = null;
  let offset = { x: 0, y: 0 };
  let isResizing = false;

  function makeDraggable(el) {
    el.addEventListener('mousedown', (e) => {
      if (isResizing) return;
      activeItem = el;
      document.querySelectorAll('.draggable').forEach(d => d.classList.remove('active-layer'));
      el.classList.add('active-layer');
      const rect = el.getBoundingClientRect();
      offset.x = e.clientX - rect.left;
      offset.y = e.clientY - rect.top;
      setActiveView(el.parentNode.id);
    });
  }

  function makeResizable(el, handle, type) {
      handle.addEventListener('mousedown', (e) => {
          isResizing = true;
          activeItem = el;
          e.stopPropagation();
          document.addEventListener('mousemove', resize);
          document.addEventListener('mouseup', () => {
              isResizing = false;
              document.removeEventListener('mousemove', resize);
          });
      });

      function resize(e) {
          const container = el.parentNode;
          const printArea = container.querySelector('.print-area');
          const printRect = printArea.getBoundingClientRect();
          const elRect = el.getBoundingClientRect();
          
          const maxWidth = printRect.width - (elRect.left - printRect.left);
          const maxHeight = printRect.height - (elRect.top - printRect.top);
          
          const newWidth = Math.min(e.clientX - elRect.left, maxWidth);
          const newHeight = Math.min(e.clientY - elRect.top, maxHeight);
          
          el.style.width = Math.max(15, newWidth) + 'px';
          el.style.height = Math.max(15, newHeight) + 'px';
          
          if(type === 'image') el.querySelector('img').style.width = '100%';
          else el.querySelector('.design-text').style.fontSize = Math.max(8, newWidth * 0.3) + 'px';
      }
  }

  document.addEventListener('mousemove', (e) => {
    if (!activeItem || isResizing) return;
    const container = activeItem.parentNode;
    const printArea = container.querySelector('.print-area');
    const printRect = printArea.getBoundingClientRect();
    const containerRect = container.getBoundingClientRect();
    
    let newX = e.clientX - containerRect.left - offset.x;
    let newY = e.clientY - containerRect.top - offset.y;
    
    const minX = printArea.offsetLeft;
    const maxX = printArea.offsetLeft + printRect.width - activeItem.offsetWidth;
    const minY = printArea.offsetTop;
    const maxY = printArea.offsetTop + printRect.height - activeItem.offsetHeight;
    
    activeItem.style.left = Math.max(minX, Math.min(newX, maxX)) + 'px';
    activeItem.style.top = Math.max(minY, Math.min(newY, maxY)) + 'px';
  });
  document.addEventListener('mouseup', () => { activeItem = null; });

  document.getElementById('addTextBtn').addEventListener('click', () => {
      const text = document.getElementById('textInput').value;
      if(text) createLayer('text', text);
  });

  document.getElementById('imageInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = (ev) => createLayer('image', ev.target.result);
      reader.readAsDataURL(file);
    }
  });

  document.getElementById('downloadBtn').addEventListener('click', () => {
    document.querySelectorAll('.draggable').forEach(d => d.classList.remove('active-layer'));
    html2canvas(document.querySelector('.active-product'), { backgroundColor: null }).then(canvas => {
        const link = document.createElement('a');
        link.download = currentProduct + '-design.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    });
  });

  document.getElementById('submitDesign').addEventListener('click', () => {
    alert('Design Submitted!');
  });
</script>
</body>
</html>
