<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Custom Design Studio - Single Gallery</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/themes/classic.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/pickr.min.js"></script>

  <style>
    :root {
      --primary: #111827;
      --accent: #3b82f6;
      --bg-light: #f5f5f5;
      --border-color: #ddd;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-light);
      margin: 0;
      padding: 10px;
      display: flex;
      justify-content: center;
      user-select: none;
      box-sizing: border-box;
    }

    .studio-wrapper {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      padding: 15px;
      width: 100%;
      max-width: 1200px;
      display: grid;
      /* Adjusted grid to 3 columns, with the gallery on the left */
      grid-template-columns: 280px 1fr 280px;
      gap: 15px;
      box-sizing: border-box;
    }

    /* GALLERY PANEL */
    .gallery-panel {
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 15px;
      background: #f9fafb;
      display: flex;
      flex-direction: column;
      height: 650px;
      overflow: hidden;
    }
    .gallery-header { margin-bottom: 15px; display: flex; flex-direction: column; gap: 8px; }
    .gallery-title { font-size: 14px; font-weight: bold; color: #333; }
    
    .gallery-search {
        padding: 8px; border-radius: 6px; border: 1px solid #ddd; font-size: 12px; width: 100%; box-sizing: border-box;
    }

    .mini-gallery-container {
        display: flex;
        flex-direction: column;
        flex-grow: 1;
        overflow: hidden;
    }

    .mini-gallery-title {
        font-size: 11px;
        color: var(--accent);
        text-transform: uppercase;
        font-weight: bold;
        margin-bottom: 8px;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
      gap: 8px;
      overflow-y: auto;
      padding-right: 5px;
      flex-grow: 1;
    }
    .gallery-item {
      width: 60px; 
      height: 60px;
      border: 1px solid #eee;
      border-radius: 6px;
      cursor: pointer;
      object-fit: contain;
      background: white;
      transition: all 0.2s;
    }
    .gallery-item:hover { border-color: var(--accent); transform: scale(1.05); }

    /* PREVIEW PANEL */
    .preview-container {
      background: #e5e7eb;
      background-image: radial-gradient(#bcbece 1px, transparent 1px);
      background-size: 20px 20px;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
      position: relative;
      min-height: 500px;
      gap: 15px;
      overflow: hidden;
    }

    .product-stage {
        display: none;
        position: relative;
        transform-origin: center;
        transition: transform 0.1s ease-out;
        align-items: center;
        justify-content: center;
    }
    .product-stage.active-product { display: flex; gap: 10px; }

    .product-view {
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      position: relative;
      overflow: hidden;
      background-color: white;
      cursor: pointer;
      border: 3px solid transparent; 
      transition: all 0.3s;
    }

    .view-tshirt { width: 320px; height: 330px; clip-path: polygon(25% 0%, 75% 0%, 100% 20%, 85% 35%, 85% 100%, 15% 100%, 15% 35%, 0% 20%); }
    .view-tumbler { width: 140px; height: 330px; border-radius: 10px; }
    .view-mug { width: 200px; height: 170px; border-radius: 10px 10px 50px 50px; }

    /* LAYERS */
    .draggable {
      position: absolute;
      cursor: move;
      border: 2px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 20px;
      min-height: 20px;
      box-sizing: border-box;
      touch-action: none;
    }
    .draggable.active-layer { border: 2px solid var(--accent); }
    .draggable img { max-width: 100%; max-height: 100%; pointer-events: none; }
    
    .design-text { 
        text-align: center; 
        pointer-events: none;
        word-break: break-word;
        display: block;
        width: 100%;
        line-height: 1.1;
    }

    .resize-handle {
        width: 10px; height: 10px; background: white; border: 2px solid var(--accent);
        position: absolute; display: none; cursor: nwse-resize;
    }
    .draggable.active-layer .resize-handle { display: block; }
    .handle-br { bottom: -5px; right: -5px; }

    /* CONTROLS */
    .controls-panel { display: flex; flex-direction: column; gap: 10px; }
    .control-group { display: flex; flex-direction: column; gap: 3px; }
    label { font-weight: 600; font-size: 10px; color: #666; text-transform: uppercase; }
    input, select { padding: 6px; border-radius: 6px; border: 1px solid #ddd; font-size: 12px;}
    
    #bgPicker, #fontColorPicker { border: 1px solid #ddd; border-radius: 6px; padding: 2px; background: white; }

    .layer-manager {
        background: #f3f4f6; padding: 8px; border-radius: 8px; border: 1px solid #e5e7eb;
        max-height: 150px; overflow-y: auto;
    }
    
    .layer-item {
        display: flex; justify-content: space-between; align-items: center;
        background: white; padding: 6px 8px; border-radius: 4px; margin-bottom: 4px; font-size: 11px;
        border: 1px solid #eee;
    }
    
    .btn-icon { background: #eee; border: none; padding: 2px 5px; border-radius: 3px; cursor: pointer; font-size: 9px; }
    .btn-delete { background: #fee2e2; color: #991b1b; }

    .btn-group { display: flex; gap: 8px; margin-top: 5px; }
    button { padding: 8px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; font-size: 12px;}
    
    .btn-style { background: #f3f4f6; color: #333; font-weight: bold; padding: 6px 10px; border: 1px solid #ddd;}
    .btn-style.active { background: var(--accent); color: white; border-color: var(--accent); }
    
    .btn-primary { background: var(--primary); color: white; flex: 1; }
    .btn-action { background: #dbeafe; color: #1e40af; }
    .btn-download { background: #d1fae5; color: #065f46; flex: 1; }
    
    #textEditor { display: none; background: #f3f4f6; padding: 10px; border-radius: 8px; border: 1px solid #e5e7eb;}
    .size-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .size-row input { width: 60px; }
  </style>
  
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Bungee&family=Creepster&family=Lobster&family=Monoton&family=Montserrat:wght@400;900&family=Pacifico&family=Playfair+Display:wght@700&family=Press+Start+2P&family=Rock+Salt&family=Special+Elite&display=swap" rel="stylesheet">
</head>
<body>

<div class="studio-wrapper">
  
  <div class="gallery-panel">
    <div class="gallery-header">
        <div class="gallery-title">Asset Library</div>
        <input type="text" id="gallerySearch" class="gallery-search" placeholder="Search vectors...">
    </div>
    
    <div class="mini-gallery-container">
        <div class="mini-gallery-title">Pixabay Graphics</div>
        <div class="gallery-grid" id="pixabayGrid"></div>
    </div>

    <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;">
    <div class="control-group">
        <label>Upload Local Image</label>
        <input type="file" id="imageInput" accept="image/*" style="padding: 3px;" />
    </div>
  </div>

  <div class="preview-container">
    <div id="stage-tshirt" class="product-stage active-product">
        <div id="view-tshirt" class="product-view view-tshirt"></div>
    </div>
    <div id="stage-tumbler" class="product-stage">
        <div id="view-tumbler" class="product-view view-tumbler"></div>
    </div>
    <div id="stage-mug" class="product-stage">
        <div id="view-mug" class="product-view view-mug"></div>
    </div>
  </div>

  <div class="controls-panel">
    <h3 style="margin:0; font-size: 16px;">Editor</h3>
    
    <div class="control-group">
        <label>Product</label>
        <select id="productSelect">
            <option value="tshirt">T-Shirt</option>
            <option value="tumbler">Tumbler</option>
            <option value="mug">Mug</option>
        </select>
    </div>
    
    <div class="control-group">
        <label>Zoom Preview</label>
        <input type="range" id="zoomSlider" min="0.5" max="2" step="0.1" value="1">
    </div>

    <div class="control-group">
        <label>Surface Color</label>
        <div id="bgPicker"></div>
    </div>

    <div class="control-group">
        <label>Add Text</label>
        <div style="display:flex; gap:3px;">
            <input type="text" id="textInput" placeholder="Enter text..." value="New Text" style="flex:1"/>
            <button class="btn-action" id="addTextBtn">Add</button>
        </div>
    </div>
    
    <div id="textEditor">
        <div class="size-row">
            <div style="flex:1">
                <label>Text Color</label>
                <div id="fontColorPicker"></div>
            </div>
            <div>
                <label>Size (px)</label><br>
                <input type="number" id="fontSizeInput" min="8" max="200" value="24">
            </div>
        </div>

        <div class="control-group">
            <label>Font Family</label>
            <select id="fontFamily">
                <option value="'Montserrat', sans-serif">Modern: Montserrat</option>
                <option value="'Playfair Display', serif">Classic: Playfair</option>
                <option value="'Pacifico', cursive">Script: Pacifico</option>
                <option value="'Lobster', cursive">Bold Script: Lobster</option>
                <option value="'Bungee', cursive">Block: Bungee</option>
                <option value="'Anton', sans-serif">Impact: Anton</option>
                <option value="'Bangers', cursive">Comic: Bangers</option>
                <option value="'Rock Salt', cursive">Handwritten: Rock Salt</option>
                <option value="'Monoton', cursive">Retro: Monoton</option>
                <option value="'Special Elite', cursive">Typewriter: Special Elite</option>
                <option value="'Creepster', cursive">Horror: Creepster</option>
                <option value="'Press Start 2P', cursive">Pixel: Press Start</option>
            </select>
        </div>
        
        <div style="display:flex; gap:5px; margin-top:5px;">
            <button id="btnBold" class="btn-style" style="flex:1">B</button>
            <button id="btnItalic" class="btn-style" style="flex:1">I</button>
        </div>
    </div>

    <div class="layer-manager">
        <label style="color: var(--accent); margin-bottom: 5px; display: block; font-size: 10px;">Active Layers</label>
        <div id="layerList"></div>
    </div>

    <div class="btn-group">
        <button class="btn-download" id="downloadBtn">💾 Save PNG</button>
        <button class="btn-primary" id="submitDesign">Finalize</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>
  // Removed OpenClipart API key/logic
  const PIXABAY_API_KEY = '54841320-2fc493da46915b0eb0a6f740c';
  let activeViewId = 'view-tshirt';
  let currentProduct = 'tshirt';

  const extendedSwatches = [
      '#FFFFFF', '#F2F2F2', '#D9D9D9', '#BFBFBF', '#A6A6A6', '#808080', '#595959', '#404040', '#262626', '#000000',
      '#FFCCCC', '#FF9999', '#FF6666', '#FF3333', '#FF0000', '#CC0000', '#990000', '#660000', '#330000',
      '#FFE5CC', '#FFCC99', '#FFB266', '#FF9933', '#FF8000', '#CC6600', '#994C00', '#663300', '#331900',
      '#FFFFCC', '#FFFF99', '#FFFF66', '#FFFF33', '#FFFF00', '#CCCC00', '#999900', '#666600', '#333300',
      '#CCFFCC', '#99FF99', '#66FF66', '#33FF33', '#00FF00', '#00CC00', '#009900', '#006600', '#003300',
      '#CCFFFF', '#99FFFF', '#66FFFF', '#33FFFF', '#00FFFF', '#00CCCC', '#009999', '#006666', '#003333',
      '#CCCCFF', '#9999FF', '#6666FF', '#3333FF', '#0000FF', '#0000CC', '#000099', '#000066', '#000033',
      '#E5CCFF', '#CC99FF', '#B266FF', '#9933FF', '#8000FF', '#6600CC', '#4C0099', '#330066', '#190033',
      '#FFCCFF', '#FF99FF', '#FF66FF', '#FF33FF', '#FF00FF', '#CC00CC', '#990099', '#660066', '#330033'
  ];

  const createPicker = (el, def) => Pickr.create({
      el, theme: 'classic', default: def, swatches: extendedSwatches,
      components: { preview: true, opacity: true, hue: true, interaction: { hex: true, input: true, save: true } }
  });

  const bgPicker = createPicker('#bgPicker', '#ffffff');
  const fontColorPicker = createPicker('#fontColorPicker', '#000000');

  bgPicker.on('change', (color) => {
      document.querySelectorAll('.product-view').forEach(v => v.style.backgroundColor = color.toRGBA().toString());
  });

  fontColorPicker.on('change', (color) => {
      const active = document.querySelector('.active-layer .design-text');
      if(active) active.style.color = color.toRGBA().toString();
  });

  document.getElementById('productSelect').addEventListener('change', (e) => {
      currentProduct = e.target.value;
      document.querySelectorAll('.product-stage').forEach(s => s.classList.remove('active-product'));
      const stage = document.getElementById('stage-' + currentProduct);
      stage.classList.add('active-product');
      activeViewId = stage.querySelector('.product-view').id;
  });

  document.getElementById('zoomSlider').addEventListener('input', (e) => {
      document.querySelector('.active-product').style.transform = `scale(${e.target.value})`;
  });

  document.getElementById('fontSizeInput').addEventListener('input', (e) => {
      const activeText = document.querySelector('.active-layer .design-text');
      if(activeText) activeText.style.fontSize = e.target.value + 'px';
  });

  document.getElementById('fontFamily').addEventListener('change', (e) => {
      const activeText = document.querySelector('.active-layer .design-text');
      if(activeText) activeText.style.fontFamily = e.target.value;
  });

  document.getElementById('btnBold').addEventListener('click', () => {
      const activeText = document.querySelector('.active-layer .design-text');
      if(activeText) activeText.style.fontWeight = activeText.style.fontWeight === 'bold' ? 'normal' : 'bold';
  });

  let layerCount = 0;
  function createLayer(type, content) {
    layerCount++;
    const layerId = 'layer_' + layerCount;
    const layer = document.createElement('div');
    layer.id = layerId;
    layer.className = 'draggable active-layer';
    const activeView = document.getElementById(activeViewId);
    layer.style.top = '80px'; layer.style.left = '40px';
    
    if (type === 'image') {
        const img = document.createElement('img');
        img.src = content; img.style.width = '60px'; 
        layer.appendChild(img);
        addLayerToList(layerId, 'Icon');
        document.getElementById('textEditor').style.display = 'none';
    } else {
        const text = document.createElement('div');
        text.className = 'design-text';
        text.textContent = content;
        text.style.fontSize = '24px';
        text.style.fontFamily = document.getElementById('fontFamily').value;
        layer.appendChild(text);
        addLayerToList(layerId, 'Text');
        document.getElementById('textEditor').style.display = 'block';
        document.getElementById('fontSizeInput').value = 24;
    }

    const handle = document.createElement('div');
    handle.className = 'resize-handle handle-br';
    layer.appendChild(handle);
    activeView.appendChild(layer);
    makeDraggable(layer);
    makeResizable(layer, handle, type);
    
    document.querySelectorAll('.draggable').forEach(d => d.classList.remove('active-layer'));
    layer.classList.add('active-layer');
  }

  function addLayerToList(id, name) {
      const item = document.createElement('div');
      item.className = 'layer-item';
      item.id = 'list_' + id;
      item.innerHTML = `<span>${name}</span><button class="btn-icon btn-delete" onclick="removeLayer('${id}')">✕</button>`;
      document.getElementById('layerList').prepend(item);
  }

  function removeLayer(id) {
      document.getElementById(id).remove();
      document.getElementById('list_' + id).remove();
  }

  let activeItem = null, offset = { x: 0, y: 0 }, isResizing = false;

  function makeDraggable(el) {
    el.addEventListener('mousedown', (e) => {
      if (isResizing) return;
      activeItem = el;
      document.querySelectorAll('.draggable').forEach(d => d.classList.remove('active-layer'));
      el.classList.add('active-layer');
      const rect = el.getBoundingClientRect();
      const parentRect = el.parentNode.getBoundingClientRect();
      offset.x = e.clientX - rect.left;
      offset.y = e.clientY - rect.top;
      
      const text = el.querySelector('.design-text');
      if(text) {
          document.getElementById('textEditor').style.display = 'block';
          document.getElementById('fontSizeInput').value = parseInt(text.style.fontSize);
          document.getElementById('fontFamily').value = text.style.fontFamily.replace(/"/g, "'");
      } else {
          document.getElementById('textEditor').style.display = 'none';
      }
    });
  }

  function makeResizable(el, handle, type) {
      handle.addEventListener('mousedown', (e) => {
          isResizing = true; activeItem = el; e.stopPropagation();
          document.addEventListener('mousemove', resize);
          document.addEventListener('mouseup', () => { isResizing = false; document.removeEventListener('mousemove', resize); });
      });

      function resize(e) {
          const rect = el.getBoundingClientRect();
          const nw = e.clientX - rect.left, nh = e.clientY - rect.top;
          el.style.width = Math.max(20, nw) + 'px';
          el.style.height = Math.max(20, nh) + 'px';
          if(type === 'image') el.querySelector('img').style.width = '100%';
          else {
              const newSize = Math.max(8, Math.round(nw * 0.35));
              el.querySelector('.design-text').style.fontSize = newSize + 'px';
              document.getElementById('fontSizeInput').value = newSize;
          }
      }
  }

  document.addEventListener('mousemove', (e) => {
    if (!activeItem || isResizing) return;
    const parent = activeItem.parentNode.getBoundingClientRect();
    activeItem.style.left = (e.clientX - parent.left - offset.x) + 'px';
    activeItem.style.top = (e.clientY - parent.top - offset.y) + 'px';
  });
  document.addEventListener('mouseup', () => activeItem = null);

  // --- PIXABAY LOADER ---
  async function loadPixabay(q = '') {
    const grid = document.getElementById('pixabayGrid');
    const url = `https://pixabay.com/api/?key=${PIXABAY_API_KEY}&q=${encodeURIComponent(q)}&image_type=vector&per_page=18`;
    try {
        const res = await fetch(url);
        const data = await res.json();
        grid.innerHTML = '';
        data.hits.forEach(img => {
            const el = document.createElement('img');
            el.src = img.previewURL;
            el.className = 'gallery-item';
            el.onclick = () => createLayer('image', img.largeImageURL);
            grid.appendChild(el);
        });
    } catch(e) {
        grid.innerHTML = '<p style="font-size:12px; color:red;">Failed to load images.</p>';
    }
  }

  // --- Search Only Pixabay ---
  document.getElementById('gallerySearch').addEventListener('input', (e) => {
      loadPixabay(e.target.value);
  });

  // Init
  loadPixabay();

  document.getElementById('addTextBtn').addEventListener('click', () => {
      const val = document.getElementById('textInput').value;
      if(val) createLayer('text', val);
  });

  document.getElementById('imageInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = (ev) => createLayer('image', ev.target.result);
      reader.readAsDataURL(file);
    }
  });

  document.getElementById('downloadBtn').addEventListener('click', () => {
    document.querySelectorAll('.draggable').forEach(d => d.classList.remove('active-layer'));
    html2canvas(document.querySelector('.active-product'), { backgroundColor: null }).then(canvas => {
        const link = document.createElement('a');
        link.download = currentProduct + '-mockup.png';
        link.href = canvas.toDataURL();
        link.click();
    });
  });

  document.getElementById('submitDesign').addEventListener('click', () => alert('Design finalized! Sent to production.'));
</script>
</body>
</html>
