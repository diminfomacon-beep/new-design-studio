<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Custom Print Design Studio</title>
  <style>
    :root {
      --primary: #111827;
      --accent: #3b82f6;
      --bg-light: #f5f5f5;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-light);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .studio-wrapper {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      padding: 24px;
      max-width: 950px;
      width: 100%;
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 30px;
    }

    .step-indicator {
      grid-column: 1 / -1;
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }
    .step-dot {
      flex: 1;
      height: 6px;
      background: #eee;
      border-radius: 10px;
      transition: background 0.3s;
    }
    .step-dot.active { background: var(--accent); }

    .preview-container {
      background: #fdfdfd;
      border: 1px solid #eee;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      min-height: 400px;
      overflow: hidden;
    }

    .product-stage {
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.05);
      position: relative;
    }

    /* Mockup Shapes */
    .shape-tshirt { width: 280px; height: 280px; border-radius: 12px; clip-path: polygon(25% 0%, 75% 0%, 100% 20%, 85% 35%, 85% 100%, 15% 100%, 15% 35%, 0% 20%); }
    .shape-ornament { width: 260px; height: 260px; border-radius: 50%; }
    .shape-tumbler { width: 180px; height: 300px; border-radius: 10px 10px 40px 40px; }

    .design-text {
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      padding: 10px;
      word-wrap: break-word;
      max-width: 80%;
      z-index: 2;
    }

    #uploadedImagePreview {
      max-width: 60%;
      max-height: 40%;
      object-fit: contain;
      margin-bottom: 10px;
      display: none;
      z-index: 1;
    }

    .controls-panel { display: flex; flex-direction: column; gap: 18px; }
    .step-content { display: none; flex-direction: column; gap: 15px; }
    .step-content.active { display: flex; }

    .control-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-weight: 600; font-size: 13px; color: #444; text-transform: uppercase; }
    input[type="text"], input[type="file"], select { padding: 10px; border-radius: 8px; border: 1px solid #ddd; }
    
    .btn-group { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
    button { 
      flex: 1; min-width: 120px; padding: 12px; border-radius: 8px; border: none; 
      font-weight: 600; cursor: pointer; transition: opacity 0.2s; 
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-secondary { background: #e5e7eb; color: #374151; }
    .btn-share { background: #dbeafe; color: #1e40af; }
    .btn-danger { background: #fee2e2; color: #b91c1c; font-size: 11px; padding: 5px; }

    .summary-box {
      background: #f9fafb;
      padding: 15px;
      border-radius: 8px;
      font-size: 14px;
      border-left: 4px solid var(--accent);
    }
  </style>
</head>
<body>

<div class="studio-wrapper">
  <div class="step-indicator">
    <div class="step-dot active" id="dot1"></div>
    <div class="step-dot" id="dot2"></div>
  </div>

  <div class="preview-area">
    <div class="preview-container">
      <div id="productShape" class="product-stage shape-tshirt" style="background-color: #ffffff;">
        <img id="uploadedImagePreview" src="" alt="Custom Design" />
        <div id="designText" class="design-text">Your Text Here</div>
      </div>
      <p id="previewLabel" style="margin-top:15px; font-size: 12px; color:#999; font-weight:bold;">T-SHIRT MOCKUP</p>
    </div>
  </div>

  <div class="controls-panel">
    <div id="step1" class="step-content active">
      <h2 style="margin:0">1. Customize</h2>
      
      <div class="control-group">
        <label>Product Type</label>
        <select id="productType">
          <option value="T-Shirt">T-Shirt</option>
          <option value="Ornament">Ornament</option>
          <option value="Tumbler">Tumbler</option>
        </select>
      </div>

      <div class="control-group">
        <label>Add an Image (Logo/Photo)</label>
        <input type="file" id="imageInput" accept="image/*" />
        <button id="removeImgBtn" class="btn-danger" style="display:none; margin-top:5px;">Remove Image</button>
      </div>

      <div class="control-group">
        <label>Personalized Text</label>
        <input type="text" id="textInput" placeholder="Enter name or phrase" maxlength="30" />
      </div>

      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
        <div class="control-group">
          <label>Text Color</label>
          <input type="color" id="textColor" value="#000000" style="width:100%; height:40px;" />
        </div>
        <div class="control-group">
          <label>Product Color</label>
          <input type="color" id="bgColor" value="#ffffff" style="width:100%; height:40px;" />
        </div>
      </div>

      <div class="btn-group">
        <button class="btn-secondary" id="resetBtn">Reset</button>
        <button class="btn-share" id="shareBtn">🔗 Copy Link</button>
        <button class="btn-primary" id="nextBtn" style="width: 100%;">Review Design →</button>
      </div>
    </div>

    <div id="step2" class="step-content">
      <h2 style="margin:0">2. Review Design</h2>
      <div class="summary-box">
        <p><strong>Item:</strong> <span id="revProduct">-</span></p>
        <p><strong>Text:</strong> <span id="revText">-</span></p>
        <p><strong>Image:</strong> <span id="revImage">None</span></p>
        <p style="margin-bottom:0; font-size: 11px; color: #ef4444;">* Note: If you uploaded an image, please email it to us after ordering to ensure high quality!</p>
      </div>
      
      <div class="btn-group">
        <button class="btn-secondary" id="backBtn">← Back</button>
        <button class="btn-primary" id="submitDesign">Finalize & Order</button>
      </div>
    </div>
  </div>
</div>

<script>
  // DOM Elements
  const textInput = document.getElementById('textInput');
  const textColor = document.getElementById('textColor');
  const bgColor = document.getElementById('bgColor');
  const imageInput = document.getElementById('imageInput');
  const imgPreview = document.getElementById('uploadedImagePreview');
  const removeImgBtn = document.getElementById('removeImgBtn');
  const designText = document.getElementById('designText');
  const productShape = document.getElementById('productShape');
  const productType = document.getElementById('productType');
  
  const step1 = document.getElementById('step1');
  const step2 = document.getElementById('step2');
  const dot1 = document.getElementById('dot1');
  const dot2 = document.getElementById('dot2');

  // Handle Image Upload
  imageInput.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(event) {
        imgPreview.src = event.target.result;
        imgPreview.style.display = 'block';
        removeImgBtn.style.display = 'block';
      }
      reader.readAsDataURL(file);
    }
  });

  removeImgBtn.addEventListener('click', () => {
    imageInput.value = "";
    imgPreview.src = "";
    imgPreview.style.display = 'none';
    removeImgBtn.style.display = 'none';
  });

  // UI Updates
  function updateUI() {
    designText.textContent = textInput.value || 'Your Text Here';
    designText.style.color = textColor.value;
    productShape.style.backgroundColor = bgColor.value;
    
    const val = productType.value;
    document.getElementById('previewLabel').textContent = `${val.toUpperCase()} MOCKUP`;
    productShape.className = 'product-stage';
    if (val === 'Ornament') productShape.classList.add('shape-ornament');
    else if (val === 'Tumbler') productShape.classList.add('shape-tumbler');
    else productShape.classList.add('shape-tshirt');
  }

  [textInput, textColor, bgColor, productType].forEach(el => {
    el.addEventListener('input', updateUI);
  });

  // Navigation
  document.getElementById('nextBtn').addEventListener('click', () => {
    document.getElementById('revProduct').textContent = productType.value;
    document.getElementById('revText').textContent = textInput.value || "(No text)";
    document.getElementById('revImage').textContent = imageInput.files.length > 0 ? "Uploaded" : "None";
    
    step1.classList.remove('active');
    step2.classList.add('active');
    dot2.classList.add('active');
  });

  document.getElementById('backBtn').addEventListener('click', () => {
    step2.classList.remove('active');
    step1.classList.add('active');
    dot2.classList.remove('active');
  });

  // Share/Submit
  document.getElementById('shareBtn').addEventListener('click', () => {
    const params = new URLSearchParams({ p: productType.value, t: textInput.value, tc: textColor.value, bg: bgColor.value });
    const shareUrl = window.location.origin + window.location.pathname + '#' + params.toString();
    navigator.clipboard.writeText(shareUrl).then(() => alert("Link copied! (Note: Images are not saved in the link)"));
  });

  document.getElementById('submitDesign').addEventListener('click', () => {
    const baseUrl = 'https://docs.google.com/forms/d/e/1FAIpQLSd5FvoEdzSMsDMcg0Bwqok-fIrxrFldzu1wvw91pqc-0ccMHA/viewform?';
    const params = new URLSearchParams({
      'entry.2141379241': productType.value,
      'entry.1449325312': textInput.value,
      'entry.1145569502': textColor.value,
      'entry.125041649': bgColor.value
    });
    window.open(baseUrl + params.toString(), "_blank");
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    if(confirm("Reset all?")) window.location.reload();
  });

  // URL Loader
  window.addEventListener('load', () => {
    const hash = window.location.hash.substring(1);
    if (hash) {
      const p = new URLSearchParams(hash);
      if (p.has('p')) productType.value = p.get('p');
      if (p.has('t')) textInput.value = p.get('t');
      if (p.has('tc')) textColor.value = p.get('tc');
      if (p.has('bg')) bgColor.value = p.get('bg');
      updateUI();
    }
  });
</script>

</body>
</html>
