<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Custom Design Studio - Final</title>
  
  <link rel="stylesheet" href="classic.min.css"/>
  <script src="pickr.min.js"></script>
  <script src="html2canvas.min.js"></script>

  <style>
    :root {
      --primary: #111827;
      --accent: #3b82f6;
      --bg-light: #f5f5f5;
      --border-color: #ddd;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-light);
      margin: 0;
      padding: 10px;
      display: flex;
      justify-content: center;
      user-select: none;
      box-sizing: border-box;
    }

    .studio-wrapper {
      background: #CAE4DB;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      padding: 15px;
      width: 100%;
      max-width: 1200px;
      display: grid;
      grid-template-columns: 240px 1fr 240px;
      gap: 15px;
      box-sizing: border-box;
    }

    /* GALLERY PANELS */
    .gallery-panel {
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 10px;
      background: #f9fafb;
      display: flex;
      flex-direction: column;
      height: 650px;
      overflow: hidden;
    }
    .gallery-header { margin-bottom: 10px; display: flex; flex-direction: column; gap: 5px; }
    .gallery-title { font-size: 13px; font-weight: bold; color: #333; }
    
    .gallery-search {
        padding: 5px; border-radius: 6px; border: 1px solid #ddd; font-size: 11px; width: 100%; box-sizing: border-box;
    }

    .mini-gallery-container {
        margin-bottom: 10px;
        height: 220px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    .mini-gallery-title {
        font-size: 10px;
        color: var(--accent);
        text-transform: uppercase;
        font-weight: bold;
        margin-bottom: 5px;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(45px, 1fr));
      gap: 5px;
      overflow-y: auto;
      padding-right: 5px;
      flex-grow: 1;
    }
    .gallery-item {
      width: 45px; 
      height: 45px;
      border: 1px solid #eee;
      border-radius: 6px;
      cursor: pointer;
      object-fit: contain;
      background: white;
      transition: all 0.2s;
    }
    .gallery-item:hover { border-color: var(--accent); transform: scale(1.05); }

    /* PREVIEW PANEL */
    .preview-container {
      background: #e5e7eb;
      background-image: radial-gradient(#bcbece 1px, transparent 1px);
      background-size: 20px 20px;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
      position: relative;
      min-height: 500px;
      gap: 15px;
      overflow: hidden;
    }

    .product-stage {
        display: none;
        position: relative;
        transform-origin: center;
        transition: transform 0.1s ease-out;
        align-items: center;
        justify-content: center;
    }
    .product-stage.active-product { display: flex; gap: 10px; }

    .product-view {
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      position: relative;
      overflow: hidden;
      background-color: white;
      cursor: pointer;
      border: 3px solid transparent; 
      transition: all 0.3s;
    }

    .view-tshirt { width: 320px; height: 330px; clip-path: polygon(25% 0%, 75% 0%, 100% 20%, 85% 35%, 85% 100%, 15% 100%, 15% 35%, 0% 20%); }
    .view-tumbler { width: 140px; height: 330px; border-radius: 10px; }
    .view-mug { width: 200px; height: 170px; border-radius: 10px 10px 50px 50px; }

    /* LAYERS */
    .draggable {
      position: absolute;
      cursor: move;
      border: 2px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 20px;
      min-height: 20px;
      box-sizing: border-box;
      touch-action: none;
      transform-origin: center;
    }
    .draggable.active-layer { border: 2px solid var(--accent); }
    .draggable img { max-width: 100%; max-height: 100%; pointer-events: none; }
    
    .design-text { 
        text-align: center; 
        pointer-events: none;
        word-break: break-word;
        display: block;
        width: 100%;
        line-height: 1.1;
        user-select: none;
    }

    .resize-handle {
        width: 10px; height: 10px; background: white; border: 2px solid var(--accent);
        position: absolute; display: none; cursor: nwse-resize;
        border-radius: 50%;
    }
    .draggable.active-layer .resize-handle { display: block; }
    .handle-br { bottom: -5px; right: -5px; }

    /* ALIGNMENT GUIDES */
    .alignment-guide {
        position: absolute;
        background-color: var(--accent);
        display: none;
        z-index: 100;
        pointer-events: none;
    }
    #guide-h { height: 1px; width: 100%; top: 50%; left: 0; transform: translateY(-50%); }
    #guide-v { width: 1px; height: 100%; left: 50%; top: 0; transform: translateX(-50%); }

    /* CONTROLS */
    .controls-panel { display: flex; flex-direction: column; gap: 10px; height: 650px; overflow-y: auto;}
    .control-group { display: flex; flex-direction: column; gap: 3px; }
    label { font-weight: 600; font-size: 10px; color: #666; text-transform: uppercase; }
    input[type=text], select, input[type=number] { padding: 6px; border-radius: 6px; border: 1px solid #ddd; font-size: 12px;}
    input[type=range] { width: 100%; }
    
    #bgPicker, #fontColorPicker { border: 1px solid #ddd; border-radius: 6px; padding: 2px; background: white; }

    .layer-manager {
        background: #f3f4f6; padding: 8px; border-radius: 8px; border: 1px solid #e5e7eb;
        max-height: 150px; overflow-y: auto;
    }
    
    .layer-item {
        display: flex; justify-content: space-between; align-items: center;
        background: white; padding: 4px 6px; border-radius: 4px; margin-bottom: 4px; font-size: 11px;
        border: 1px solid #eee;
    }
    
    .btn-icon { background: #eee; border: none; padding: 2px 5px; border-radius: 3px; cursor: pointer; font-size: 9px; }
    .btn-delete { background: #fee2e2; color: #991b1b; }

    .btn-group { display: flex; gap: 8px; margin-top: 5px; flex-wrap: wrap; }
    button { padding: 8px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; font-size: 12px;}
    
    .btn-style { background: #f3f4f6; color: #333; font-weight: bold; padding: 6px 10px; border: 1px solid #ddd;}
    .btn-style.active { background: var(--accent); color: white; border-color: var(--accent); }
    
    .btn-primary { background: var(--primary); color: white; flex: 1; }
    .btn-action { background: #dbeafe; color: #1e40af; }
    .btn-download { background: #d1fae5; color: #065f46; flex: 1; }
    
    #textEditor { display: none; background: #f3f4f6; padding: 10px; border-radius: 8px; border: 1px solid #e5e7eb;}
    .size-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .size-row input { width: 60px; }
  </style>
  
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Bungee&family=Creepster&family=Lobster&family=Monoton&family=Montserrat:wght@400;900&family=Pacifico&family=Playfair+Display:wght@700&family=Press+Start+2P&family=Rock+Salt&family=Special+Elite&display=swap" rel="stylesheet">
</head>
<body>

<div class="studio-wrapper">
  
  <div class="gallery-panel">
    <div class="gallery-header">
        <div class="gallery-title">Asset Search</div>
        <input type="text" id="gallerySearch" class="gallery-search" placeholder="Search all libraries...">
    </div>
    
    <div class="mini-gallery-container">
        <div class="mini-gallery-title">Pixabay (Vector)</div>
        <div class="gallery-grid" id="pixabayGrid"></div>
    </div>
    
    <div class="mini-gallery-container">
        <div class="mini-gallery-title">OpenClipart (SVG)</div>
        <div class="gallery-grid" id="openClipartGrid"></div>
    </div>

    <hr style="border: 0; border-top: 1px solid #eee; margin: 10px 0;">
    <div class="control-group">
        <label>Upload Local Image</label>
        <input type="file" id="imageInput" accept="image/*" style="padding: 3px;" />
    </div>
  </div>

  <div class="preview-container">
    <div id="stage-tshirt" class="product-stage active-product">
        <div id="view-tshirt" class="product-view view-tshirt">
            <div id="guide-h" class="alignment-guide"></div>
            <div id="guide-v" class="alignment-guide"></div>
        </div>
    </div>
    <div id="stage-tumbler" class="product-stage">
        <div id="view-tumbler" class="product-view view-tumbler">
            <div id="guide-h" class="alignment-guide"></div>
            <div id="guide-v" class="alignment-guide"></div>
        </div>
    </div>
    <div id="stage-mug" class="product-stage">
        <div id="view-mug" class="product-view view-mug">
            <div id="guide-h" class="alignment-guide"></div>
            <div id="guide-v" class="alignment-guide"></div>
        </div>
    </div>
  </div>

  <div class="controls-panel">
    <h3 style="margin:0; font-size: 16px;">Editor</h3>
    
    <div class="control-group">
        <label>Product</label>
        <select id="productSelect">
            <option value="tshirt">T-Shirt</option>
            <option value="tumbler">Tumbler</option>
            <option value="mug">Mug</option>
        </select>
    </div>
    
    <div class="control-group">
        <label>Zoom Preview</label>
        <input type="range" id="zoomSlider" min="0.5" max="2" step="0.1" value="1">
    </div>

    <div class="control-group">
        <label>Surface Color</label>
        <div id="bgPicker"></div>
    </div>

    <div class="control-group">
        <label>Add Text</label>
        <div style="display:flex; gap:3px;">
            <input type="text" id="textInput" placeholder="Enter text..." value="New Text" style="flex:1"/>
            <button class="btn-action" id="addTextBtn">Add</button>
        </div>
    </div>
    
    <div id="textEditor">
        <div class="size-row">
            <div style="flex:1">
                <label>Text Color</label>
                <div id="fontColorPicker"></div>
            </div>
            <div>
                <label>Size (px)</label><br>
                <input type="number" id="fontSizeInput" min="8" max="200" value="24">
            </div>
        </div>
        
        <div class="control-group" style="margin-bottom: 8px;">
            <label>Rotation</label>
            <input type="range" id="rotationSlider" min="0" max="360" value="0">
        </div>

        <div class="control-group" style="margin-bottom: 8px;">
            <label>Opacity</label>
            <input type="range" id="opacitySlider" min="0" max="1" step="0.01" value="1">
        </div>

        <div class="control-group" style="margin-bottom: 8px;">
            <label>Flip</label>
            <div style="display:flex; gap:5px;">
                <button id="btnFlipH" class="btn-style" style="flex:1" title="Flip Horizontal">↔</button>
                <button id="btnFlipV" class="btn-style" style="flex:1" title="Flip Vertical">↕</button>
            </div>
        </div>

        <div class="control-group" style="margin-bottom: 8px;">
            <label>Outline Width</label>
            <input type="range" id="outlineWidthSlider" min="0" max="10" step="1" value="0">
        </div>

        <div class="control-group" style="margin-bottom: 8px;">
            <label>Drop Shadow</label>
            <select id="shadowSelect">
                <option value="none">None</option>
                <option value="small">Small</option>
                <option value="large">Large</option>
            </select>
        </div>
        <div class="control-group">
            <label>Font Family</label>
            <select id="fontFamily">
                <option value="'Montserrat', sans-serif">Modern: Montserrat</option>
                <option value="'Playfair Display', serif">Classic: Playfair</option>
                <option value="'Pacifico', cursive">Script: Pacifico</option>
                <option value="'Lobster', cursive">Bold Script: Lobster</option>
                <option value="'Bungee', cursive">Block: Bungee</option>
                <option value="'Anton', sans-serif">Impact: Anton</option>
                <option value="'Bangers', cursive">Comic: Bangers</option>
                <option value="'Rock Salt', cursive">Handwritten: Rock Salt</option>
                <option value="'Monoton', cursive">Retro: Monoton</option>
                <option value="'Special Elite', cursive">Typewriter: Special Elite</option>
                <option value="'Creepster', cursive">Horror: Creepster</option>
                <option value="'Press Start 2P', cursive">Pixel: Press Start</option>
            </select>
        </div>
        
        <div style="display:flex; gap:5px; margin-top:5px;">
            <button id="btnBold" class="btn-style" style="flex:1">B</button>
            <button id="btnItalic" class="btn-style" style="flex:1">I</button>
        </div>
    </div>

    <div class="layer-manager">
        <label style="color: var(--accent); margin-bottom: 5px; display: block; font-size: 10px;">Layers</label>
        <div id="layerList"></div>
    </div>

    <div class="btn-group">
        <button class="btn-download" id="downloadBtn">💾 Save PNG</button>
        <button class="btn-style" id="clearCanvasBtn" style="background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5;">🗑️ Clear</button>
        <button class="btn-primary" id="submitDesign">Finalize</button>
    </div>
  </div>
</div>

<script>
  const PIXABAY_API_KEY = '54841320-2fc493da46915b0eb0a6f740c';
  let activeViewId = 'view-tshirt';
  let currentProduct = 'tshirt';
  let layerCount = 0;

  // --- Pickr Initialization ---
  const createPicker = (el, def) => Pickr.create({
      el, theme: 'classic', default: def,
      components: { preview: true, opacity: true, hue: true, interaction: { hex: true, input: true, save: true } }
  });

  const bgPicker = createPicker('#bgPicker', '#ffffff');
  const fontColorPicker = createPicker('#fontColorPicker', '#000000');

  bgPicker.on('change', (color) => {
      document.querySelectorAll('.product-view').forEach(v => v.style.backgroundColor = color.toHEXA().toString());
  });

  fontColorPicker.on('change', (color) => {
      const active = document.querySelector('.active-layer .design-text');
      if(active) active.style.color = color.toHEXA().toString();
  });

  // --- UI Controls ---
  document.getElementById('productSelect').addEventListener('change', (e) => {
      currentProduct = e.target.value;
      document.querySelectorAll('.product-stage').forEach(s => s.classList.remove('active-product'));
      const stage = document.getElementById('stage-' + currentProduct);
      stage.classList.add('active-product');
      activeViewId = stage.querySelector('.product-view').id;
  });

  document.getElementById('zoomSlider').addEventListener('input', (e) => {
      document.querySelector('.active-product').style.transform = `scale(${e.target.value})`;
  });

  // --- Text Editor Controls ---
  document.getElementById('fontSizeInput').addEventListener('input', (e) => {
      const activeText = document.querySelector('.active-layer .design-text');
      if(activeText) activeText.style.fontSize = e.target.value + 'px';
  });

  document.getElementById('fontFamily').addEventListener('change', (e) => {
      const activeText = document.querySelector('.active-layer .design-text');
      if(activeText) activeText.style.fontFamily = e.target.value;
  });

  document.getElementById('btnBold').addEventListener('click', (e) => {
      const activeText = document.querySelector('.active-layer .design-text');
      if(activeText) {
          activeText.style.fontWeight = activeText.style.fontWeight === 'bold' ? 'normal' : 'bold';
          e.target.classList.toggle('active');
      }
  });
  
  document.getElementById('btnItalic').addEventListener('click', (e) => {
      const activeText = document.querySelector('.active-layer .design-text');
      if(activeText) {
          activeText.style.fontStyle = activeText.style.fontStyle === 'italic' ? 'normal' : 'italic';
          e.target.classList.toggle('active');
      }
  });

  // --- New Styling Controls ---
  document.getElementById('rotationSlider').addEventListener('input', updateLayerTransform);
  document.getElementById('opacitySlider').addEventListener('input', (e) => {
      const activeLayer = document.querySelector('.active-layer');
      if (activeLayer) activeLayer.style.opacity = e.target.value;
  });
  document.getElementById('outlineWidthSlider').addEventListener('input', (e) => {
      const activeText = document.querySelector('.active-layer .design-text');
      if (activeText) activeText.style.webkitTextStroke = `${e.target.value}px black`;
  });
  document.getElementById('shadowSelect').addEventListener('change', (e) => {
      const activeText = document.querySelector('.active-layer .design-text');
      if (activeText) {
          const val = e.target.value;
          if (val === 'small') activeText.style.textShadow = '2px 2px 2px rgba(0,0,0,0.5)';
          else if (val === 'large') activeText.style.textShadow = '4px 4px 5px rgba(0,0,0,0.7)';
          else activeText.style.textShadow = 'none';
      }
  });

  document.getElementById('btnFlipH').addEventListener('click', () => toggleFlip('scaleX'));
  document.getElementById('btnFlipV').addEventListener('click', () => toggleFlip('scaleY'));

  function toggleFlip(type) {
      const activeLayer = document.querySelector('.active-layer');
      if (!activeLayer) return;
      const t = activeLayer.style.transform;
      activeLayer.style.transform = t.includes(`${type}(-1)`) ? t.replace(`${type}(-1)`, '') : `${t} ${type}(-1)`;
  }

  function updateLayerTransform() {
      const activeLayer = document.querySelector('.active-layer');
      if (activeLayer) {
          const rot = document.getElementById('rotationSlider').value;
          const currentT = activeLayer.style.transform;
          // Keep flips if they exist
          const flipH = currentT.includes('scaleX(-1)') ? 'scaleX(-1)' : '';
          const flipV = currentT.includes('scaleY(-1)') ? 'scaleY(-1)' : '';
          activeLayer.style.transform = `rotate(${rot}deg) ${flipH} ${flipV}`;
      }
  }

  // --- Layer Management ---
  function createLayer(type, content) {
    layerCount++;
    const layerId = 'layer_' + layerCount;
    const layer = document.createElement('div');
    layer.id = layerId;
    layer.className = 'draggable active-layer';
    const activeView = document.getElementById(activeViewId);
    layer.style.top = '50px'; layer.style.left = '50px';
    
    if (type === 'image') {
        const img = document.createElement('img');
        img.src = content; img.style.width = '100px'; 
        layer.appendChild(img);
        addLayerToList(layerId, 'Icon');
    } else {
        const text = document.createElement('div');
        text.className = 'design-text';
        text.textContent = content;
        text.style.fontSize = '24px';
        text.style.fontFamily = document.getElementById('fontFamily').value;
        layer.appendChild(text);
        addLayerToList(layerId, 'Text');
        document.getElementById('textEditor').style.display = 'block';
    }

    const handle = document.createElement('div');
    handle.className = 'resize-handle handle-br';
    layer.appendChild(handle);
    activeView.appendChild(layer);
    makeDraggable(layer);
    makeResizable(layer, handle, type);
    
    document.querySelectorAll('.draggable').forEach(d => d.classList.remove('active-layer'));
    layer.classList.add('active-layer');
  }

  function addLayerToList(id, name) {
      const item = document.createElement('div');
      item.className = 'layer-item';
      item.id = 'list_' + id;
      
      const btnContainer = document.createElement('div');
      btnContainer.style.display = 'flex';
      btnContainer.style.gap = '2px';

      // Reorder buttons
      const btnBack = createIconButton('▼', () => {
          const layer = document.getElementById(id);
          layer.parentNode.prepend(layer);
      });
      const btnFront = createIconButton('▲', () => {
          const layer = document.getElementById(id);
          layer.parentNode.appendChild(layer);
      });
      const btnDup = createIconButton('⧉', () => duplicateLayer(id));
      const btnDel = createIconButton('✕', () => removeLayer(id), 'btn-delete');

      btnContainer.append(btnBack, btnFront, btnDup, btnDel);
      item.innerHTML = `<span>${name}</span>`;
      item.appendChild(btnContainer);
      document.getElementById('layerList').prepend(item);
  }
  
  function createIconButton(icon, onclick, extraClass = '') {
      const btn = document.createElement('button');
      btn.className = `btn-icon ${extraClass}`;
      btn.innerHTML = icon;
      btn.onclick = (e) => { e.stopPropagation(); onclick(); };
      return btn;
  }

  function removeLayer(id) {
      document.getElementById(id).remove();
      document.getElementById('list_' + id).remove();
  }
  
  function duplicateLayer(id) {
    const original = document.getElementById(id);
    const clone = original.cloneNode(true);
    layerCount++;
    clone.id = 'layer_' + layerCount;
    clone.style.top = (parseInt(original.style.top) + 20) + 'px';
    clone.style.left = (parseInt(original.style.left) + 20) + 'px';
    original.parentNode.appendChild(clone);
    
    const handle = clone.querySelector('.resize-handle');
    const type = clone.querySelector('img') ? 'image' : 'text';
    makeDraggable(clone);
    makeResizable(clone, handle, type);
    addLayerToList(clone.id, type === 'image' ? 'Icon' : 'Text');
  }

  // --- Drag and Resize Logic ---
  let activeItem = null, offset = { x: 0, y: 0 }, isResizing = false;

  function makeDraggable(el) {
    el.addEventListener('mousedown', (e) => {
      if (isResizing || e.target.classList.contains('resize-handle')) return;
      activeItem = el;
      document.querySelectorAll('.draggable').forEach(d => d.classList.remove('active-layer'));
      el.classList.add('active-layer');
      const rect = el.getBoundingClientRect();
      const parentRect = el.parentNode.getBoundingClientRect();
      offset.x = e.clientX - rect.left;
      offset.y = e.clientY - rect.top;
      
      syncEditorWithLayer(el);
    });
  }
  
  function syncEditorWithLayer(el) {
      document.getElementById('textEditor').style.display = 'block';
      const text = el.querySelector('.design-text');
      
      // Sync basic transforms
      const transform = el.style.transform;
      const rotMatch = transform.match(/rotate\(([^deg)]+)deg\)/);
      document.getElementById('rotationSlider').value = rotMatch ? rotMatch[1] : 0;
      document.getElementById('opacitySlider').value = el.style.opacity || 1;

      if(text) {
          document.getElementById('fontSizeInput').value = parseInt(text.style.fontSize);
          document.getElementById('fontFamily').value = text.style.fontFamily.replace(/"/g, "'");
          // Sync Styles
          const stroke = text.style.webkitTextStroke;
          document.getElementById('outlineWidthSlider').value = stroke ? parseInt(stroke) : 0;
          const shadow = text.style.textShadow;
          if (shadow.includes('4px')) document.getElementById('shadowSelect').value = 'large';
          else if (shadow.includes('2px')) document.getElementById('shadowSelect').value = 'small';
          else document.getElementById('shadowSelect').value = 'none';
      }
  }

  function makeResizable(el, handle, type) {
      handle.addEventListener('mousedown', (e) => {
          isResizing = true; activeItem = el; e.stopPropagation();
          document.addEventListener('mousemove', resize);
          document.addEventListener('mouseup', () => { isResizing = false; document.removeEventListener('mousemove', resize); });
      });

      function resize(e) {
          const rect = el.getBoundingClientRect();
          const nw = e.clientX - rect.left, nh = e.clientY - rect.top;
          el.style.width = Math.max(20, nw) + 'px';
          el.style.height = Math.max(20, nh) + 'px';
          if(type === 'image') el.querySelector('img').style.width = '100%';
          else {
              const newSize = Math.max(8, Math.round(nw * 0.35));
              el.querySelector('.design-text').style.fontSize = newSize + 'px';
              document.getElementById('fontSizeInput').value = newSize;
          }
      }
  }

  // --- Global Mouse Events (Dragging & Guides) ---
  document.addEventListener('mousemove', (e) => {
    if (!activeItem || isResizing) return;
    const parent = activeItem.parentNode.getBoundingClientRect();
    const newX = e.clientX - parent.left - offset.x;
    const newY = e.clientY - parent.top - offset.y;
    activeItem.style.left = newX + 'px';
    activeItem.style.top = newY + 'px';
    
    // Alignment Guide Logic
    const itemRect = activeItem.getBoundingClientRect();
    const itemCenterX = itemRect.left + itemRect.width / 2;
    const itemCenterY = itemRect.top + itemRect.height / 2;
    const parentCenterX = parent.left + parent.width / 2;
    const parentCenterY = parent.top + parent.height / 2;
    
    const hGuide = activeItem.parentNode.querySelector('#guide-h');
    const vGuide = activeItem.parentNode.querySelector('#guide-v');
    const threshold = 5; 
    
    vGuide.style.display = Math.abs(itemCenterX - parentCenterX) < threshold ? 'block' : 'none';
    hGuide.style.display = Math.abs(itemCenterY - parentCenterY) < threshold ? 'block' : 'none';
  });

  document.addEventListener('mouseup', () => {
    activeItem = null;
    document.querySelectorAll('.alignment-guide').forEach(g => g.style.display = 'none');
  });

  // --- API / Loader ---
  async function loadPixabay(q = '') {
    const grid = document.getElementById('pixabayGrid');
    const url = `https://pixabay.com/api/?key=${PIXABAY_API_KEY}&q=${encodeURIComponent(q)}&image_type=vector&per_page=10`;
    try {
        const res = await fetch(url);
        const data = await res.json();
        grid.innerHTML = '';
        data.hits.forEach(img => {
            const el = document.createElement('img');
            el.src = img.previewURL;
            el.className = 'gallery-item';
            el.onclick = () => createLayer('image', img.largeImageURL);
            grid.appendChild(el);
        });
    } catch(e) { grid.innerHTML = 'Error'; }
  }

  async function loadOpenClipart(q = '') {
    const grid = document.getElementById('openClipartGrid');
    const endpoint = q 
        ? `https://openclipart.org/search/json/?query=${encodeURIComponent(q)}&amount=10`
        : `https://openclipart.org/search/json/?sort=downloads&amount=10`;
    
    try {
        const response = await fetch(endpoint);
        if (!response.ok) throw new Error('API down');
        const data = await response.json();
        grid.innerHTML = '';
        
        if (data.payload) {
            data.payload.forEach(clip => {
                const img = document.createElement('img');
                // Force HTTPS
                img.src = clip.svg.url_thumb.replace(/^http:/, 'https:'); 
                img.className = 'gallery-item';
                img.onclick = () => createLayer('image', clip.svg.url.replace(/^http:/, 'https:'));
                grid.appendChild(img);
            });
        }
    } catch(e) { grid.innerHTML = 'API Down'; }
  }

  document.getElementById('gallerySearch').addEventListener('input', (e) => {
      loadPixabay(e.target.value);
      loadOpenClipart(e.target.value);
  });

  // --- Initialization ---
  loadPixabay();
  loadOpenClipart();

  document.getElementById('addTextBtn').addEventListener('click', () => {
      const val = document.getElementById('textInput').value;
      if(val) createLayer('text', val);
  });

  document.getElementById('imageInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = (ev) => createLayer('image', ev.target.result);
      reader.readAsDataURL(file);
    }
  });

  document.getElementById('clearCanvasBtn').addEventListener('click', () => {
    if (confirm('Are you sure you want to remove all designs?')) {
        document.querySelectorAll('.active-product .draggable').forEach(el => el.remove());
        document.getElementById('layerList').innerHTML = '';
        document.getElementById('textEditor').style.display = 'none';
    }
  });

  document.getElementById('downloadBtn').addEventListener('click', () => {
    document.querySelectorAll('.draggable').forEach(d => d.classList.remove('active-layer'));
    html2canvas(document.querySelector('.active-product'), { backgroundColor: null }).then(canvas => {
        const link = document.createElement('a');
        link.download = currentProduct + '-mockup.png';
        link.href = canvas.toDataURL();
        link.click();
    });
  });

  document.getElementById('submitDesign').addEventListener('click', () => alert('Design finalized! Sent to production.'));
</script>
</body>
</html>
