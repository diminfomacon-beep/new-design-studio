<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Custom Print Design Studio</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/themes/classic.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/pickr.min.js"></script>

  <style>
    :root {
      --primary: #111827;
      --accent: #3b82f6;
      --bg-light: #f5f5f5;
      --border-color: #ddd;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-light);
      margin: 0;
      padding: 10px;
      display: flex;
      justify-content: center;
      user-select: none;
      box-sizing: border-box;
    }

    .studio-wrapper {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      padding: 15px;
      width: 100%;
      display: grid;
      grid-template-columns: 240px 1fr 240px;
      gap: 15px;
      box-sizing: border-box;
    }

    /* GALLERY PANEL */
    .gallery-panel {
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 10px;
      background: #f9fafb;
      display: flex;
      flex-direction: column;
      height: 550px;
      overflow: hidden;
    }
    .gallery-header { margin-bottom: 10px; display: flex; flex-direction: column; gap: 5px; }
    .gallery-title { font-size: 13px; font-weight: bold; color: #333; }
    
    .gallery-search, .gallery-filter {
        padding: 5px; border-radius: 6px; border: 1px solid #ddd; font-size: 11px; width: 100%; box-sizing: border-box;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(50px, 1fr));
      gap: 8px;
      overflow-y: auto;
      padding-right: 5px;
      flex-grow: 1;
    }
    .gallery-item {
      width: 50px; height: 50px;
      border: 2px solid #eee;
      border-radius: 8px;
      cursor: pointer;
      object-fit: contain;
      background: white;
      transition: all 0.2s;
    }
    .gallery-item:hover { border-color: var(--accent); transform: scale(1.05); }

    /* LOADER STYLES */
    .gallery-loader {
        display: none;
        text-align: center;
        padding: 20px;
        font-size: 12px;
        color: #666;
    }

    .spinner {
        border: 3px solid #f3f3f3;
        border-top: 3px solid var(--accent);
        border-radius: 50%;
        width: 20px;
        height: 20px;
        animation: spin 1s linear infinite;
        margin: 0 auto 5px auto;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    /* PREVIEW PANEL */
    .preview-container {
      background: #e5e7eb;
      background-image: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAYAAACp8Z5+AAAAIklEQVQIW2NkQAKrVq36z8gGiMAEYIIgAXgAlABGAJYAWgB9/woDAAAAAElFTkSuQmCC');
      border: 1px solid var(--border-color);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
      position: relative;
      min-height: 500px;
    }

    .product-stage {
      transition: background-color 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      position: relative;
      overflow: hidden;
      background-color: white;
    }

    .shape-tshirt { width: 300px; height: 300px; clip-path: polygon(25% 0%, 75% 0%, 100% 20%, 85% 35%, 85% 100%, 15% 100%, 15% 35%, 0% 20%); }
    .shape-ornament { width: 250px; height: 250px; border-radius: 50%; }
    .shape-tumbler { width: 150px; height: 280px; border-radius: 10px 10px 30px 30px; }

    /* LAYERS */
    .draggable {
      position: absolute;
      cursor: move;
      border: 2px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 20px;
      min-height: 20px;
      box-sizing: border-box;
      touch-action: none;
    }
    .draggable.active-layer { border: 2px solid var(--accent); }
    .draggable img { max-width: 100%; max-height: 100%; pointer-events: none; }
    
    .design-text { 
        text-align: center; 
        pointer-events: none;
        word-break: break-word;
        display: block;
        width: 100%;
        line-height: 1.2;
    }

    /* RESIZE HANDLES */
    .resize-handle {
        width: 10px; height: 10px; background: white; border: 2px solid var(--accent);
        position: absolute; display: none; cursor: nwse-resize;
    }
    .draggable.active-layer .resize-handle { display: block; }
    .handle-br { bottom: -5px; right: -5px; }

    /* CONTROLS PANEL */
    .controls-panel { display: flex; flex-direction: column; gap: 10px; }
    .control-group { display: flex; flex-direction: column; gap: 3px; }
    label { font-weight: 600; font-size: 10px; color: #666; text-transform: uppercase; }
    input, select { padding: 6px; border-radius: 6px; border: 1px solid #ddd; font-size: 12px;}
    
    #bgPicker { border: 1px solid #ddd; border-radius: 6px; padding: 3px; background: white; display: inline-block;}
    .pcr-button { border-radius: 4px; border: 1px solid #eee; width: 100%; height: 25px; }

    .layer-manager {
        background: #f3f4f6; padding: 8px; border-radius: 8px; border: 1px solid #e5e7eb;
        max-height: 150px; overflow-y: auto;
    }
    
    .layer-item {
        display: flex; justify-content: space-between; align-items: center;
        background: white; padding: 6px 8px; border-radius: 4px; margin-bottom: 4px; font-size: 11px;
        border: 1px solid #eee;
        cursor: grab;
    }
    .layer-item.dragging { opacity: 0.5; background: #e0e7ff; }
    
    .layer-controls { display: flex; gap: 2px; }
    .btn-icon { background: #eee; border: none; padding: 2px 5px; border-radius: 3px; cursor: pointer; font-size: 9px; }
    .btn-delete { background: #fee2e2; color: #991b1b; }

    .btn-group { display: flex; gap: 8px; margin-top: 5px; }
    button { flex: 1; padding: 8px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; font-size: 12px;}
    .btn-primary { background: var(--primary); color: white; }
    .btn-action { background: #dbeafe; color: #1e40af; }
    .btn-download { background: #d1fae5; color: #065f46; }
    
    #textEditor { display: none; background: #f3f4f6; padding: 8px; border-radius: 8px; }
  </style>
  
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Lobster&family=Press+Start+2P&family=Playfair+Display:wght@400;700&family=Montserrat:wght@400;700&family=Dancing+Script:wght@400;700&family=Oswald:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="studio-wrapper">
  
  <div class="gallery-panel">
    <div class="gallery-header">
        <div class="gallery-title">Assets (Pixabay)</div>
        <input type="text" id="gallerySearch" class="gallery-search" placeholder="Search icons...">
        <select id="galleryFilter" class="gallery-filter">
            <option value="all">All</option>
            <option value="animals">Animals</option>
            <option value="shapes">Shapes</option>
            <option value="nature">Nature</option>
            <option value="transportation">Transport</option>
        </select>
    </div>
    
    <div id="galleryLoader" class="gallery-loader">
        <div class="spinner"></div>
        Fetching images...
    </div>
    
    <div class="gallery-grid" id="galleryGrid"></div>
    
    <hr style="border: 0; border-top: 1px solid #eee; margin: 10px 0;">
    <div class="control-group">
        <label>Upload Local Image</label>
        <input type="file" id="imageInput" accept="image/*" style="padding: 3px;" />
    </div>
  </div>

  <div class="preview-container">
    <div id="productShape" class="product-stage shape-tshirt">
    </div>
    <p style="font-size: 9px; color: #555; margin-top: 8px; font-weight:bold;">DRAG/RESIZE ITEMS</p>
  </div>

  <div class="controls-panel">
    <h3 style="margin:0; font-size: 16px;">Editor</h3>
    
    <div class="control-group">
      <label>Product</label>
      <select id="productType">
        <option value="T-Shirt">T-Shirt</option>
        <option value="Ornament">Ornament</option>
        <option value="Tumbler">Tumbler</option>
      </select>
    </div>

    <div class="control-group">
        <label>Product Color</label>
        <div id="bgPicker"></div>
    </div>

    <div class="control-group">
        <label>Add Text Layer</label>
        <div style="display:flex; gap:3px;">
            <input type="text" id="textInput" placeholder="Enter text..." value="Text" style="flex:1"/>
            <button class="btn-action" id="addTextBtn">Add</button>
        </div>
    </div>
    
    <div id="textEditor">
        <label style="color: var(--accent); font-size: 10px;">Text Style</label>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 3px; align-items: center;">
            <div id="fontColorPicker" style="border: 1px solid #ddd; border-radius: 6px; padding: 2px; background: white; height: 20px;"></div>
            <select id="fontFamily" style="grid-column: span 2; padding: 4px;">
                <option value="Roboto" style="font-family: Roboto;">Roboto</option>
                <option value="'Playfair Display'" style="font-family: 'Playfair Display';">Playfair</option>
                <option value="Lobster" style="font-family: Lobster;">Lobster</option>
                <option value="'Dancing Script'" style="font-family: 'Dancing Script';">Dancing</option>
                <option value="'Press Start 2P'" style="font-family: 'Press Start 2P';">Pixel</option>
            </select>
            <button class="btn-icon" id="fontBold" style="grid-column: span 1;"><b>B</b></button>
            <button class="btn-icon" id="fontItalic" style="grid-column: span 1;"><i>I</i></button>
        </div>
    </div>

    <div class="layer-manager">
        <label style="color: var(--accent); margin-bottom: 5px; display: block; font-size: 10px;">Layers</label>
        <div id="layerList"></div>
    </div>

    <div class="btn-group">
        <button class="btn-download" id="downloadBtn">💾 PNG</button>
        <button class="btn-primary" id="submitDesign">Submit</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>
  // --- PIXABAY API KEY CONFIGURATION ---
  const PIXABAY_API_KEY = 'YOUR_ACTUAL_API_KEY_HERE';

  // --- COLOR PICKER INITIALIZATION ---
  const createColorPicker = (selector, defaultColor) => {
      return Pickr.create({
          el: selector,
          theme: 'classic', 
          default: defaultColor,
          components: {
              preview: true,
              opacity: true,
              hue: true,
              interaction: { hex: true, input: true, save: true }
          }
      });
  };

  const bgPicker = createColorPicker('#bgPicker', '#ffffff');
  const fontColorPicker = createColorPicker('#fontColorPicker', '#000000');

  // --- PICKR EVENTS ---
  bgPicker.on('change', (color) => {
      productShape.style.backgroundColor = color.toHEXA().toString();
  });

  fontColorPicker.on('change', (color) => {
      const active = document.querySelector('.active-layer .design-text');
      if(active) active.style.color = color.toHEXA().toString();
  });

  // --- API INTEGRATION WITH SPINNER ---
  async function loadGallery(category = 'all', searchTerm = '') {
    const grid = document.getElementById('galleryGrid');
    const loader = document.getElementById('galleryLoader');
    
    // Show spinner, clear grid
    loader.style.display = 'block';
    grid.innerHTML = ''; 

    // Construct URL - 'image_type=vector' filters for clean icons/graphics
    const apiUrl = `https://pixabay.com/api/?key=${PIXABAY_API_KEY}&q=${encodeURIComponent(searchTerm)}&category=${category}&image_type=vector&per_page=50`;

    try {
        const response = await fetch(apiUrl);
        const data = await response.json();

        data.hits.forEach(image => {
            const img = document.createElement('img');
            img.src = image.previewURL;
            img.className = 'gallery-item';
            img.alt = image.tags;
            // When clicked, use the high-res version
            img.onclick = () => createLayer('image', image.largeImageURL);
            grid.appendChild(img);
        });
    } catch (error) {
        grid.innerHTML = '<p style="font-size:11px; color:red; padding: 5px;">Error loading images. Check API Key.</p>';
    } finally {
        // Hide spinner
        loader.style.display = 'none';
    }
  }

  // Event Listeners for Search/Filter
  document.getElementById('gallerySearch').addEventListener('input', (e) => {
      loadGallery(document.getElementById('galleryFilter').value, e.target.value);
  });
  document.getElementById('galleryFilter').addEventListener('change', (e) => {
      loadGallery(e.target.value, document.getElementById('gallerySearch').value);
  });

  // Initial Render
  loadGallery();

  // --- EXISTING LAYER FUNCTIONALITY ---
  const productShape = document.getElementById('productShape');
  const layerList = document.getElementById('layerList');
  const textEditor = document.getElementById('textEditor');
  let layerCount = 0;

  function createLayer(type, content) {
    layerCount++;
    const layerId = 'layer_' + layerCount;
    
    const layer = document.createElement('div');
    layer.id = layerId;
    layer.className = 'draggable active-layer';
    layer.style.top = '50px'; layer.style.left = '50px';
    layer.dataset.type = type;
    
    document.querySelectorAll('.draggable').forEach(d => d.classList.remove('active-layer'));
    
    if (type === 'image') {
        const img = document.createElement('img');
        img.src = content;
        img.style.width = '80px'; 
        layer.appendChild(img);
        addLayerToList(layerId, 'Image');
        textEditor.style.display = 'none';
    } else {
        const text = document.createElement('div');
        text.className = 'design-text';
        text.textContent = content;
        text.style.fontSize = '20px';
        text.style.fontFamily = 'Roboto';
        text.style.color = '#000000';
        layer.appendChild(text);
        addLayerToList(layerId, 'Text');
        textEditor.style.display = 'block';
    }

    const handle = document.createElement('div');
    handle.className = 'resize-handle handle-br';
    layer.appendChild(handle);
    
    productShape.appendChild(layer);
    makeDraggable(layer);
    makeResizable(layer, handle, type);
  }

  // --- TEXT CUSTOMIZATION ---
  document.getElementById('fontFamily').addEventListener('change', (e) => {
      const active = document.querySelector('.active-layer .design-text');
      if(active) active.style.fontFamily = e.target.value;
  });
  document.getElementById('fontBold').addEventListener('click', (e) => {
      const active = document.querySelector('.active-layer .design-text');
      if(active) active.style.fontWeight = active.style.fontWeight === 'bold' ? 'normal' : 'bold';
  });
  document.getElementById('fontItalic').addEventListener('click', (e) => {
      const active = document.querySelector('.active-layer .design-text');
      if(active) active.style.fontStyle = active.style.fontStyle === 'italic' ? 'normal' : 'italic';
  });

  // --- DRAG & DROP LIST (LAYERS) ---
  function addLayerToList(id, name) {
      const item = document.createElement('div');
      item.className = 'layer-item';
      item.id = 'list_' + id;
      item.draggable = true;
      item.dataset.layerId = id;

      item.innerHTML = `
        <span>${name}</span>
        <div class="layer-controls">
            <button class="btn-icon btn-delete" onclick="removeLayer('${id}')">X</button>
        </div>
      `;

      item.addEventListener('dragstart', handleDragStart);
      item.addEventListener('dragover', handleDragOver);
      item.addEventListener('drop', handleDrop);
      item.addEventListener('dragend', handleDragEnd);

      layerList.prepend(item);
  }

  function removeLayer(id) {
      document.getElementById(id).remove();
      document.getElementById('list_' + id).remove();
      textEditor.style.display = 'none';
  }

  let draggedItem = null;
  function handleDragStart(e) { draggedItem = this; this.classList.add('dragging'); }
  function handleDragOver(e) { e.preventDefault(); return false; }
  function handleDrop(e) {
      e.stopPropagation();
      if (draggedItem !== this) {
          const allItems = Array.from(layerList.children);
          const draggedIndex = allItems.indexOf(draggedItem);
          const droppedIndex = allItems.indexOf(this);
          if (draggedIndex < droppedIndex) this.after(draggedItem);
          else this.before(draggedItem);
          syncDomOrder();
      }
      return false;
  }
  function handleDragEnd(e) { this.classList.remove('dragging'); draggedItem = null; }

  function syncDomOrder() {
      const listItems = Array.from(layerList.children);
      listItems.reverse().forEach(item => {
          const layer = document.getElementById(item.dataset.layerId);
          productShape.appendChild(layer);
      });
  }

  // --- DRAG AND RESIZE ON STAGE ---
  let activeItem = null;
  let offset = { x: 0, y: 0 };
  let isResizing = false;

  function makeDraggable(el) {
    el.addEventListener('mousedown', (e) => {
      if (isResizing) return;
      activeItem = el;
      document.querySelectorAll('.draggable').forEach(d => d.classList.remove('active-layer'));
      el.classList.add('active-layer');
      
      if(el.dataset.type === 'text') {
          textEditor.style.display = 'block';
          const textDiv = el.querySelector('.design-text');
          fontColorPicker.setColor(textDiv.style.color);
      } else {
          textEditor.style.display = 'none';
      }

      const rect = el.getBoundingClientRect();
      offset.x = e.clientX - rect.left;
      offset.y = e.clientY - rect.top;
      
      el.parentNode.appendChild(el);
      syncListOrder();
    });
  }

  function syncListOrder() {
      const layers = Array.from(productShape.children);
      layers.forEach(layer => {
          const listItem = document.getElementById('list_' + layer.id);
          if(listItem) layerList.prepend(listItem);
      });
  }

  function makeResizable(el, handle, type) {
      handle.addEventListener('mousedown', (e) => {
          isResizing = true;
          activeItem = el;
          e.stopPropagation();
          document.addEventListener('mousemove', resize);
          document.addEventListener('mouseup', () => {
              isResizing = false;
              document.removeEventListener('mousemove', resize);
          });
      });

      function resize(e) {
          const rect = el.getBoundingClientRect();
          const newWidth = e.clientX - rect.left;
          const newHeight = e.clientY - rect.top;
          
          el.style.width = newWidth + 'px';
          el.style.height = newHeight + 'px';
          
          if(type === 'image') {
              const img = el.querySelector('img');
              if(img) img.style.width = '100%';
          } else {
              const textDiv = el.querySelector('.design-text');
              if(textDiv) {
                  const newFontSize = newWidth * 0.25; 
                  textDiv.style.fontSize = Math.max(10, newFontSize) + 'px';
              }
          }
      }
  }

  document.addEventListener('mousemove', (e) => {
    if (!activeItem || isResizing) return;
    const containerRect = productShape.getBoundingClientRect();
    let newX = e.clientX - containerRect.left - offset.x;
    let newY = e.clientY - containerRect.top - offset.y;
    newX = Math.max(0, Math.min(newX, containerRect.width - activeItem.offsetWidth));
    newY = Math.max(0, Math.min(newY, containerRect.height - activeItem.offsetHeight));
    activeItem.style.left = newX + 'px';
    activeItem.style.top = newY + 'px';
  });
  document.addEventListener('mouseup', () => { activeItem = null; });

  // --- CONTROLS ---
  document.getElementById('addTextBtn').addEventListener('click', () => {
      const text = document.getElementById('textInput').value;
      if(text) createLayer('text', text);
  });

  document.getElementById('imageInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = (ev) => createLayer('image', ev.target.result);
      reader.readAsDataURL(file);
    }
  });

  document.getElementById('productType').addEventListener('change', (e) => {
    productShape.className = 'product-stage ' + 
      (e.target.value === 'Ornament' ? 'shape-ornament' : 
       e.target.value === 'Tumbler' ? 'shape-tumbler' : 'shape-tshirt');
  });

  // --- PNG DOWNLOAD ---
  document.getElementById('downloadBtn').addEventListener('click', () => {
    document.querySelectorAll('.draggable').forEach(d => d.classList.remove('active-layer'));
    
    html2canvas(productShape, { backgroundColor: null }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'design.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    });
  });

  // --- SUBMIT ---
  document.getElementById('submitDesign').addEventListener('click', () => {
    const baseUrl = 'https://docs.google.com/forms/d/e/1FAIpQLSd5FvoEdzSMsDMcg0Bwqok-fIrxrFldzu1wvw91pqc-0ccMHA/viewform?';
    const params = new URLSearchParams({
      'entry.2141379241': productType.value,
      'entry.125041649': bgPicker.getColor().toHEXA().toString()
    });
    window.open(baseUrl + params.toString(), "_blank");
  });
</script>
</body>
</html>
