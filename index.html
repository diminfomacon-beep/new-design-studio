   /* =========================
   BASE RESIZE HANDLE
========================= */
.resize-handle {
    position: absolute;
    
    width: 12px;
    height: 12px;

    background: #3b82f6;
    border: 2px solid #ffffff;
    border-radius: 50%;

    z-index: 9999;
    display: none;

    /* Interaction */
    pointer-events: all;
    touch-action: none;
    cursor: pointer;
}

/* Bigger invisible touch target for mobile */
.resize-handle::after {
    content: '';
    position: absolute;
    top: -10px;
    left: -10px;
    right: -10px;
    bottom: -10px;
}

/* =========================
   SHOW HANDLES WHEN ACTIVE
========================= */
.draggable.active-layer .resize-handle {
    display: block;
}

/* =========================
   HANDLE POSITIONS
========================= */

/* Corners */

.handle-tr { top: -6px; right: -6px; cursor: nesw-resize; }
.handle-bl { bottom: -6px; left: -6px; cursor: nesw-resize; }
.handle-br { bottom: -6px; right: -6px; cursor: nwse-resize; }

/* Edges */
.handle-t  { top: -6px; left: 50%; transform: translateX(-50%); cursor: ns-resize; }
.handle-b  { bottom: -6px; left: 50%; transform: translateX(-50%); cursor: ns-resize; }
.handle-l  { left: -6px; top: 50%; transform: translateY(-50%); cursor: ew-resize; }
.handle-r  { right: -6px; top: 50%; transform: translateY(-50%); cursor: ew-resize; }

/* =========================
   DRAGGABLE TEXT CONTAINER
========================= */
.draggable {
    position: absolute;
    display: inline-block;
    
    /* Size behavior */
    width: fit-content;
    max-width: 100%;
    height: auto;

    /* Spacing + visuals */
    padding: 8px 12px;
    border: 2px solid transparent;
    box-sizing: border-box;

    /* Interaction */
    cursor: move;
    touch-action: none;

    /* Prevent weird scaling issues */
    transform-origin: top left;
}

/* =========================
   TEXT CONTENT
========================= */
.draggable span {
    display: block;

    /* TEXT BEHAVIOR */
    white-space: pre-wrap;       /* ✅ supports multi-line */
    word-break: break-word;      /* ✅ prevents overflow */
    overflow-wrap: break-word;

    /* SIZE */
    width: 100%;
    min-width: 1px;

    /* TEXT RENDERING */
    line-height: 1.2;

    /* Prevent text from blocking drag */
    pointer-events: none;
}

/* =========================
   SINGLE LINE MODE (optional toggle)
========================= */
.draggable.single-line span {
    white-space: nowrap;
    width: auto;
}

/* =========================
   ACTIVE STATE (selection)
========================= */
.draggable.active-layer {
    border: 2px dashed #3b82f6;
}
