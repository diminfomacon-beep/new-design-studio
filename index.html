<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>D.I.M. Design Studio</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/themes/classic.min.css"/>
<script src="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/pickr.min.js"></script>
<style>
:root {
  --primary:#111827; --accent:#3b82f6; --bg-light:#f5f5f5; --border-color:#ddd;
}
body{font-family:sans-serif;background:var(--bg-light);margin:0;padding:10px;display:flex;justify-content:center;user-select:none;}
.studio-wrapper{display:grid;grid-template-columns:240px 1fr 240px;gap:15px;width:100%;padding:15px;background:#CAE4DB;border-radius:16px;}
.gallery-panel{border:1px solid var(--border-color);border-radius:12px;padding:10px;background:#f9fafb;display:flex;flex-direction:column;height:600px;overflow:hidden;}
.gallery-header{margin-bottom:10px;display:flex;flex-direction:column;gap:5px;}
.gallery-title{font-size:13px;font-weight:bold;color:#333;}
.gallery-search{padding:5px;border-radius:6px;border:1px solid #ddd;font-size:11px;width:100%;box-sizing:border-box;}
.mini-gallery-container{margin-bottom:10px;height:200px;display:flex;flex-direction:column;}
.mini-gallery-title{font-size:10px;color:var(--accent);text-transform:uppercase;font-weight:bold;margin-bottom:5px;}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(45px,1fr));gap:5px;overflow-y:auto;flex-grow:1;padding-right:5px;}
.gallery-item{width:45px;height:45px;border:1px solid #eee;border-radius:6px;cursor:pointer;object-fit:contain;background:white;transition:all 0.2s;}
.gallery-item:hover{border-color:var(--accent);transform:scale(1.05);}
.preview-container{background:#e5e7eb;background-size:20px 20px;border:1px solid var(--border-color);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;position:relative;min-height:500px;gap:15px;overflow:hidden;}
.product-stage{display:none;position:relative;transform-origin:center;align-items:center;justify-content:center;}
.product-stage.active-product{display:flex;}
.product-view{box-shadow:0 10px 25px rgba(0,0,0,0.2);position:relative;overflow:hidden;background-color:white;cursor:pointer;border:3px solid transparent;transition:all 0.3s;}
.view-tshirt{width:320px;height:330px;clip-path:polygon(25% 0%,75% 0%,100% 20%,85% 35%,85% 100%,15% 100%,15% 35%,0% 20%);}
.view-tumbler{width:140px;height:330px;border-radius:10px;}
.view-mug{width:200px;height:170px;border-radius:10px 10px 50px 50px;}
.draggable{position:absolute;cursor:move;border:2px solid transparent;display:flex;align-items:center;justify-content:center;min-width:20px;min-height:20px;box-sizing:border-box;touch-action:none;}
.draggable.active-layer{border:2px solid var(--accent);}
.draggable img{max-width:100%;max-height:100%;pointer-events:none;}
.design-text{text-align:center;pointer-events:none;word-break:break-word;display:block;width:100%;line-height:1.1;}
.resize-handle{width:10px;height:10px;background:white;border:2px solid var(--accent);position:absolute;display:none;cursor:nwse-resize;}
.draggable.active-layer .resize-handle{display:block;}
.handle-br{bottom:-5px;right:-5px;}
.controls-panel{display:flex;flex-direction:column;gap:10px;}
.control-group{display:flex;flex-direction:column;gap:3px;}
label{font-weight:600;font-size:10px;color:#666;text-transform:uppercase;}
input,select{padding:6px;border-radius:6px;border:1px solid #ddd;font-size:12px;}
.layer-manager{background:#f3f4f6;padding:8px;border-radius:8px;border:1px solid #e5e7eb;max-height:120px;overflow-y:auto;}
.layer-item{display:flex;justify-content:space-between;align-items:center;background:white;padding:6px 8px;border-radius:4px;margin-bottom:4px;font-size:11px;border:1px solid #eee;}
.btn-icon{background:#eee;border:none;padding:2px 5px;border-radius:3px;cursor:pointer;font-size:9px;}
.btn-delete{background:#fee2e2;color:#991b1b;}
.btn-group{display:flex;gap:8px;margin-top:5px;}
button{padding:8px;border-radius:8px;border:none;font-weight:600;cursor:pointer;font-size:12px;}
.btn-style{background:#f3f4f6;color:#333;font-weight:bold;padding:6px 10px;border:1px solid #ddd;}
.btn-style.active{background:var(--accent);color:white;border-color:var(--accent);}
.btn-primary{background:var(--primary);color:white;flex:1;}
.btn-action{background:#dbeafe;color:#1e40af;}
.btn-download{background:#d1fae5;color:#065f46;flex:1;}
#textEditor{display:none;background:#f3f4f6;padding:10px;border-radius:8px;border:1px solid #e5e7eb;}
.size-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.size-row input{width:60px;}
.preview-panel{
    border:1px solid var(--border-color);                
    border-radius:12px;
    padding:10px;
    background:#c9c5c5;
    display:flex;
    flex-direction:column;
    height:300px; /* Increased height to fit preview */
    overflow:hidden;
}
.preview-title {
    font-size: 13px;
    font-weight: bold;
    color: #000000;
    align-self: flex-start;
}
.preview-box {
    width: 150px;                
    height: px;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    background: white;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
}

.preview-box img {
    max-width: 90%;
    max-height: 90%;
    object-fit: contain;
}
</style>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Bungee&family=Creepster&family=Lobster&family=Monoton&family=Montserrat:wght@400;900&family=Pacifico&family=Playfair+Display:wght@700&family=Press+Start+2P&family=Rock+Salt&family=Special+Elite&display=swap" rel="stylesheet">
</head>
<body>
<div class="studio-wrapper">
  <!-- LEFT PANEL -->
  <div class="gallery-panel">
    <div class="gallery-header">
      <div class="gallery-title">Image Search</div>
      <input type="text" id="gallerySearch" class="gallery-search" placeholder="Search all libraries...">
    </div>
    <div class="mini-gallery-container">
      <div class="mini-gallery-title">Pixabay (Vector)</div>
      <div class="gallery-grid" id="pixabayGrid"></div>
    </div>
    <hr style="border:0;border-top:1px solid #eee;margin:10px 0;">
    <div class="control-group">
      <label>Upload Local Image</label>
      <input type="file" id="imageInput" accept="image/*"/>
    </div>
    <hr style="border:0;border-top:1px solid #eee;margin:10px 0;">
    <div class="control-group">
      <label>Add Text</label>
      <div style="display:flex; gap:3px;">
        <input type="text" id="textInput" placeholder="Enter text..." value="New Text" style="flex:1"/>
        <button class="btn-action" id="addTextBtn">Add</button>
      </div>
    </div>
    <div id="textEditor">
      <div class="size-row">
        <div style="flex:1">
          <label>Text Color</label>
          <div id="fontColorPicker"></div>
        </div>
        <div>
          <label>Size (px)</label><br>
          <input type="number" id="fontSizeInput" min="8" max="200" value="24">
        </div>
      </div>
      <div class="control-group">
        <label>Font Family</label>
        <select id="fontFamily">
          <option value="'Montserrat', sans-serif">Modern: Montserrat</option>
          <option value="'Playfair Display', serif">Classic: Playfair</option>
          <option value="'Pacifico', cursive">Script: Pacifico</option>
          <option value="'Lobster', cursive">Bold Script: Lobster</option>
          <option value="'Bungee', cursive">Block: Bungee</option>
          <option value="'Anton', sans-serif">Impact: Anton</option>
          <option value="'Bangers', cursive">Comic: Bangers</option>
          <option value="'Rock Salt', cursive">Handwritten: Rock Salt</option>
          <option value="'Monoton', cursive">Retro: Monoton</option>
          <option value="'Special Elite', cursive">Typewriter: Special Elite</option>
          <option value="'Creepster', cursive">Horror: Creepster</option>
          <option value="'Press Start 2P', cursive">Pixel: Press Start</option>
        </select>
      </div>
      <div style="display:flex; gap:5px; margin-top:5px;">
        <button id="btnBold" class="btn-style" style="flex:1">B</button>
        <button id="btnItalic" class="btn-style" style="flex:1">I</button>
      </div>
    </div>
    <div class="layer-manager">
      <label style="color: var(--accent); margin-bottom:5px; display:block; font-size:10px;">Active Layers</label>
      <div id="layerList"></div>
    </div>    
  </div>

  
  <!-- CENTER PREVIEW -->
  <div class="preview-container"></div>

  
  <!-- RIGHT PANEL -->
  <div class="controls-panel">
    <div class="control-group">
      <label>Product</label>
      <select id="productSelect">
        <option value="tshirt">T-Shirt</option>
        <option value="tumbler">Tumbler</option>
        <option value="mug">Mug</option>
      </select>
    </div>
    <div class="control-group">
      <label>Zoom Preview</label>
      <input type="range" id="zoomSlider" min="0.5" max="2" step="0.1" value="1">
    </div>
    <div class="control-group">
      <label>Surface Color</label>
      <div id="bgPicker"></div>
    </div>
    <hr style="border:0;border-top:1px solid #eee;margin:10px 0;">
    <div class="preview-panel">
      <div class="preview-title">Preview</div>
      <div class="preview-box"></div>
        <div class="preview-box img"></div>
          <div id="stage-tshirt" class="product-stage active-product">
            <div id="view-tshirt" class="product-view view-tshirt"></div>
          </div>
          <div id="stage-tumbler" class="product-stage">
            <div id="view-tumbler" class="product-view view-tumbler"></div>
          </div>
          <div id="stage-mug" class="product-stage">
            <div id="view-mug" class="product-view view-mug"></div>
          </div>
    </div>
    
    <div class="btn-group">
      <button class="btn-download" id="downloadBtn">💾 Save PNG</button>
      <button class="btn-primary" id="submitDesign">Finalize</button>
      <button onclick="undo()">↶ Undo</button>
      <button onclick="redo()">↷ Redo</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
/********************************************
 * INITIALIZATION
 ********************************************/
const PIXABAY_API_KEY = '54841320-2fc493da46915b0eb0a6f740c';
let activeViewId = 'view-tshirt';
let activeView = document.getElementById(activeViewId);
let currentProduct = 'tshirt';
let layerCount = 0;
let historyStack = [];
let redoStack = [];
let activeItem = null;
let offset = {x:0, y:0};
let isResizing = false;
  
const extendedSwatches = [
  '#FFFFFF', '#F2F2F2', '#D9D9D9', '#BFBFBF', '#A6A6A6', '#808080', '#595959', '#404040', '#262626', '#000000',
  '#FFCCCC', '#FF9999', '#FF6666', '#FF3333', '#FF0000', '#CC0000', '#990000', '#660000', '#330000',
  '#FFE5CC', '#FFCC99', '#FFB266', '#FF9933', '#FF8000', '#CC6600', '#994C00', '#663300', '#331900',
  '#FFFFCC', '#FFFF99', '#FFFF66', '#FFFF33', '#FFFF00', '#CCCC00', '#999900', '#666600', '#333300',
  '#CCFFCC', '#99FF99', '#66FF66', '#33FF33', '#00FF00', '#00CC00', '#009900', '#006600', '#003300',
  '#CCFFFF', '#99FFFF', '#66FFFF', '#33FFFF', '#00FFFF', '#00CCCC', '#009999', '#006666', '#003333',
  '#CCCCFF', '#9999FF', '#6666FF', '#3333FF', '#0000FF', '#0000CC', '#000099', '#000066', '#000033',
  '#E5CCFF', '#CC99FF', '#B266FF', '#9933FF', '#8000FF', '#6600CC', '#4C0099', '#330066', '#190033',
  '#FFCCFF', '#FF99FF', '#FF66FF', '#FF33FF', '#FF00FF', '#CC00CC', '#990099', '#660066', '#330033'
];

function createPicker(el, def) {
  return Pickr.create({
    el,
    theme: 'classic',
    default: def,
    swatches: extendedSwatches,
    components: {
      preview: true,
      opacity: true,
      hue: true,
      interaction: { hex: true, input: true, save: true }
    }
  });
}

const bgPicker = createPicker('#bgPicker', '#ffffff');
const fontColorPicker = createPicker('#fontColorPicker', '#000000');

bgPicker.on('change', (color, instance) => {
  const colorStr = color.toRGBA().toString();
  document.querySelectorAll('.product-view').forEach(v => v.style.backgroundColor = colorStr);
  instance.setColor(colorStr);
});

fontColorPicker.on('change', (color, instance) => {
  const active = document.querySelector('.active-layer .design-text');
  if(active) active.style.color = color.toRGBA().toString();
  instance.setColor(color.toRGBA().toString());
});
/********************************************
 * UTILITY
 ********************************************/
function saveHistory(){
  const snapshot = activeView.innerHTML;
  historyStack.push(snapshot);
  if(historyStack.length>50) historyStack.shift();
}
function undo(){
  if(historyStack.length>0){
    redoStack.push(activeView.innerHTML);
    const last = historyStack.pop();
    activeView.innerHTML = last;
    updateLayerList();
  }
}
function redo(){
  if(redoStack.length>0){
    historyStack.push(activeView.innerHTML);
    const next = redoStack.pop();
    activeView.innerHTML = next;
    updateLayerList();
  }
}

/********************************************
 * PRODUCT SWITCHING
 ********************************************/
const productSelect = document.getElementById('productSelect');
productSelect.addEventListener('change',e=>{
  currentProduct = e.target.value;
  document.querySelectorAll('.product-stage').forEach(s=>s.classList.remove('active-product'));
  document.getElementById(`stage-${currentProduct}`).classList.add('active-product');
  activeView = document.getElementById(`view-${currentProduct}`);
});

/********************************************
 * ZOOM PREVIEW
 ********************************************/
const zoomSlider = document.getElementById('zoomSlider');
zoomSlider.addEventListener('input',()=>activeView.style.transform=`scale(${zoomSlider.value})`);

/********************************************
 * COLOR PICKERS
 ********************************************/

/********************************************
 * ADD TEXT
 ********************************************/
const addTextBtn = document.getElementById('addTextBtn');
const textInput = document.getElementById('textInput');
const fontSizeInput = document.getElementById('fontSizeInput');
const fontFamilySelect = document.getElementById('fontFamily');
const btnBold = document.getElementById('btnBold');
const btnItalic = document.getElementById('btnItalic');

addTextBtn.addEventListener('click',()=>{
  const div = document.createElement('div');
  div.classList.add('draggable');
  div.style.left='50%';
  div.style.top='50%';
  div.style.transform='translate(-50%, -50%)';
  div.style.fontSize = fontSizeInput.value+'px';
  div.style.fontFamily = fontFamilySelect.value;
  if(btnBold.classList.contains('active')) div.style.fontWeight='bold';
  if(btnItalic.classList.contains('active')) div.style.fontStyle='italic';
  div.innerHTML=`<span class="design-text" style="color:${fontColorPicker.getColor().toHEXA().toString()}">${textInput.value}</span><div class="resize-handle handle-br"></div>`;
  activeView.appendChild(div);
  makeDraggable(div);
  activeItem = div;
  updateLayerList();
  saveHistory();
  showTextEditor();
});

/********************************************
 * FONT EDIT CONTROLS
 ********************************************/
fontSizeInput.addEventListener('input',()=>{if(activeItem) activeItem.style.fontSize=fontSizeInput.value+'px';});
fontFamilySelect.addEventListener('change',()=>{if(activeItem) activeItem.style.fontFamily=fontFamilySelect.value;});
btnBold.addEventListener('click',()=>{btnBold.classList.toggle('active'); if(activeItem) activeItem.style.fontWeight=btnBold.classList.contains('active')?'bold':'normal';});
btnItalic.addEventListener('click',()=>{btnItalic.classList.toggle('active'); if(activeItem) activeItem.style.fontStyle=btnItalic.classList.contains('active')?'italic':'normal';});

function showTextEditor(){document.getElementById('textEditor').style.display='block';}

/********************************************
 * DRAGGABLE
 ********************************************/
function makeDraggable(el){
  let startX,startY,initX,initY;
  const handle = el.querySelector('.resize-handle');
  
  el.addEventListener('mousedown', e=>{
    activeItem=el;updateLayerList();
    if(e.target===handle){isResizing=true;return;}
    startX=e.clientX; startY=e.clientY;
    initX=parseInt(el.offsetLeft); initY=parseInt(el.offsetTop);
    document.addEventListener('mousemove', dragMove);
    document.addEventListener('mouseup', dragUp);
  });
  function dragMove(e){
    if(isResizing){
      const rect=el.getBoundingClientRect();
      const newWidth=e.clientX-rect.left;
      const newHeight=e.clientY-rect.top;
      el.style.width=newWidth+'px';
      el.style.height=newHeight+'px';
      return;
    }
    const dx=e.clientX-startX;
    const dy=e.clientY-startY;
    el.style.left=initX+dx+'px';
    el.style.top=initY+dy+'px';
  }
  function dragUp(){document.removeEventListener('mousemove', dragMove); document.removeEventListener('mouseup', dragUp); isResizing=false; saveHistory();}
}

/********************************************
 * LAYER MANAGER
 ********************************************/
function updateLayerList(){
  const container = document.getElementById('layerList');
  container.innerHTML='';
  Array.from(activeView.children).forEach((child,i)=>{
    const div=document.createElement('div');
    div.classList.add('layer-item');
    div.innerHTML=`<span>Layer ${i+1}</span> <button class="btn-icon btn-delete">X</button>`;
        div.querySelector('button').addEventListener('click', () => {
      activeView.removeChild(child);
      updateLayerList();
      saveHistory();
    });
    div.addEventListener('click', () => {
      activeItem = child;
      Array.from(activeView.children).forEach(c => c.classList.remove('active-layer'));
      child.classList.add('active-layer');
      showTextEditor();
    });
    container.appendChild(div);
  });
}

/********************************************
 * IMAGE UPLOAD
 ********************************************/
const imageInput = document.getElementById('imageInput');
imageInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    const img = document.createElement('img');
    img.src = ev.target.result;
    const div = document.createElement('div');
    div.classList.add('draggable');
    div.style.left = '50%';
    div.style.top = '50%';
    div.style.transform = 'translate(-50%, -50%)';
    div.appendChild(img);
    const handle = document.createElement('div');
    handle.classList.add('resize-handle', 'handle-br');
    div.appendChild(handle);
    activeView.appendChild(div);
    makeDraggable(div);
    activeItem = div;
    updateLayerList();
    saveHistory();
  };
  reader.readAsDataURL(file);
});

/********************************************
 * PIXABAY SEARCH
 ********************************************/
const pixabayGrid = document.getElementById('pixabayGrid');
const gallerySearch = document.getElementById('gallerySearch');

async function fetchPixabay(query = 'vector') {
  const res = await fetch(`https://pixabay.com/api/?key=${PIXABAY_API_KEY}&q=${encodeURIComponent(query)}&image_type=vector&per_page=20`);
  const data = await res.json();
  pixabayGrid.innerHTML = '';
  data.hits.forEach(hit => {
    const img = document.createElement('img');
    img.src = hit.previewURL;
    img.classList.add('gallery-item');
    img.addEventListener('click', () => {
      const div = document.createElement('div');
      div.classList.add('draggable');
      div.style.left = '50%';
      div.style.top = '50%';
      div.style.transform = 'translate(-50%, -50%)';
      const image = document.createElement('img');
      image.src = hit.largeImageURL;
      div.appendChild(image);
      const handle = document.createElement('div');
      handle.classList.add('resize-handle', 'handle-br');
      div.appendChild(handle);
      activeView.appendChild(div);
      makeDraggable(div);
      activeItem = div;
      updateLayerList();
      saveHistory();
    });
    pixabayGrid.appendChild(img);
  });
}

// Initial load
fetchPixabay();

// Search event
gallerySearch.addEventListener('keypress', e => {
  if(e.key==='Enter') fetchPixabay(gallerySearch.value);
});

/********************************************
 * SAVE PNG
 ********************************************/
document.getElementById('downloadBtn').addEventListener('click', () => {
  html2canvas(activeView).then(canvas => {
    const link = document.createElement('a');
    link.download = `${currentProduct}_design.png`;
    link.href = canvas.toDataURL();
    link.click();
  });
});

/********************************************
 * INITIALIZE LAYER LIST
 ********************************************/
updateLayerList();

</script>
</body>
</html>
