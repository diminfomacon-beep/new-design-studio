<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Custom Print Design Studio - Pro Editor</title>
  <style>
    :root {
      --primary: #111827;
      --accent: #3b82f6;
      --bg-light: #f5f5f5;
      --border-color: #ddd;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-light);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      user-select: none;
    }

    .studio-wrapper {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      padding: 24px;
      max-width: 1100px;
      width: 100%;
      display: grid;
      grid-template-columns: 300px 1.2fr 1fr; /* Gallery | Preview | Controls */
      gap: 20px;
    }

    /* GALLERY PANEL */
    .gallery-panel {
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 15px;
      background: #f9fafb;
      overflow-y: auto;
      max-height: 550px;
    }
    .gallery-title { font-size: 14px; font-weight: bold; margin-bottom: 10px; color: #333; }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
      gap: 10px;
    }
    .gallery-item {
      width: 60px; height: 60px;
      border: 2px solid #eee;
      border-radius: 8px;
      cursor: pointer;
      object-fit: contain;
      background: white;
      transition: border-color 0.2s;
    }
    .gallery-item:hover { border-color: var(--accent); }

    /* PREVIEW & LAYER AREA */
    .preview-container {
      background: #fdfdfd;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
      position: relative;
      min-height: 450px;
      overflow: hidden;
    }

    .product-stage {
      transition: background-color 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.05);
      position: relative;
      overflow: hidden;
    }

    .shape-tshirt { width: 300px; height: 300px; clip-path: polygon(25% 0%, 75% 0%, 100% 20%, 85% 35%, 85% 100%, 15% 100%, 15% 35%, 0% 20%); }
    .shape-ornament { width: 260px; height: 260px; border-radius: 50%; }
    .shape-tumbler { width: 160px; height: 280px; border-radius: 10px 10px 40px 40px; }

    /* DRAGGABLE LAYERS */
    .draggable {
      position: absolute;
      cursor: move;
      border: 1px dashed transparent;
      transition: border 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .draggable.active-layer { border: 1px dashed var(--accent); background: rgba(59, 130, 246, 0.05); }

    #layerImage img { max-width: 100%; max-height: 100%; display: none; pointer-events: none; }
    .design-text { font-weight: bold; text-align: center; white-space: nowrap; pointer-events: none; }

    /* CONTROLS */
    .controls-panel { display: flex; flex-direction: column; gap: 18px; }
    .step-content { display: none; flex-direction: column; gap: 15px; }
    .step-content.active { display: flex; }

    .control-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-weight: 600; font-size: 11px; color: #666; text-transform: uppercase; }
    input[type="text"], input[type="file"], select, input[type="range"] { padding: 8px; border-radius: 6px; border: 1px solid #ddd; }
    
    .layer-tools {
      background: #f3f4f6;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
    }

    .btn-group { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
    button { flex: 1; padding: 10px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; transition: opacity 0.2s; font-size: 13px;}
    button:hover { opacity: 0.9; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-secondary { background: #e5e7eb; color: #374151; }
    .btn-action { background: #dbeafe; color: #1e40af; }
    .btn-download { background: #d1fae5; color: #065f46; }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&family=Lobster&family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>

<div class="studio-wrapper">
  
  <div class="gallery-panel">
    <div class="gallery-title">Assets</div>
    <div class="gallery-grid" id="galleryGrid">
      </div>
  </div>

  <div class="preview-area">
    <div class="preview-container">
      <div id="productShape" class="product-stage shape-tshirt" style="background-color: #ffffff;">
        <div id="layerImage" class="draggable" style="top: 20%; left: 50%; transform: translateX(-50%); width: 100px;">
          <img id="uploadedImagePreview" src="" alt="" />
        </div>
        <div id="layerText" class="draggable" style="top: 50%; left: 50%; transform: translate(-50%, -50%);">
          <div id="designText" class="design-text" style="font-size: 24px; color: #000000; font-family: 'Roboto', sans-serif;">Your Text</div>
        </div>
      </div>
      <p style="font-size: 10px; color: #999; margin-top: 10px;">TIP: DRAG ITEMS TO POSITION THEM</p>
    </div>
  </div>

  <div class="controls-panel">
    <div id="step1" class="step-content active">
      <h2 style="margin:0">1. Editor</h2>
      
      <div class="control-group">
        <label>Product</label>
        <select id="productType">
          <option value="T-Shirt">T-Shirt</option>
          <option value="Ornament">Ornament</option>
          <option value="Tumbler">Tumbler</option>
        </select>
      </div>

      <div class="layer-tools">
        <label style="color: var(--accent); margin-bottom: 8px; display: block;">2. Layer Actions</label>
        <div class="btn-group" style="margin-bottom: 10px;">
            <button class="btn-action" id="centerBtn">↔ Center</button>
            <button class="btn-download" id="downloadBtn">💾 PNG</button>
        </div>

        <div class="control-group">
          <label>Text Content</label>
          <input type="text" id="textInput" placeholder="Enter text..." value="Your Text" />
        </div>

        <div class="control-group">
            <label>Font Style</label>
            <select id="fontSelect">
                <option value="'Roboto', sans-serif">Standard</option>
                <option value="'Lobster', cursive">Script</option>
                <option value="'Press Start 2P', cursive">Pixel</option>
            </select>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px;">
          <div class="control-group">
            <label>Text Size</label>
            <input type="range" id="textSizeRange" min="10" max="80" value="24">
          </div>
          <div class="control-group">
            <label>Image Size</label>
            <input type="range" id="imgSizeRange" min="20" max="250" value="100">
          </div>
        </div>
      </div>

      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
        <div class="control-group">
          <label>Text Color</label>
          <input type="color" id="textColor" value="#000000" style="width:100%; height:35px;">
        </div>
        <div class="control-group">
          <label>Product Color</label>
          <input type="color" id="bgColor" value="#ffffff" style="width:100%; height:35px;">
        </div>
      </div>

      <div class="btn-group">
        <button class="btn-secondary" onclick="location.reload()">Reset</button>
        <button class="btn-primary" id="nextBtn">Review →</button>
      </div>
    </div>

    <div id="step2" class="step-content">
      <h2>2. Confirm Design</h2>
      <div style="background: #f9fafb; padding: 15px; border-radius: 8px; font-size: 14px;">
        <p>Your layout is saved. We will receive the coordinates, font style, and sizing for your print.</p>
      </div>
      <div class="btn-group">
        <button class="btn-secondary" id="backBtn">← Back</button>
        <button class="btn-primary" id="submitDesign">Submit</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>
  // --- ASSET CONFIGURATION ---
  // Add your image URLs here for the gallery
  const galleryAssets = [
      'https://cdn-icons-png.flaticon.com/128/1157/1157077.png', // Heart
      'https://cdn-icons-png.flaticon.com/128/2921/2921820.png', // Star
      'https://cdn-icons-png.flaticon.com/128/3016/3016629.png'  // Camera
  ];

  // Initialize Gallery
  const grid = document.getElementById('galleryGrid');
  galleryAssets.forEach(src => {
      const img = document.createElement('img');
      img.src = src;
      img.className = 'gallery-item';
      img.onclick = () => setLayerImage(src);
      grid.appendChild(img);
  });

  // DOM Elements
  const textInput = document.getElementById('textInput');
  const textSizeRange = document.getElementById('textSizeRange');
  const imgSizeRange = document.getElementById('imgSizeRange');
  const fontSelect = document.getElementById('fontSelect');
  const textColor = document.getElementById('textColor');
  const bgColor = document.getElementById('bgColor');
  const productType = document.getElementById('productType');
  const centerBtn = document.getElementById('centerBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  
  const layerText = document.getElementById('layerText');
  const layerImage = document.getElementById('layerImage');
  const designText = document.getElementById('designText');
  const imgPreview = document.getElementById('uploadedImagePreview');
  const productShape = document.getElementById('productShape');

  // DRAG AND DROP
  let activeItem = null;
  let offset = { x: 0, y: 0 };

  function makeDraggable(el) {
    el.addEventListener('mousedown', (e) => {
      activeItem = el;
      document.querySelectorAll('.draggable').forEach(d => d.classList.remove('active-layer'));
      el.classList.add('active-layer');
      const rect = el.getBoundingClientRect();
      offset.x = e.clientX - rect.left;
      offset.y = e.clientY - rect.top;
    });
  }

  document.addEventListener('mousemove', (e) => {
    if (!activeItem) return;
    const containerRect = productShape.getBoundingClientRect();
    let newX = e.clientX - containerRect.left - offset.x;
    let newY = e.clientY - containerRect.top - offset.y;
    newX = Math.max(0, Math.min(newX, containerRect.width - activeItem.offsetWidth));
    newY = Math.max(0, Math.min(newY, containerRect.height - activeItem.offsetHeight));
    activeItem.style.left = newX + 'px';
    activeItem.style.top = newY + 'px';
    activeItem.style.transform = 'none';
  });
  document.addEventListener('mouseup', () => { activeItem = null; });
  makeDraggable(layerText);
  makeDraggable(layerImage);

  // Layer Functions
  function setLayerImage(src) {
      imgPreview.src = src;
      imgPreview.style.display = 'block';
  }

  centerBtn.addEventListener('click', () => {
    layerText.style.left = '50%'; layerText.style.top = '50%';
    layerText.style.transform = 'translate(-50%, -50%)';
    layerImage.style.left = '50%'; layerImage.style.top = '20%';
    layerImage.style.transform = 'translateX(-50%)';
  });

  downloadBtn.addEventListener('click', () => {
    downloadBtn.textContent = "Generating...";
    html2canvas(productShape, { backgroundColor: null, logging: false }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'design.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
        downloadBtn.textContent = "💾 PNG";
    });
  });

  // Event Listeners
  textInput.addEventListener('input', () => designText.textContent = textInput.value || "Your Text");
  textSizeRange.addEventListener('input', () => designText.style.fontSize = textSizeRange.value + 'px');
  imgSizeRange.addEventListener('input', () => layerImage.style.width = imgSizeRange.value + 'px');
  fontSelect.addEventListener('change', () => designText.style.fontFamily = fontSelect.value);
  textColor.addEventListener('input', () => designText.style.color = textColor.value);
  bgColor.addEventListener('input', () => productShape.style.backgroundColor = bgColor.value);

  productType.addEventListener('change', () => {
    productShape.className = 'product-stage ' + 
      (productType.value === 'Ornament' ? 'shape-ornament' : 
       productType.value === 'Tumbler' ? 'shape-tumbler' : 'shape-tshirt');
  });

  // Navigation
  document.getElementById('nextBtn').addEventListener('click', () => {
    document.getElementById('step1').classList.remove('active');
    document.getElementById('step2').classList.add('active');
  });
  document.getElementById('backBtn').addEventListener('click', () => {
    document.getElementById('step2').classList.remove('active');
    document.getElementById('step1').classList.add('active');
  });

  // Submit
  document.getElementById('submitDesign').addEventListener('click', () => {
    const baseUrl = 'https://docs.google.com/forms/d/e/1FAIpQLSd5FvoEdzSMsDMcg0Bwqok-fIrxrFldzu1wvw91pqc-0ccMHA/viewform?';
    const layout = `PosT:${layerText.style.top},${layerText.style.left} PosI:${layerImage.style.top},${layerImage.style.left} SizeT:${textSizeRange.value}px SizeI:${imgSizeRange.value}px Font:${fontSelect.options[fontSelect.selectedIndex].text}`;
    
    const params = new URLSearchParams({
      'entry.2141379241': productType.value,
      'entry.1449325312': textInput.value + " | " + layout,
      'entry.1145569502': textColor.value,
      'entry.125041649': bgColor.value
    });
    window.open(baseUrl + params.toString(), "_blank");
  });
</script>
</body>
</html>
