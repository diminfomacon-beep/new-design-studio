<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Custom Print Design Studio - Multi-Layer</title>
  <style>
    :root {
      --primary: #111827;
      --accent: #3b82f6;
      --bg-light: #f5f5f5;
      --border-color: #ddd;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-light);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      user-select: none;
    }

    .studio-wrapper {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      padding: 24px;
      max-width: 1200px;
      width: 100%;
      display: grid;
      grid-template-columns: 250px 1fr 300px; /* Gallery | Preview | Controls */
      gap: 20px;
    }

    /* GALLERY */
    .gallery-panel {
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 15px;
      background: #f9fafb;
      overflow-y: auto;
      max-height: 600px;
    }
    .gallery-title { font-size: 14px; font-weight: bold; margin-bottom: 15px; color: #333; }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
      gap: 10px;
    }
    .gallery-item {
      width: 60px; height: 60px;
      border: 2px solid #eee;
      border-radius: 8px;
      cursor: pointer;
      object-fit: contain;
      background: white;
      transition: border-color 0.2s;
    }
    .gallery-item:hover { border-color: var(--accent); }

    /* PREVIEW */
    .preview-container {
      background: #fdfdfd;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
      position: relative;
      min-height: 500px;
      overflow: hidden;
    }

    .product-stage {
      transition: background-color 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.05);
      position: relative;
      overflow: hidden;
      background-size: cover;
    }

    .shape-tshirt { width: 350px; height: 350px; clip-path: polygon(25% 0%, 75% 0%, 100% 20%, 85% 35%, 85% 100%, 15% 100%, 15% 35%, 0% 20%); }
    .shape-ornament { width: 300px; height: 300px; border-radius: 50%; }
    .shape-tumbler { width: 180px; height: 320px; border-radius: 10px 10px 40px 40px; }

    /* LAYERS */
    .draggable {
      position: absolute;
      cursor: move;
      border: 1px dashed transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 20px;
      min-height: 20px;
    }
    .draggable.active-layer { border: 1px dashed var(--accent); }
    .draggable img { max-width: 100%; max-height: 100%; pointer-events: none; }
    .design-text { font-weight: bold; text-align: center; white-space: nowrap; pointer-events: none; }

    /* CONTROLS */
    .controls-panel { display: flex; flex-direction: column; gap: 15px; }
    .control-group { display: flex; flex-direction: column; gap: 5px; }
    label { font-weight: 600; font-size: 11px; color: #666; text-transform: uppercase; }
    input, select { padding: 8px; border-radius: 6px; border: 1px solid #ddd; font-size: 13px;}
    
    .layer-manager {
        background: #f3f4f6; padding: 10px; border-radius: 8px; border: 1px solid #e5e7eb;
        max-height: 200px; overflow-y: auto;
    }
    .layer-item {
        display: flex; justify-content: space-between; align-items: center;
        background: white; padding: 5px 10px; border-radius: 4px; margin-bottom: 5px; font-size: 12px;
    }
    .btn-delete { background: #fee2e2; color: #991b1b; border: none; padding: 2px 6px; border-radius: 4px; cursor: pointer; }

    .btn-group { display: flex; gap: 10px; margin-top: 10px; }
    button { flex: 1; padding: 10px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; font-size: 13px;}
    .btn-primary { background: var(--primary); color: white; }
    .btn-secondary { background: #e5e7eb; color: #374151; }
    .btn-action { background: #dbeafe; color: #1e40af; }
    .btn-download { background: #d1fae5; color: #065f46; }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&family=Lobster&family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>

<div class="studio-wrapper">
  
  <div class="gallery-panel">
    <div class="gallery-title">Assets</div>
    <div class="gallery-grid" id="galleryGrid"></div>
    <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
    <div class="control-group">
        <label>Upload Image</label>
        <input type="file" id="imageInput" accept="image/*" />
    </div>
  </div>

  <div class="preview-container">
    <div id="productShape" class="product-stage shape-tshirt" style="background-color: #ffffff;">
      </div>
    <p style="font-size: 10px; color: #999; margin-top: 10px;">DRAG ITEMS TO POSITION</p>
  </div>

  <div class="controls-panel">
    <h3 style="margin:0">Editor</h3>
    
    <div class="control-group">
      <label>Product</label>
      <select id="productType">
        <option value="T-Shirt">T-Shirt</option>
        <option value="Ornament">Ornament</option>
        <option value="Tumbler">Tumbler</option>
      </select>
    </div>

    <div class="control-group">
      <label>Product Color</label>
      <input type="color" id="bgColor" value="#ffffff">
    </div>

    <div class="control-group">
        <label>Add Text Layer</label>
        <div style="display:flex; gap:5px;">
            <input type="text" id="textInput" placeholder="Enter text..." value="New Text" style="flex:1"/>
            <button class="btn-action" id="addTextBtn">Add</button>
        </div>
    </div>

    <div class="layer-manager">
        <label style="color: var(--accent); margin-bottom: 8px; display: block;">Active Layers</label>
        <div id="layerList"></div>
    </div>

    <div class="btn-group">
        <button class="btn-download" id="downloadBtn">💾 PNG</button>
        <button class="btn-primary" id="submitDesign">Submit</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>
  // --- CONFIGURATION ---
  const galleryAssets = [
      'https://cdn-icons-png.flaticon.com/128/1157/1157077.png',
      'https://cdn-icons-png.flaticon.com/128/2921/2921820.png',
      'https://cdn-icons-png.flaticon.com/128/3016/3016629.png'
  ];

  // Initialize Gallery
  const grid = document.getElementById('galleryGrid');
  galleryAssets.forEach(src => {
      const img = document.createElement('img');
      img.src = src; img.className = 'gallery-item';
      img.onclick = () => createLayer('image', src);
      grid.appendChild(img);
  });

  // DOM Elements
  const productShape = document.getElementById('productShape');
  const layerList = document.getElementById('layerList');
  let layerCount = 0;

  // --- LAYER MANAGEMENT ---
  function createLayer(type, content) {
    layerCount++;
    const layerId = 'layer_' + layerCount;
    
    // Create layer container
    const layer = document.createElement('div');
    layer.id = layerId;
    layer.className = 'draggable';
    layer.style.top = '50px'; layer.style.left = '50px';
    
    if (type === 'image') {
        const img = document.createElement('img');
        img.src = content;
        img.style.width = '100px'; // Default size
        layer.appendChild(img);
        addLayerToList(layerId, 'Image');
    } else {
        const text = document.createElement('div');
        text.className = 'design-text';
        text.textContent = content;
        text.style.fontSize = '24px';
        text.style.fontFamily = 'Roboto';
        layer.appendChild(text);
        addLayerToList(layerId, 'Text: ' + content);
    }
    
    productShape.appendChild(layer);
    makeDraggable(layer);
  }

  function addLayerToList(id, name) {
      const item = document.createElement('div');
      item.className = 'layer-item';
      item.id = 'list_' + id;
      item.innerHTML = `<span>${name}</span> <button class="btn-delete" onclick="removeLayer('${id}')">X</button>`;
      layerList.appendChild(item);
  }

  function removeLayer(id) {
      document.getElementById(id).remove();
      document.getElementById('list_' + id).remove();
  }

  // --- DRAG AND DROP ---
  let activeItem = null;
  let offset = { x: 0, y: 0 };

  function makeDraggable(el) {
    el.addEventListener('mousedown', (e) => {
      activeItem = el;
      document.querySelectorAll('.draggable').forEach(d => d.classList.remove('active-layer'));
      el.classList.add('active-layer');
      const rect = el.getBoundingClientRect();
      offset.x = e.clientX - rect.left;
      offset.y = e.clientY - rect.top;
    });
  }

  document.addEventListener('mousemove', (e) => {
    if (!activeItem) return;
    const containerRect = productShape.getBoundingClientRect();
    let newX = e.clientX - containerRect.left - offset.x;
    let newY = e.clientY - containerRect.top - offset.y;
    // Simple boundary check
    newX = Math.max(0, Math.min(newX, containerRect.width - activeItem.offsetWidth));
    newY = Math.max(0, Math.min(newY, containerRect.height - activeItem.offsetHeight));
    activeItem.style.left = newX + 'px';
    activeItem.style.top = newY + 'px';
  });
  document.addEventListener('mouseup', () => { activeItem = null; });

  // --- CONTROLS ---
  document.getElementById('addTextBtn').addEventListener('click', () => {
      const text = document.getElementById('textInput').value;
      if(text) createLayer('text', text);
  });

  document.getElementById('imageInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = (ev) => createLayer('image', ev.target.result);
      reader.readAsDataURL(file);
    }
  });

  document.getElementById('bgColor').addEventListener('input', (e) => productShape.style.backgroundColor = e.target.value);
  
  document.getElementById('productType').addEventListener('change', (e) => {
    productShape.className = 'product-stage ' + 
      (e.target.value === 'Ornament' ? 'shape-ornament' : 
       e.target.value === 'Tumbler' ? 'shape-tumbler' : 'shape-tshirt');
  });

  // --- PNG DOWNLOAD ---
  document.getElementById('downloadBtn').addEventListener('click', () => {
    html2canvas(productShape, { backgroundColor: null }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'design.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    });
  });

  // --- SUBMIT ---
  document.getElementById('submitDesign').addEventListener('click', () => {
    const baseUrl = 'https://docs.google.com/forms/d/e/1FAIpQLSd5FvoEdzSMsDMcg0Bwqok-fIrxrFldzu1wvw91pqc-0ccMHA/viewform?';
    // For multiple layers, we send a summary to the form
    const layers = document.querySelectorAll('.draggable');
    let layerSummary = "";
    layers.forEach(l => layerSummary += `[${l.id}: T${l.style.top} L${l.style.left}] `);
    
    const params = new URLSearchParams({
      'entry.2141379241': productType.value,
      'entry.1449325312': "Multiple Layers: " + layerSummary,
      'entry.1145569502': 'See Layout Summary',
      'entry.125041649': bgColor.value
    });
    window.open(baseUrl + params.toString(), "_blank");
  });
</script>
</body>
</html>
