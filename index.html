<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Custom Design Studio - API Fonts & Swatches</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/themes/classic.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/pickr.min.js"></script>

  <style>
    :root {
      --primary: #111827;
      --accent: #3b82f6;
      --bg-light: #f5f5f5;
      --border-color: #ddd;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-light);
      margin: 0;
      padding: 10px;
      display: flex;
      justify-content: center;
      user-select: none;
      box-sizing: border-box;
    }

    .studio-wrapper {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      padding: 15px;
      width: 100%;
      display: grid;
      grid-template-columns: 240px 1fr 240px;
      gap: 15px;
      box-sizing: border-box;
    }

    /* GALLERY PANEL */
    .gallery-panel {
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 10px;
      background: #f9fafb;
      display: flex;
      flex-direction: column;
      height: 600px;
      overflow: hidden;
    }
    .gallery-header { margin-bottom: 10px; display: flex; flex-direction: column; gap: 5px; }
    .gallery-title { font-size: 13px; font-weight: bold; color: #333; }
    .gallery-search { padding: 5px; border-radius: 6px; border: 1px solid #ddd; font-size: 11px; width: 100%; box-sizing: border-box; }
    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); gap: 8px; overflow-y: auto; flex-grow: 1; }
    .gallery-item { width: 50px; height: 50px; border: 2px solid #eee; border-radius: 8px; cursor: pointer; object-fit: contain; background: white; transition: all 0.2s; }
    .gallery-item:hover { border-color: var(--accent); transform: scale(1.05); }

    /* PREVIEW PANEL */
    .preview-container {
      background: #e5e7eb;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
      position: relative;
      min-height: 500px;
      gap: 15px;
      overflow: hidden;
    }
    .product-stage { display: none; position: relative; transition: transform 0.1s ease-out; align-items: center; justify-content: center; }
    .product-stage.active-product { display: flex; }
    .product-view { box-shadow: 0 10px 25px rgba(0,0,0,0.2); position: relative; overflow: hidden; background-color: white; cursor: pointer; }
    .view-tshirt { width: 300px; height: 350px; clip-path: polygon(25% 0%, 75% 0%, 100% 20%, 85% 35%, 85% 100%, 15% 100%, 15% 35%, 0% 20%); }
    .view-tumbler { width: 120px; height: 300px; border-radius: 10px; }
    .view-mug { width: 180px; height: 160px; border-radius: 10px 10px 50px 50px; }

    /* LAYERS */
    .draggable { position: absolute; cursor: move; border: 2px solid transparent; display: flex; align-items: center; justify-content: center; box-sizing: border-box; touch-action: none; -webkit-font-smoothing: antialiased; }
    .draggable.active-layer { border: 2px solid var(--accent); }
    .draggable img { max-width: 100%; max-height: 100%; pointer-events: none; }
    .design-text { text-align: center; pointer-events: none; word-break: break-word; display: block; width: 100%; line-height: 1.2; }
    .resize-handle { width: 10px; height: 10px; background: white; border: 2px solid var(--accent); position: absolute; display: none; cursor: nwse-resize; }
    .draggable.active-layer .resize-handle { display: block; }
    .handle-br { bottom: -5px; right: -5px; }

    /* CONTROLS PANEL */
    .controls-panel { display: flex; flex-direction: column; gap: 10px; }
    .control-group { display: flex; flex-direction: column; gap: 3px; }
    label { font-weight: 600; font-size: 10px; color: #666; text-transform: uppercase; }
    input, select { padding: 6px; border-radius: 6px; border: 1px solid #ddd; font-size: 12px; }
    
    /* Updated Color Picker Section */
    .color-picker-wrapper { display: flex; align-items: center; gap: 5px; }
    #bgPicker { border: 1px solid #ddd; border-radius: 6px; padding: 3px; background: white; width: 30px; height: 30px; }
    .swatches-container { display: flex; gap: 3px; flex-wrap: wrap; flex: 1; }
    .swatch { width: 20px; height: 20px; border-radius: 4px; border: 1px solid #ccc; cursor: pointer; transition: transform 0.1s; }
    .swatch:hover { transform: scale(1.1); }
    
    .layer-manager { background: #f3f4f6; padding: 8px; border-radius: 8px; border: 1px solid #e5e7eb; max-height: 150px; overflow-y: auto; }
    .layer-item { display: flex; justify-content: space-between; align-items: center; background: white; padding: 6px; border-radius: 4px; margin-bottom: 4px; font-size: 11px; border: 1px solid #eee; }
    .btn-icon { background: #eee; border: none; padding: 2px 5px; border-radius: 3px; cursor: pointer; }
    .btn-delete { background: #fee2e2; color: #991b1b; }
    .btn-group { display: flex; gap: 8px; }
    button { padding: 8px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; font-size: 12px; }
    .btn-primary { background: var(--primary); color: white; flex: 1; }
    .btn-action { background: #dbeafe; color: #1e40af; }
    
    #textEditor { display: none; background: #f3f4f6; padding: 8px; border-radius: 8px; }
    #fontFamily { font-size: 12px; }
  </style>
</head>
<body>

<div class="studio-wrapper">
  
  <div class="gallery-panel">
    <div class="gallery-header">
        <div class="gallery-title">Assets</div>
        <input type="text" id="gallerySearch" class="gallery-search" placeholder="Search icons...">
    </div>
    <div class="gallery-grid" id="galleryGrid"></div>
    <hr style="border: 0; border-top: 1px solid #eee; margin: 10px 0;">
    <div class="control-group">
        <label>Upload Image</label>
        <input type="file" id="imageInput" accept="image/*" style="padding: 3px;" />
    </div>
  </div>

  <div class="preview-container">
    <div id="stage-tshirt" class="product-stage active-product">
        <div id="view-tshirt" class="product-view view-tshirt"></div>
    </div>
    <div id="stage-tumbler" class="product-stage">
        <div id="view-tumbler" class="product-view view-tumbler"></div>
    </div>
    <div id="stage-mug" class="product-stage">
        <div id="view-mug" class="product-view view-mug"></div>
    </div>
  </div>

  <div class="controls-panel">
    <h3 style="margin:0; font-size: 16px;">Editor</h3>
    <div class="control-group">
        <label>Product</label>
        <select id="productSelect">
            <option value="tshirt">T-Shirt</option>
            <option value="tumbler">Tumbler</option>
            <option value="mug">Mug</option>
        </select>
    </div>
    <div class="control-group">
        <label>Zoom</label>
        <input type="range" id="zoomSlider" min="0.5" max="2" step="0.1" value="1">
    </div>
    
    <div class="control-group">
        <label>Product Color</label>
        <div class="color-picker-wrapper">
            <div id="bgPicker"></div>
            <div class="swatches-container" id="colorSwatches"></div>
        </div>
    </div>

    <div class="control-group">
        <label>Add Text</label>
        <div style="display:flex; gap:3px;">
            <input type="text" id="textInput" placeholder="Enter text..." value="Hello" style="flex:1"/>
            <button class="btn-action" id="addTextBtn">Add</button>
        </div>
    </div>
    
    <div id="textEditor">
        <label style="color: var(--accent); font-size: 10px;">Text Style</label>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 3px;">
            <div id="fontColorPicker" style="border: 1px solid #ddd; border-radius: 6px; padding: 2px; background: white; height: 20px;"></div>
            <select id="fontFamily" style="grid-column: span 2; padding: 4px;"></select>
        </div>
    </div>

    <div class="layer-manager">
        <label style="color: var(--accent); font-size: 10px;">Layers</label>
        <div id="layerList"></div>
    </div>

    <div class="btn-group">
        <button class="btn-primary" id="submitDesign">Submit</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>
  // --- CONFIGURATION ---
  const GOOGLE_API_KEY = 'YOUR_API_KEY'; // <--- PASTE KEY HERE
  const PIXABAY_API_KEY = '54841320-2fc493da46915b0eb0a6f740c';
  let activeViewId = 'view-tshirt';
  let currentProduct = 'tshirt';
  let layerCount = 0;

  // --- INITIALIZATION ---
  const fontFamilySelect = document.getElementById('fontFamily');
  const textEditor = document.getElementById('textEditor');

  // --- COLOR SWATCHES SETUP ---
  const swatches = ['#ffffff', '#000000', '#f44336', '#e91e63', '#9c27b0', '#673ab7', '#3f51b5', '#2196f3', '#03a9f4', '#00bcd4', '#009688', '#4caf50', '#8bc34a', '#cddc39', '#ffeb3b', '#ffc107', '#ff9800', '#ff5722', '#795548', '#9e9e9e'];
  const swatchesContainer = document.getElementById('colorSwatches');
  swatches.forEach(color => {
      const swatch = document.createElement('div');
      swatch.className = 'swatch';
      swatch.style.backgroundColor = color;
      swatch.onclick = () => {
          document.querySelectorAll('.product-view').forEach(v => v.style.backgroundColor = color);
          bgPicker.setColor(color);
      };
      swatchesContainer.appendChild(swatch);
  });

  // --- GOOGLE FONTS API INTEGRATION ---
  async function populateFontDropdown() {
      try {
          const response = await fetch(`https://www.googleapis.com/webfonts/v1/webfonts?key=${GOOGLE_API_KEY}&sort=popularity`);
          const data = await response.json();
          fontFamilySelect.innerHTML = '';
          data.items.slice(0, 50).forEach(font => {
              const option = document.createElement('option');
              option.value = `'${font.family}', ${font.category}`;
              option.textContent = font.family;
              option.style.fontFamily = `'${font.family}'`;
              fontFamilySelect.appendChild(option);
          });
          loadAndApplyFont(fontFamilySelect.value);
      } catch (error) {
          console.error('Error fetching fonts:', error);
          fontFamilySelect.innerHTML = '<option>Error loading fonts</option>';
      }
  }

  function loadAndApplyFont(fontFamilyValue) {
      const fontName = fontFamilyValue.split(',')[0].replace(/'/g, '');
      const link = document.createElement('link');
      link.href = `https://fonts.googleapis.com/css2?family=${fontName.replace(/ /g, '+')}&display=swap`;
      link.rel = 'stylesheet';
      document.head.appendChild(link);
      const activeLayerText = document.querySelector('.active-layer .design-text');
      if (activeLayerText) activeLayerText.style.fontFamily = fontFamilyValue;
  }

  fontFamilySelect.addEventListener('change', (e) => loadAndApplyFont(e.target.value));

  // --- CORE FUNCTIONALITY ---
  document.getElementById('productSelect').addEventListener('change', (e) => {
      currentProduct = e.target.value;
      document.querySelectorAll('.product-stage').forEach(s => s.classList.remove('active-product'));
      const stage = document.getElementById('stage-' + currentProduct);
      stage.classList.add('active-product');
      activeViewId = stage.querySelector('.product-view').id;
  });

  document.getElementById('zoomSlider').addEventListener('input', (e) => {
      document.querySelector('.active-product').style.transform = `scale(${e.target.value})`;
  });

  // --- ADVANCED COLOR PICKERS ---
  const createColorPicker = (selector, defaultColor) => {
      return Pickr.create({
          el: selector, theme: 'classic', default: defaultColor,
          components: { preview: true, hue: true, interaction: { input: true, save: true } }
      });
  };

  const bgPicker = createColorPicker('#bgPicker', '#ffffff');
  const fontColorPicker = createColorPicker('#fontColorPicker', '#000000');

  bgPicker.on('change', (color) => {
      document.querySelectorAll('.product-view').forEach(v => v.style.backgroundColor = color.toHEXA().toString());
  });

  fontColorPicker.on('change', (color) => {
      const activeText = document.querySelector('.active-layer .design-text');
      if(activeText) activeText.style.color = color.toHEXA().toString();
  });

  // --- ASSET GALLERY (PIXABAY) ---
  async function loadGallery(searchTerm = 'logo') {
    const grid = document.getElementById('galleryGrid');
    const apiUrl = `https://pixabay.com/api/?key=${PIXABAY_API_KEY}&q=${encodeURIComponent(searchTerm)}&image_type=vector`;
    try {
        const response = await fetch(apiUrl);
        const data = await response.json();
        grid.innerHTML = '';
        data.hits.slice(0, 15).forEach(image => {
            const img = document.createElement('img');
            img.src = image.previewURL;
            img.className = 'gallery-item';
            img.onclick = () => createLayer('image', image.largeImageURL);
            grid.appendChild(img);
        });
    } catch (error) {}
  }
  document.getElementById('gallerySearch').addEventListener('input', (e) => loadGallery(e.target.value));
  
  // --- LAYERS & MANIPULATION ---
  function createLayer(type, content) {
    layerCount++;
    const layerId = 'layer_' + layerCount;
    const layer = document.createElement('div');
    layer.id = layerId;
    layer.className = 'draggable active-layer';
    layer.style.top = '50px'; layer.style.left = '50px';
    
    if (type === 'image') {
        const img = document.createElement('img');
        img.src = content;
        layer.appendChild(img);
        textEditor.style.display = 'none';
    } else {
        const text = document.createElement('div');
        text.className = 'design-text';
        text.textContent = content;
        text.style.fontSize = '24px';
        text.style.fontFamily = fontFamilySelect.value;
        layer.appendChild(text);
        textEditor.style.display = 'block';
        loadAndApplyFont(fontFamilySelect.value);
    }

    const handle = document.createElement('div');
    handle.className = 'resize-handle handle-br';
    layer.appendChild(handle);
    
    document.getElementById(activeViewId).appendChild(layer);
    makeDraggable(layer);
    makeResizable(layer, handle, type);
    
    document.querySelectorAll('.draggable').forEach(d => d.classList.remove('active-layer'));
    layer.classList.add('active-layer');
    addLayerToList(layerId, type === 'image' ? 'Image' : 'Text');
  }

  function addLayerToList(id, name) {
      const item = document.createElement('div');
      item.className = 'layer-item';
      item.id = 'list_' + id;
      item.innerHTML = `<span>${name}</span><button class="btn-icon btn-delete" onclick="removeLayer('${id}')">X</button>`;
      document.getElementById('layerList').prepend(item);
  }

  function removeLayer(id) {
      document.getElementById(id).remove();
      document.getElementById('list_' + id).remove();
  }

  // --- DRAG & RESIZE LOGIC ---
  let activeItem = null, offset = { x: 0, y: 0 }, isResizing = false;

  function makeDraggable(el) {
    el.addEventListener('mousedown', (e) => {
      if (isResizing) return;
      activeItem = el;
      document.querySelectorAll('.draggable').forEach(d => d.classList.remove('active-layer'));
      el.classList.add('active-layer');
      const rect = el.getBoundingClientRect();
      offset.x = e.clientX - rect.left; offset.y = e.clientY - rect.top;
      textEditor.style.display = el.querySelector('.design-text') ? 'block' : 'none';
    });
  }

  function makeResizable(el, handle, type) {
      handle.addEventListener('mousedown', (e) => {
          isResizing = true; activeItem = el; e.stopPropagation();
          document.addEventListener('mousemove', resize);
          document.addEventListener('mouseup', () => {
              isResizing = false; document.removeEventListener('mousemove', resize);
          });
      });
      function resize(e) {
          const elRect = el.getBoundingClientRect();
          const newWidth = e.clientX - elRect.left;
          el.style.width = Math.max(20, newWidth) + 'px';
          if(type === 'text') el.querySelector('.design-text').style.fontSize = Math.max(10, newWidth * 0.4) + 'px';
      }
  }

  document.addEventListener('mousemove', (e) => {
    if (!activeItem || isResizing) return;
    const containerRect = activeItem.parentNode.getBoundingClientRect();
    activeItem.style.left = (e.clientX - containerRect.left - offset.x) + 'px';
    activeItem.style.top = (e.clientY - containerRect.top - offset.y) + 'px';
  });
  document.addEventListener('mouseup', () => { activeItem = null; });

  // --- EVENTS ---
  document.getElementById('addTextBtn').addEventListener('click', () => {
      const text = document.getElementById('textInput').value;
      if(text) createLayer('text', text);
  });
  document.getElementById('imageInput').addEventListener('change', (e) => {
    const reader = new FileReader();
    reader.onload = (ev) => createLayer('image', ev.target.result);
    if(e.target.files[0]) reader.readAsDataURL(e.target.files[0]);
  });
  document.getElementById('submitDesign').addEventListener('click', () => alert('Design Submitted!'));

  // --- STARTUP ---
  populateFontDropdown();
  loadGallery();
</script>
</body>
</html>
