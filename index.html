<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Studio Pro | Desktop</title>
    
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Bungee&family=Creepster&family=Lobster&family=Monoton&family=Montserrat&family=Pacifico&family=Playfair+Display&family=Press+Start+2P&family=Rock+Salt&family=Special+Elite&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Aladin&family=Chango&family=Chewy&family=Chicle&family=Coiny&family=DynaPuff:wght@400..700&family=Honk&family=Irish+Grover&family=Macondo&family=Matemasie&family=Miltonian+Tattoo&family=Monofett&family=Nabla&family=Noto+Color+Emoji&family=Oleo+Script+Swash+Caps:wght@400;700&family=Ranchers&family=Ribeye&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body>
    <div class="studio-container">
        
        <aside class="sidebar" id="controlsSidebar">
            <div class="sidebar-header">
                <h2>Design Tools</h2>
            </div>

            <section id="tab-graphics" class="control-panel">
                <h3>Search Graphics</h3>
                <div class="search-group">
                    <input type="text" id="pixabaySearch" placeholder="Search graphics...">
                    <button onclick="searchPixabay()">Search</button>
                </div>
                <div id="gallery"></div>
            </section>
           <section id="tab-templates" class="control-panel">
                <h3>Preset Layouts</h3>
                <div class="search-group" style="margin-bottom: 10px;">
                    <input type="text" id="templateSearch" placeholder="Search templates..." oninput="filterTemplates()">
                </div>
                <div class="template-grid">
                    </div>
            </section>
            <section id="tab-text" class="control-panel">
            <h3>Add Text</h3>
            <textarea id="textInput" rows="3" placeholder="Enter your text here..."></textarea>
            <button onclick="placeTextOnCanvas()" class="primary-btn">Add to Canvas</button>
            
            <div id="textControls">
                <h4>Font Style</h4>
                <select id="fontFamily" onchange="updateLiveText()">
                        <option value="'Montserrat', sans-serif" style="font-family: 'Montserrat';">Montserrat</option>
                        <option value="'Playfair Display', serif" style="font-family: 'Playfair Display';">Playfair Display</option>
                        <option value="'Pacifico', cursive" style="font-family: 'Pacifico';">Pacifico</option>
                        <option value="'Lobster', cursive" style="font-family: 'Lobster';">Lobster</option>
                        <option value="'Bungee', cursive" style="font-family: 'Bungee';">Bungee</option>
                        <option value="'Anton', sans-serif" style="font-family: 'Anton';">Anton</option>
                        <option value="'Bangers', cursive" style="font-family: 'Bangers';">Bangers</option>
                        <option value="'Rock Salt', cursive" style="font-family: 'Rock Salt';">Rock Salt</option>
                        <option value="'Monoton', cursive" style="font-family: 'Monoton';">Monoton</option>
                        <option value="'Special Elite', cursive" style="font-family: 'Special Elite';">Special Elite</option>
                        <option value="'Creepster', cursive" style="font-family: 'Creepster';">Creepster</option>
                        <option value="'Press Start 2P', cursive" style="font-family: 'Press Start 2P';">Pixel</option>
                        <option value="Arial">Standard Arial</option>
                        <option value="Aladin" style="font-family: 'Aladin';">Aladin</option>
                        <option value="Chango" style="font-family: 'Chango';">Chango</option>
                        <option value="Chewy" style="font-family: 'Chewy';">Chewy</option>
                        <option value="Chicle" style="font-family: 'Chicle';">Chicle</option>
                        <option value="Coiny" style="font-family: 'Coiny';">Coiny</option>
                        <option value="DynaPuff" style="font-family: 'DynaPuff';">DynaPuff</option>
                        <option value="Honk" style="font-family: 'Honk';">Honk (Color Font)</option>
                        <option value="Irish Grover" style="font-family: 'Irish Grover';">Irish Grover</option>
                        <option value="Macondo" style="font-family: 'Macondo';">Macondo</option>
                        <option value="Matemasie" style="font-family: 'Matemasie';">Matemasie</option>
                        <option value="Miltonian Tattoo" style="font-family: 'Miltonian Tattoo';">Miltonian Tattoo</option>
                        <option value="Monofett" style="font-family: 'Monofett';">Monofett</option>
                        <option value="Nabla" style="font-family: 'Nabla';">Nabla (3D Color)</option>
                        <option value="Noto Color Emoji" style="font-family: 'Noto Color Emoji';">Emoji Font</option>
                        <option value="Oleo Script Swash Caps" style="font-family: 'Oleo Script Swash Caps';">Oleo Script</option>
                        <option value="Ranchers" style="font-family: 'Ranchers';">Ranchers</option>
                        <option value="Ribeye" style="font-family: 'Ribeye';">Ribeye</option>
                    </select>
                    <h4>Text Size</h4>
                    <input type="number" id="fontSize" value="30" onchange="updateLiveText()" class="short-input">

                    <h4>Text Align</h4>
                    <div class="alignment-group">
                        <button type="button" class="btn-align" onclick="setTextAlignment('left')" title="Align Left">
                            <svg viewBox="0 0 24 24"><path d="M4 18h16v2H4zm0-4h12v2H4zm0-4h16v2H4zm0-4h12v2H4z"/></svg>
                        </button>
                        <button type="button" class="btn-align" onclick="setTextAlignment('center')" title="Align Center">
                            <svg viewBox="0 0 24 24"><path d="M4 18h16v2H4zm4-4h8v2H8zm-4-4h16v2H4zm4-4h8v2H8z"/></svg>
                        </button>
                        <button type="button" class="btn-align" onclick="setTextAlignment('right')" title="Align Right">
                            <svg viewBox="0 0 24 24"><path d="M4 18h16v2H4zm8-4h8v2h-8zm-8-4h16v2H4zm8-4h8v2h-8z"/></svg>
                        </button>
                    </div>

                    <div class="palette-container">
                        <h4>Text Color</h4>
                        <button type="button" id="paletteToggle" onclick="togglePalette(event)">🎨</button>
                        <div id="swatchPalette" class="swatch-popup"></div>
                    </div>
                </div>
            </section>

            <section id="tab-edit" class="control-panel">
                <h3>Manage Layers</h3>
                <div class="layer-buttons">
                    <button onclick="bringForward()">🔻 Forward</button>
                    <button onclick="sendBackward()">🔺Backward</button>
                </div>
                <button onclick="document.getElementById('imageUploader').click()">📤 Upload Image</button>
                <input type="file" id="imageUploader" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
                <button onclick="deleteObject()" class="delete-btn">🗑️ Delete Selected</button>
            </section>

            <section id="tab-save" class="control-panel">
                <h3>Save & Send</h3>
                <form id="submitForm">
                    <input type="text" id="custName" placeholder="Customer Name" required>
                    <input type="email" id="custEmail" placeholder="Customer Email" required>
                    <button type="submit" class="submit-btn">Submit to Email</button>
                    <button type="button" onclick="downloadDesign()" class="download-btn">Download PNG</button>
                    <div id="statusMessage"></div>
                </form>
            </section>
        </aside>

        <main class="canvas-area">
            <div class="canvas-wrapper">
                <canvas id="designCanvas" width="800" height="600"></canvas>
            </div>
        </main>

        <input type="hidden" id="activeColor" value="#000000">
    </div>

    <script src="script.js"></script>
</body>
</html>
