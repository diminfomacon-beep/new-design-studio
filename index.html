<style>
  :root {--primary:#111827; --accent:#3b82f6; --bg-light:#f5f5f5; --border-color:#ddd;}
  body{font-family:sans-serif;background:var(--bg-light);margin:0;padding:2px;display:flex;justify-content:center;user-select:none;}
  .studio-wrapper {display: grid;grid-template-columns: 300px 1fr 50px;gap: 15px;height: 95vh;padding: 15px;background: #CAE4DB;border-radius: 16px;box-sizing: border-box;margin: 0 auto;}

  .handle-tr { top: -5px; right: -5px; cursor: ne-resize; }
  .handle-bl { bottom: -5px; left: -5px; cursor: sw-resize; }
  .handle-br { bottom: -5px; right: -5px; cursor: se-resize; }

  .handle-b { bottom: -5px; left: 50%; transform: translateX(-50%); cursor: s-resize; }
  .handle-l { left: -5px; top: 50%; transform: translateY(-50%); cursor: w-resize; }
  .handle-r { right: -5px; top: 50%; transform: translateY(-50%); cursor: e-resize; }

  #selection-marquee {border: 1px dashed #007bff; background-color: rgba(0, 123, 255, 0.1); position: absolute;pointer-events: none; z-index: 10000;display: none;}
  .multi-selected {outline: 2px solid rgba(0, 123, 255, 0.5) !important;}
  .handle-tl { top: -4px; left: -4px; cursor: nw-resize; }
  .handle-tr { top: -4px; right: -4px; cursor: ne-resize; }

</style>

<script>
/********************************************* GLOBAL STATE & CONFIG ********************************************/
const PIXABAY_API_KEY = '54841320-2fc493da46915b0eb0a6f740c';
const designCanvas = document.getElementById('designCanvas');
let activeItem = null;
let selectedItems = [];
let historyStack = [];
let historyIndex = -1;
let isSelecting = false;
let startX, startY;
let isMultiSelectMode = false;

document.getElementById('multiSelectToggle').onclick = function() {
    isMultiSelectMode = !isMultiSelectMode;
    
    // UI Feedback for the button
    this.innerText = isMultiSelectMode ? "Multiple: ON" : "Multiple: OFF";
    this.classList.toggle('active-mode', isMultiSelectMode);
    
    // If we turn it off, we usually want to keep what we have or deselect
    if (!isMultiSelectMode && selectedItems.length > 1) {
        console.log("Multi-select mode disabled. Current group remains selected.");
    }
};
const marquee = document.createElement('div');
marquee.id = 'selection-marquee';
document.body.appendChild(marquee);
designCanvas.addEventListener('mousedown', (e) => {
    if (e.target === designCanvas) {
        // Start marquee selection
        isSelecting = true;
        startX = e.pageX;
        startY = e.pageY;
        
        marquee.style.left = startX + 'px';
        marquee.style.top = startY + 'px';
        marquee.style.width = '0px';
        marquee.style.height = '0px';
        marquee.style.display = 'block';

        if (!e.shiftKey) {
            deselectAll();
        }
    }
});
let templateMetadata = {}; // Global storage for tags
async function fetchTemplatesFromGitHub() {
    const grid = document.getElementById('templateGrid');
    const apiUrl = `https://api.github.com/repos/${GH_CONFIG.owner}/${GH_CONFIG.repo}/contents/${GH_CONFIG.path}?ref=${GH_CONFIG.branch}`;
    const metadataUrl = `https://raw.githubusercontent.com/${GH_CONFIG.owner}/${GH_CONFIG.repo}/${GH_CONFIG.branch}/${GH_CONFIG.path}/metadata.json`;

    try {
        // 1. Try to fetch the metadata JSON
        const metaRes = await fetch(metadataUrl);
        if (metaRes.ok) {
            templateMetadata = await metaRes.json();
        }

        // 2. Fetch the actual file list
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error("Repo access error");
        githubFiles = await response.json();
        
        renderTemplateGrid(githubFiles);
    } catch (error) {
        console.error("Metadata/File fetch failed:", error);
        grid.innerHTML = "<p style='color:red;'>Error loading library.</p>";
    }
}
function injectProductBackground(imageUrl) {
    const oldBg = document.getElementById('product-bg');
    if (oldBg) oldBg.remove();

    const img = document.createElement('img');
    img.id = 'product-bg';

    img.crossOrigin = 'anonymous';

    img.src = imageUrl;
    
    // Updated Styles for "Max Fill"
    Object.assign(img.style, {
        position: 'absolute',
        top: '0',
        left: '0',
        width: '100%',        // Force width to 100% of canvas
        height: '100%',       // Force height to 100% of canvas
        objectFit: 'contain', // "contain" ensures the whole product fits. 
                              // Use "cover" if you want it to bleed off the edges.
        pointerEvents: 'none', 
        zIndex: '0',           
        opacity: '1'          // Full visibility
    });

    designCanvas.appendChild(img);
}
function renderTemplateGrid(files) {
    const grid = document.getElementById('templateGrid');
    if (!grid) return;
    grid.innerHTML = "";
    
    files.forEach(file => {
        if (file.name === 'metadata.json') return;
        
        if (/\.(jpe?g|png|gif|svg)$/i.test(file.name)) {
            const imgThumb = document.createElement('img');
            imgThumb.src = file.download_url; 
            imgThumb.className = 'gallery-item';
            
            // This ensures every image HAS a name to search against
            const tags = templateMetadata[file.name] || "";
            imgThumb.setAttribute('data-name', (file.name + " " + tags).toLowerCase());
            
            imgThumb.onclick = () => loadTemplate(file.download_url);
            grid.appendChild(imgThumb);

function makeDraggable(el) {
    const handleStart = (e, clientX, clientY) => {
        e.stopPropagation();
        
        // 1. Identify Resize Handles
        if (e.target.classList.contains('resize-handle')) {
            startResize(e, el, e.target.dataset.handle);
            return;
        }

        // 2. UPDATED SELECTION LOGIC
        // We check if the Toggle Button is ON (isMultiSelectMode) OR Shift is held
        if (isMultiSelectMode || e.shiftKey) {
            if (selectedItems.includes(el)) {
                el.classList.remove('active-layer', 'multi-selected');
                selectedItems = selectedItems.filter(i => i !== el);
            } else {
                el.classList.add('active-layer', 'multi-selected');
                selectedItems.push(el);
            }
        } else {
            // Normal behavior: click a new item, deselect everything else
            if (!selectedItems.includes(el)) {
                deselectAll();
                el.classList.add('active-layer');
                selectedItems = [el];
            }
        }
        
        activeItem = el;

        // 3. Prepare Data for ALL selected items
        let startPos = selectedItems.map(item => ({
            item,
            x: clientX - item.offsetLeft,
            y: clientY - item.offsetTop,
            startW: item.offsetWidth,
            startH: item.offsetHeight
        }));

        const moveHandler = (moveEvent) => {
            const isTouch = moveEvent.type === 'touchmove';
            
            // Handle Pinch
            if (isTouch && moveEvent.touches.length === 2) {
                handleMultiPinch(moveEvent, startPos);
                return; 
            }

            // Normal Dragging
            const currentX = isTouch ? moveEvent.touches[0].clientX : moveEvent.clientX;
            const currentY = isTouch ? moveEvent.touches[0].clientY : moveEvent.clientY;

            startPos.forEach(p => {
                p.item.style.left = (currentX - p.x) + "px";
                p.item.style.top = (currentY - p.y) + "px";
            });
            
            if (typeof updatePreview === "function") updatePreview();
        };

        const upHandler = () => {
            document.removeEventListener('mousemove', moveHandler);
            document.removeEventListener('mouseup', upHandler);
            document.removeEventListener('touchmove', moveHandler);
            document.removeEventListener('touchend', upHandler);
            
            initialPinchDist = null; 
            saveHistory();
        };

        document.addEventListener('mousemove', moveHandler);
        document.addEventListener('mouseup', upHandler);
        document.addEventListener('touchmove', moveHandler, { passive: false });
        document.addEventListener('touchend', upHandler);
    };

    el.onmousedown = (e) => handleStart(e, e.clientX, e.clientY);
    el.addEventListener('touchstart', (e) => {
        const touch = e.touches[0];
        handleStart(e, touch.clientX, touch.clientY);
    }, { passive: false });
}
function handleInteractionStart(e, el, clientX, clientY) {
    activeItem = el;
    deselectAll();
    el.classList.add('active-layer');

    // Handle Resize Handles first
    if (e.target.classList.contains('resize-handle')) {
        startResize(e, el, e.target.dataset.handle);
        return;
    }

    // Logic for dragging
    let startPos = [{
        item: el,
        x: clientX - el.offsetLeft,
        y: clientY - el.offsetTop
    }];

    // --- Desktop Move ---
    document.onmousemove = (e) => {
        el.style.left = (e.clientX - startPos[0].x) + "px";
        el.style.top = (e.clientY - startPos[0].y) + "px";
    };

    // --- Mobile Move ---
    const touchMoveHandler = (e) => {
        if (e.touches.length === 1) { // Single finger move
            const touch = e.touches[0];
            el.style.left = (touch.clientX - startPos[0].x) + "px";
            el.style.top = (touch.clientY - startPos[0].y) + "px";
        } else if (e.touches.length === 2) { // Two finger pinch
            handlePinch(e, el);
        }
    };

    // Cleanup
    const endHandler = () => {
        document.onmousemove = null;
        document.removeEventListener('touchmove', touchMoveHandler);
        document.removeEventListener('touchend', endHandler);
        saveHistory();
    };

    document.addEventListener('touchmove', touchMoveHandler, { passive: false });
    document.addEventListener('touchend', endHandler);
    document.onmouseup = endHandler;
}
let initialPinchDist = null;

function handleMultiPinch(e, startPosArray) {
    const t1 = e.touches[0];
    const t2 = e.touches[1];
    const currentDist = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);

    if (initialPinchDist === null) {
        initialPinchDist = currentDist;
    } else {
        const scale = currentDist / initialPinchDist;

        startPosArray.forEach(data => {
            const el = data.item;
            const newW = data.startW * scale;
            const newH = data.startH * scale;

            // Apply size
            el.style.width = newW + "px";
            el.style.height = newH + "px";

            // Update internal assets
            const img = el.querySelector('img');
            const span = el.querySelector('span');
            
            if (img) {
                img.style.width = "100%";
                img.style.height = "100%";
            }
            if (span) {
                // Keep text proportional to its own container height
                span.style.fontSize = (newH * 0.8) + "px"; 
            }
        });
    }
}

let initialPinchSize = { w: 0, h: 0 };

function handlePinch(e, el) {
    const t1 = e.touches[0];
    const t2 = e.touches[1];
    const currentDist = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);

    if (initialPinchDist === null) {
        initialPinchDist = currentDist;
        initialPinchSize.w = el.offsetWidth;
        initialPinchSize.h = el.offsetHeight;
    } else {
        const scale = currentDist / initialPinchDist;
        const newW = initialPinchSize.w * scale;
        const newH = initialPinchSize.h * scale;

        // Apply scaling to container
        el.style.width = newW + "px";
        el.style.height = newH + "px";

        // Handle internal assets
        const img = el.querySelector('img');
        const span = el.querySelector('span');
        
        if (img) {
            img.style.width = "100%";
            img.style.height = "100%";
        }
        if (span) {
            // Adjust font size based on height change
            span.style.fontSize = (newH * 0.8) + "px"; 
        }
    }
}

/********************************************* CORE ENGINE (Undo, Redo, History) ********************************************/
function saveHistory() {
    const currentState = designCanvas.innerHTML;
    // Don't save if it's identical to the current index
    if (historyStack[historyIndex] === currentState) return;

    // Remove any "redo" future if we perform a new action
    historyIndex++;
    historyStack = historyStack.slice(0, historyIndex);
    historyStack.push(currentState);

    // Limit stack size
    if (historyStack.length > 30) {
        historyStack.shift();
        historyIndex--;
    }
}
function undo() {
    if (historyIndex > 0) {
        historyIndex--;
        restoreCanvas();
    }
}
function redo() {
    if (historyIndex < historyStack.length - 1) {
        historyIndex++;
        restoreCanvas();
    }
}
function restoreCanvas() {
    designCanvas.innerHTML = historyStack[historyIndex];
    // RE-ATTACH ALL LISTENERS
    const items = designCanvas.querySelectorAll('.draggable');
    items.forEach(item => {
        makeDraggable(item);
    });
    deselectAll();
}
function changeZIndex(direction) {
    if (!activeItem) return;
    const parent = document.getElementById('designCanvas'); // Specific target
    const children = Array.from(parent.children);
    // ... rest of your logic
 
    const currentIndex = children.indexOf(activeItem);

    switch (direction) {
        case 'front':
            // Move to the very end of the parent
            parent.appendChild(activeItem);
            break;

        case 'back':
        // Move to the beginning, but AFTER the product background
        const bg = document.getElementById('product-bg');
        if (bg && designCanvas.firstChild === bg) {
            designCanvas.insertBefore(activeItem, bg.nextSibling);
        } else {
            designCanvas.insertBefore(activeItem, designCanvas.firstChild);
        }
        break;

        case 'forward':
            // Swap with the next sibling
            if (currentIndex < children.length - 1) {
                parent.insertBefore(activeItem, children[currentIndex + 2] || null);
            }
            break;

        case 'backward':
            // Swap with the previous sibling
            if (currentIndex > 0) {
                parent.insertBefore(activeItem, children[currentIndex - 1]);
            }
            break;
    }

    saveHistory();
}

    items.forEach(item => {

function groupSelected() {
    if (selectedItems.length < 2) return;

    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;

    // 1. Calculate bounding box
    selectedItems.forEach(item => {
        const l = parseInt(item.style.left) || 0;
        const t = parseInt(item.style.top) || 0;
        const w = item.offsetWidth;
        const h = item.offsetHeight;
        minX = Math.min(minX, l);
        minY = Math.min(minY, t);
        maxX = Math.max(maxX, l + w);
        maxY = Math.max(maxY, t + h);
    });

    // 2. Create the group container
    const group = document.createElement('div');
    group.className = 'draggable group-container';
    group.style.left = minX + 'px';
    group.style.top = minY + 'px';
    group.style.width = (maxX - minX) + 'px';
    group.style.height = (maxY - minY) + 'px';
    group.style.position = 'absolute';
    
    group.innerHTML = getHandleHTML();

    // 3. Move items into the group AND CLEAN THEM
    const itemsToGroup = [...selectedItems];
    itemsToGroup.forEach(item => {
        const currentL = parseInt(item.style.left) || 0;
        const currentT = parseInt(item.style.top) || 0;
        
        item.style.left = (currentL - minX) + 'px';
        item.style.top = (currentT - minY) + 'px';
        
        // CRITICAL: Remove all selection/active classes from the children
        item.classList.remove('active-layer', 'multi-selected');
        // Prevent the children from being clickable while inside the group
        item.style.pointerEvents = 'none'; 
        
        group.appendChild(item);
    });

    designCanvas.appendChild(group);
    
    // 4. Reset State
    deselectAll(); // This clears the selectedItems array and all CSS outlines
    
    // 5. Select ONLY the new group
    makeDraggable(group);
    activeItem = group;
    group.classList.add('active-layer');
    selectedItems = [group];
    
    saveHistory();
}
function ungroupSelected() {
    const target = activeItem;
    if (!target || !target.classList.contains('group-container')) return;

    const gLeft = parseInt(target.style.left) || 0;
    const gTop = parseInt(target.style.top) || 0;
    
    const children = Array.from(target.children).filter(child => 
        child.classList.contains('draggable') || child.tagName === 'IMG' || child.tagName === 'SPAN'
    );

    children.forEach(child => {
        if (!child.classList.contains('resize-handle')) {
            const cLeft = parseInt(child.style.left) || 0;
            const cTop = parseInt(child.style.top) || 0;
            
            child.style.left = (cLeft + gLeft) + 'px';
            child.style.top = (cTop + gTop) + 'px';
            
            // RESTORE pointer events so they are clickable again
            child.style.pointerEvents = 'auto'; 
            
            designCanvas.appendChild(child);
            makeDraggable(child);
        }
    });

    target.remove();
    deselectAll();
    saveHistory();
}

/********************************************* INTERACTIVITY (Drag & Selection) ********************************************/
function startResize(e, el, type) {
    // Prevent scrolling or text selection while resizing
    if (e.cancelable) e.preventDefault();
    e.stopPropagation();

    const startW = el.offsetWidth;
    const startH = el.offsetHeight;
    const startL = el.offsetLeft;
    const startT = el.offsetTop;

    // Support both Mouse and Touch initial positions
    const startX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
    const startY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;

    const isGroup = el.classList.contains('group-container');
    let childrenData = [];

    // Capture initial state of all children for proportional scaling
    if (isGroup) {
        Array.from(el.children).forEach(child => {
            if (!child.classList.contains('resize-handle')) {
                childrenData.push({
                    el: child,
                    left: parseInt(child.style.left) || 0,
                    top: parseInt(child.style.top) || 0,
                    width: child.offsetWidth,
                    height: child.offsetHeight,
                    fontSize: child.querySelector('span') ? parseFloat(window.getComputedStyle(child.querySelector('span')).fontSize) : null
                });
            }
        });
    }

    const moveHandler = (moveEvent) => {
        // Handle coordinates for both mouse and touch
        const currentX = moveEvent.type.includes('touch') ? moveEvent.touches[0].clientX : moveEvent.clientX;
        const currentY = moveEvent.type.includes('touch') ? moveEvent.touches[0].clientY : moveEvent.clientY;

        const dx = currentX - startX;
        const dy = currentY - startY;

        let newW = startW, newH = startH, newL = startL, newT = startT;

        // 1. Calculate New Container Dimensions
        if (type.includes('r')) newW = startW + dx;
        if (type.includes('b')) newH = startH + dy;
        if (type.includes('l')) { newW = startW - dx; newL = startL + dx; }
        if (type.includes('t')) { newH = startH - dy; newT = startT + dy; }

        // Set minimum size constraints (e.g., 20px)
        newW = Math.max(20, newW);
        newH = Math.max(20, newH);

        // Apply to container
        el.style.width = newW + "px";
        el.style.height = newH + "px";
        el.style.left = newL + "px";
        el.style.top = newT + "px";

        // 2. Proportional Scaling Logic
        if (isGroup) {
            const scaleX = newW / startW;
            const scaleY = newH / startH;

            childrenData.forEach(data => {
                data.el.style.left = (data.left * scaleX) + "px";
                data.el.style.top = (data.top * scaleY) + "px";
                data.el.style.width = (data.width * scaleX) + "px";
                data.el.style.height = (data.height * scaleY) + "px";

                if (data.fontSize) {
                    const span = data.el.querySelector('span');
                    span.style.fontSize = (data.fontSize * Math.min(scaleX, scaleY)) + "px";
                }
            });
        } else {
            // Normal single-item logic
            const img = el.querySelector('img');
            if (img) {
                img.style.width = "100%";
                img.style.height = "100%";
            }
            const text = el.querySelector('span');
            if (text) text.style.fontSize = (newH * 0.8) + "px";
        }
    };

    const stopResize = () => {
        document.removeEventListener('mousemove', moveHandler);
        document.removeEventListener('mouseup', stopResize);
        document.removeEventListener('touchmove', moveHandler);
        document.removeEventListener('touchend', stopResize);
        saveHistory();
    };

    // Attach listeners to document
    document.addEventListener('mousemove', moveHandler);
    document.addEventListener('mouseup', stopResize);
    document.addEventListener('touchmove', moveHandler, { passive: false });
    document.addEventListener('touchend', stopResize);
}
