<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>D.I.M. Design Studio</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/themes/classic.min.css"/>
<script src="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/pickr.min.js"></script>
<style>
:root {
  --primary:#111827; --accent:#3b82f6; --bg-light:#f5f5f5; --border-color:#ddd;
}
body{font-family:sans-serif;background:var(--bg-light);margin:0;padding:10px;display:flex;justify-content:center;user-select:none;}
.studio-wrapper {                
  display: grid;
  /* --- CHANGED: First 2 columns are fixed, center expands --- */
  grid-template-columns: 240px 240px 1fr 240px; 
  gap: 15px;                
  width: 100%;                
  padding: 15px;                
  background:#CAE4DB;                
  border-radius:16px;
  box-sizing: border-box;
  /* --- Added to ensure panels don't shrink too small --- */
  min-width: 1200px; 
}

/* --- NEW: Control Panel Style --- */
.control-panel-left {
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 15px;
  background: #f9fafb;
  display: flex;
  flex-direction: column;
  gap: 15px;
  height: 600px;
  overflow-y: auto;
}
.gallery-panel{border:1px solid var(--border-color);border-radius:12px;padding:10px;background:#f9fafb;display:flex;flex-direction:column;height:600px;overflow:hidden;}
.gallery-header{margin-bottom:10px;display:flex;flex-direction:column;gap:5px;}
.gallery-title{font-size:13px;font-weight:bold;color:#333;}
.gallery-search{padding:5px;border-radius:6px;border:1px solid #ddd;font-size:11px;width:100%;box-sizing:border-box;}
.mini-gallery-container{margin-bottom:10px;height:200px;display:flex;flex-direction:column;}
.mini-gallery-title{font-size:10px;color:var(--accent);text-transform:uppercase;font-weight:bold;margin-bottom:5px;}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(45px,1fr));gap:5px;overflow-y:auto;flex-grow:1;padding-right:5px;}
.gallery-item{width:45px;height:45px;border:1px solid #eee;border-radius:6px;cursor:pointer;object-fit:contain;background:white;transition:all 0.2s;}
.gallery-item:hover{border-color:var(--accent);transform:scale(1.05);}

/* --- PRODUCT PREVIEW CSS --- */
.product-stage{
    display:none;
    position:relative;
    width: 100%;
    height: 100%;
    align-items:center;
    justify-content:center;
}
.product-stage.active-product{display:flex;}
.product-view{
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
    position:relative;
    overflow:hidden;
    background-color:white;
    border:3px solid transparent;
    transition:all 0.3s;
}
/* Define shapes for products */
.view-tshirt{width:320px;height:250px;clip-path:polygon(25% 0%,75% 0%,100% 20%,85% 35%,85% 100%,15% 100%,15% 35%,0% 20%);}


/* Ensure the design container is positioned over the chest */
#tshirt-design {
    /* Adjust these to fit the SVG or image you use */
    top: 25%;
    left: 30%;
    width: 40%;
    height: 35%;
    border: 1px dashed rgba(255,0,0,0.3); /* Keep for debugging */
}
.view-tumbler { width: 100px; height: 250px; border-radius: 10px; }
.view-mug { width: 180px; height: 150px; border-radius: 10px 10px 30px 30px; }

/* Combined design layer */
.mockup-layer {
    position: absolute;
    overflow: hidden;
    pointer-events: none;
    border: 1px dashed rgba(255,0,0,0.3); /* Visualization */
}

/* --- DRAGGABLE CSS --- */
.draggable.active-layer{border:2px solid var(--accent);}
.design-text{text-align:center;pointer-events:none;word-break:break-word;display:block;width:100%;line-height:1.1;}
.resize-handle{width:10px;height:10px;background:white;border:2px solid var(--accent);position:absolute;display:none;cursor:nwse-resize;}
.draggable.active-layer .resize-handle{display:block;}
.handle-br{bottom:-5px;right:-5px;}
.draggable img { display: block; width: 100%; height: 100%; object-fit: contain; }
.draggable {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
}

/* --- PANELS --- */
.controls-panel{display:flex;flex-direction:column;gap:10px;}
.control-group{display:flex;flex-direction:column;gap:3px;}
label{font-weight:600;font-size:10px;color:#666;text-transform:uppercase;}
input,select{padding:6px;border-radius:6px;border:1px solid #ddd;font-size:12px;}
.layer-manager{background:#f3f4f6;padding:8px;border-radius:8px;border:1px solid #e5e7eb;max-height:120px;overflow-y:auto;}
.layer-item{display:flex;justify-content:space-between;align-items:center;background:white;padding:6px 8px;border-radius:4px;margin-bottom:4px;font-size:11px;border:1px solid #eee;}
.btn-icon{background:#eee;border:none;padding:2px 5px;border-radius:3px;cursor:pointer;font-size:9px;}
.btn-delete{background:#fee2e2;color:#991b1b;}
.btn-group{display:flex;gap:8px;margin-top:5px;flex-wrap: wrap;}
button{padding:8px;border-radius:8px;border:none;font-weight:600;cursor:pointer;font-size:12px;}
.btn-style{background:#f3f4f6;color:#333;font-weight:bold;padding:6px 10px;border:1px solid #ddd;}
.btn-style.active{background:var(--accent);color:white;border-color:var(--accent);}
.btn-primary{background:var(--primary);color:white;flex:1;}
.btn-action{background:#dbeafe;color:#1e40af;}
.btn-download{background:#d1fae5;color:#065f46;flex:1;}
#textEditor{display:none;background:#f3f4f6;padding:10px;border-radius:8px;border:1px solid #e5e7eb;}
.size-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.size-row input{width:60px;}

/* --- PREVIEW PANEL --- */
.preview-panel{
    border:1px solid var(--border-color);
    border-radius:12px;
    padding:10px;
    background:#c9c5c5;
    display:flex;
    flex-direction:column;
    height:350px;
    overflow:hidden;
}
.preview-title { font-size: 13px; font-weight: bold; color: #000000; align-self: flex-start; }
.preview-box {
  width: 100%;
  height: 300px;
  border: 1px solid var(--border-color);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  background-color: #e5e7eb;
  background-image:
    linear-gradient(45deg, rgba(0,0,0,0.05) 25%, transparent 25%),
    linear-gradient(-45deg, rgba(0,0,0,0.05) 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, rgba(0,0,0,0.05) 75%),
    linear-gradient(-45deg, transparent 75%, rgba(0,0,0,0.05) 75%);
  background-size: 20px 20px;
  background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
}

/* --- CANVAS --- */
.canvas-container {
  flex: 1;
  background: #ffffff;
  border: 1px solid var(--border-color);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px;
  min-height: 500px;
  position: relative;
  overflow: hidden;
}

.design-canvas {
  /* --- CHANGED: Use 100% instead of fixed pixels --- */
  width: 100%;
  height: 100%;
  
  background: white;
  border: 2px dashed #ccc;
  border-radius: 12px;
  position: relative;
  overflow: hidden;
}
</style>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Bungee&family=Creepster&family=Lobster&family=Monoton&family=Montserrat:wght@400;900&family=Pacifico&family=Playfair+Display:wght@700&family=Press+Start+2P&family=Rock+Salt&family=Special+Elite&display=swap" rel="stylesheet">
</head>
<body>      
<div class="studio-wrapper">



  <div class="gallery-panel">
    <div class="gallery-header">
      <div class="gallery-title">Image Search</div>
      <input type="text" id="gallerySearch" class="gallery-search" placeholder="Search all libraries...">
    </div>
    <div class="mini-gallery-container">
      <div class="mini-gallery-title">Pixabay (Vector)</div>
      <div class="gallery-grid" id="pixabayGrid"></div>
    </div>
    <hr style="border:0;border-top:1px solid #eee;margin:10px 0;">
    <div class="control-group">
      <label>Upload Local Image</label>
      <input type="file" id="imageInput" accept="image/*"/>
    </div>
    <hr style="border:0;border-top:1px solid #eee;margin:10px 0;">
  </div>




  <div class="control-panel-left">
    <div class="control-group">
      <label>Add Text</label>
      <div style="display:flex; gap:3px;">
        <input type="text" id="textInput" placeholder="Enter text..." value="New Text" style="flex:1"/>
        <button class="btn-action" id="addTextBtn">Add</button>
      </div>
    </div>
    <div id="textEditor">
      <div class="size-row">
        <div style="flex:1">
          <label>Text Color</label>
          <div id="fontColorPicker"></div>
        </div>
        <div>
          <label>Size (px)</label><br>
          <input type="number" id="fontSizeInput" min="8" max="200" value="24">
        </div>
      </div>
      <div class="control-group">
        <label>Font Family</label>
        <select id="fontFamily">
          <option value="'Montserrat', sans-serif">Modern: Montserrat</option>
          <option value="'Playfair Display', serif">Classic: Playfair</option>
          <option value="'Pacifico', cursive">Script: Pacifico</option>
          <option value="'Lobster', cursive">Bold Script: Lobster</option>
          <option value="'Bungee', cursive">Block: Bungee</option>
          <option value="'Anton', sans-serif">Impact: Anton</option>
          <option value="'Bangers', cursive">Comic: Bangers</option>
          <option value="'Rock Salt', cursive">Handwritten: Rock Salt</option>
          <option value="'Monoton', cursive">Retro: Monoton</option>
          <option value="'Special Elite', cursive">Typewriter: Special Elite</option>
          <option value="'Creepster', cursive">Horror: Creepster</option>
          <option value="'Press Start 2P', cursive">Pixel: Press Start</option>
        </select>
      </div>
      <div style="display:flex; gap:5px; margin-top:5px;">
        <button id="btnBold" class="btn-style" style="flex:1">B</button>
        <button id="btnItalic" class="btn-style" style="flex:1">I</button>
      </div>
    </div>
    <div class="layer-manager">
      <label style="color: var(--accent); margin-bottom:5px; display:block; font-size:10px;">Active Layers</label>
      <div id="layerList"></div>
    </div>
    <div class="btn-group">
      <button onclick="undo()">↶ Undo</button>
      <button onclick="redo()">↷ Redo</button>
    </div>
  </div>


  <div class="canvas-container">
    <div id="designCanvas" class="design-canvas"></div>
  </div>



  
  <div class="controls-panel">
    <div class="control-group">
      <label>Product</label>
      <select id="productSelect">
        <option value="tshirt">T-Shirt</option>
        <option value="tumbler">Tumbler</option>
        <option value="mug">Mug</option>
      </select>
    </div>
    <div class="control-group">
      <label>Zoom Preview</label>
      <input type="range" id="zoomSlider" min="0.5" max="2" step="0.1" value="1">
    </div>
    <div class="control-group">
      <label>Product Color</label>
      <div id="bgPicker"></div>
    </div>
    <hr style="border:0;border-top:1px solid #eee;margin:10px 0;">
    <div class="preview-panel">
      <div class="preview-title">Preview</div>
      <div class="preview-box">
        <div id="stage-tshirt" class="product-stage active-product">
          <div class="product-view view-tshirt">
            <div class="mockup-layer" id="tshirt-design"></div>
          </div>
        </div>
        <div id="stage-tumbler" class="product-stage">
          <div class="product-view view-tumbler">
            <div class="mockup-layer" id="tumbler-design"></div>
          </div>
        </div>
        <div id="stage-mug" class="product-stage">
          <div class="product-view view-mug">
            <div class="mockup-layer" id="mug-design"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="btn-group">
      <button class="btn-download" id="downloadBtn">💾 Save PNG</button>
      <button class="btn-primary" id="submitDesign">Finalize</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
/********************************************
 * INITIALIZATION
 ********************************************/
const PIXABAY_API_KEY = '54841320-2fc493da46915b0eb0a6f740c';
let designCanvas = document.getElementById('designCanvas');
let currentProduct = 'tshirt';
let historyStack = [];
let redoStack = [];
let activeItem = null;
let isResizing = false;

const extendedSwatches = [
  '#FFFFFF', '#F2F2F2', '#D9D9D9', '#BFBFBF', '#A6A6A6', '#808080', '#595959', '#404040', '#262626', '#000000',
  '#FFCCCC', '#FF9999', '#FF6666', '#FF3333', '#FF0000', '#CC0000', '#990000', '#660000', '#330000',
  '#FFE5CC', '#FFCC99', '#FFB266', '#FF9933', '#FF8000', '#CC6600', '#994C00', '#663300', '#331900',
  '#FFFFCC', '#FFFF99', '#FFFF66', '#FFFF33', '#FFFF00', '#CCCC00', '#999900', '#666600', '#333300',
  '#CCFFCC', '#99FF99', '#66FF66', '#33FF33', '#00FF00', '#00CC00', '#009900', '#006600', '#003300',
  '#CCFFFF', '#99FFFF', '#66FFFF', '#33FFFF', '#00FFFF', '#00CCCC', '#009999', '#006666', '#003333',
  '#CCCCFF', '#9999FF', '#6666FF', '#3333FF', '#0000FF', '#0000CC', '#000099', '#000066', '#000033',
  '#E5CCFF', '#CC99FF', '#B266FF', '#9933FF', '#8000FF', '#6600CC', '#4C0099', '#330066', '#190033',
  '#FFCCFF', '#FF99FF', '#FF66FF', '#FF33FF', '#FF00FF', '#CC00CC', '#990099', '#660066', '#330033'
];

function createPicker(el, def) {
  return Pickr.create({
    el,
    theme: 'classic',
    default: def,
    swatches: extendedSwatches,
    components: {
      preview: true,
      opacity: true,
      hue: true,
      interaction: { hex: true, input: true, save: true }
    }
  });
}

const bgPicker = createPicker('#bgPicker', '#ffffff');
const fontColorPicker = createPicker('#fontColorPicker', '#000000');

bgPicker.on('change', (color, instance) => {
  const colorStr = color.toRGBA().toString();
  document.querySelectorAll('.product-view').forEach(v => v.style.backgroundColor = colorStr);
  instance.setColor(colorStr);
});

fontColorPicker.on('change', (color, instance) => {
  const active = document.querySelector('.active-layer .design-text');
  if(active) active.style.color = color.toRGBA().toString();
  instance.setColor(color.toRGBA().toString());
});
/********************************************
 * UTILITY
 ********************************************/
function saveHistory(){
  const snapshot = designCanvas.innerHTML;
  historyStack.push(snapshot);
  if(historyStack.length>50) historyStack.shift();
  redoStack = []; // Clear redo on new action
}
function undo(){
  if(historyStack.length > 0){
    redoStack.push(designCanvas.innerHTML);
    const last = historyStack.pop();
    designCanvas.innerHTML = last;
    updateLayerList();
    rebindDraggables();
    updatePreview();
  }
}
function redo(){
  if(redoStack.length > 0){
    historyStack.push(designCanvas.innerHTML);
    const next = redoStack.pop();
    designCanvas.innerHTML = next;
    updateLayerList();
    rebindDraggables();
    updatePreview();
  }
}
function updatePreview() {
  document.querySelectorAll('.product-stage').forEach(stage => {
    const productView = stage.querySelector('.product-view');
    const designContainer = productView.querySelector('.mockup-layer');
    
    if (!designContainer) return;
    
    designContainer.innerHTML = ""; // Clear existing

    // --- APPLY PRODUCT-SPECIFIC BOUNDARIES ---
    if (stage.id === 'stage-tshirt') {
        designContainer.style.top = "25%";
        designContainer.style.left = "30%";
        designContainer.style.width = "40%";
        designContainer.style.height = "35%";
    } else if (stage.id === 'stage-mug') {
        designContainer.style.top = "20%";
        designContainer.style.left = "15%";
        designContainer.style.width = "70%";
        designContainer.style.height = "55%";
    } else if (stage.id === 'stage-tumbler') {
        designContainer.style.top = "10%";
        designContainer.style.left = "15%";
        designContainer.style.width = "70%";
        designContainer.style.height = "70%";
    }

    // --- CLONE AND SCALE ELEMENTS ---
    Array.from(designCanvas.children).forEach(child => {
      const clone = child.cloneNode(true);
      clone.classList.remove("active-layer");
      clone.style.pointerEvents = "none";
      
      const handle = clone.querySelector('.resize-handle');
      if (handle) handle.remove();

      // Proportional scaling
      const scaleX = designContainer.clientWidth / designCanvas.clientWidth;
      const scaleY = designContainer.clientHeight / designCanvas.clientHeight;

      // Position relative to the container
      const canvasLeft = parseInt(child.style.left) || 0;
      const canvasTop = parseInt(child.style.top) || 0;

      clone.style.position = 'absolute';
      clone.style.left = (canvasLeft * scaleX) + 'px';
      clone.style.top = (canvasTop * scaleY) + 'px';
      clone.style.width = (parseInt(child.style.width) * scaleX) + 'px';
      clone.style.height = (parseInt(child.style.height) * scaleY) + 'px';
      
      // Scale Font Size
      if (clone.querySelector('.design-text')) {
          const fontSize = parseInt(window.getComputedStyle(child).fontSize);
          clone.style.fontSize = (fontSize * scaleX) + 'px';
      }

      designContainer.appendChild(clone);
    });
  });
}
function rebindDraggables(){
  document.querySelectorAll('#designCanvas .draggable')
    .forEach(el => makeDraggable(el));
}
/********************************************
 * PRODUCT SWITCHING
 ********************************************/
const productSelect = document.getElementById('productSelect');
productSelect.addEventListener('change', e => {
  currentProduct = e.target.value;

  document.querySelectorAll('.product-stage')
    .forEach(s => s.classList.remove('active-product'));

  document.getElementById(`stage-${currentProduct}`)
    .classList.add('active-product');

  setDefaultPreviewScale();
  updatePreview();
});

/********************************************
 * ZOOM PREVIEW
 ********************************************/
const zoomSlider = document.getElementById('zoomSlider');
zoomSlider.addEventListener('input', () => {
  const activeProductView =
    document.querySelector(`#stage-${currentProduct} .product-view`);

  activeProductView.style.transform = `scale(${zoomSlider.value})`;
});

/********************************************
 * ADD TEXT
 ********************************************/
const addTextBtn = document.getElementById('addTextBtn');
const textInput = document.getElementById('textInput');
const fontSizeInput = document.getElementById('fontSizeInput');
const fontFamilySelect = document.getElementById('fontFamily');
const btnBold = document.getElementById('btnBold');
const btnItalic = document.getElementById('btnItalic');

addTextBtn.addEventListener('click', () => {
  const div = document.createElement('div');
  div.classList.add('draggable');
  
  // Set initial size
  const initialWidth = 150;
  const initialHeight = 50;
  div.style.width = initialWidth + 'px';
  div.style.height = initialHeight + 'px';

  // Calculate pixel-perfect center
  const centerX = (designCanvas.clientWidth / 2) - (initialWidth / 2);
  const centerY = (designCanvas.clientHeight / 2) - (initialHeight / 2);

  // Apply coordinates and styling
  div.style.left = centerX + 'px';
  div.style.top = centerY + 'px';
  div.style.transform = 'none';
  
  div.style.fontSize = fontSizeInput.value + 'px';
  div.style.fontFamily = fontFamilySelect.value;
  
  if (btnBold.classList.contains('active')) div.style.fontWeight = 'bold';
  if (btnItalic.classList.contains('active')) div.style.fontStyle = 'italic';
  
  // Content and Handle
  div.innerHTML = `
    <span class="design-text" style="color:${fontColorPicker.getColor().toHEXA().toString()}">
        ${textInput.value}
    </span>
    <div class="resize-handle handle-br"></div>
  `;
  
  designCanvas.appendChild(div);
  makeDraggable(div);
  activeItem = div;
  
  updateLayerList();
  saveHistory();
  updatePreview();
  showTextEditor();
});

/********************************************
 * FONT EDIT CONTROLS
 ********************************************/
fontSizeInput.addEventListener('input',()=>{if(activeItem) activeItem.style.fontSize=fontSizeInput.value+'px';});
fontFamilySelect.addEventListener('change',()=>{if(activeItem) activeItem.style.fontFamily=fontFamilySelect.value;});
btnBold.addEventListener('click',()=>{btnBold.classList.toggle('active'); if(activeItem) activeItem.style.fontWeight=btnBold.classList.contains('active')?'bold':'normal';});
btnItalic.addEventListener('click',()=>{btnItalic.classList.toggle('active'); if(activeItem) activeItem.style.fontStyle=btnItalic.classList.contains('active')?'italic':'normal';});

function showTextEditor(){document.getElementById('textEditor').style.display='block';}

/********************************************
 * DRAGGABLE
 ********************************************/
function makeDraggable(el) {
  let startX, startY, initX, initY;
  const handle = el.querySelector('.resize-handle');
  
  el.addEventListener('mousedown', e => {
    activeItem = el; 
    updateLayerList();
    
    if(e.target === handle) { isResizing = true; return; }

    // Remove the centering transform to prevent "jumping"
    if (el.style.transform.includes('translate')) {
        const rect = el.getBoundingClientRect();
        const parentRect = designCanvas.getBoundingClientRect();
        el.style.left = (rect.left - parentRect.left) + 'px';
        el.style.top = (rect.top - parentRect.top) + 'px';
        el.style.transform = 'none';
    }

    startX = e.clientX; startY = e.clientY;
    initX = parseInt(el.style.left) || 0;
    initY = parseInt(el.style.top) || 0;
    
    document.addEventListener('mousemove', dragMove);
    document.addEventListener('mouseup', dragUp);
  });

  function dragMove(e) {
    if (isResizing) {
        const rect = el.getBoundingClientRect();
        const canvasRect = designCanvas.getBoundingClientRect();
        
        let newWidth = e.clientX - rect.left;
        let newHeight = e.clientY - rect.top;

        // Prevent resizing beyond the right/bottom canvas edge
        if (rect.left + newWidth > canvasRect.right) newWidth = canvasRect.right - rect.left;
        if (rect.top + newHeight > canvasRect.bottom) newHeight = canvasRect.bottom - rect.top;

        el.style.width = Math.max(10, newWidth) + 'px';
        el.style.height = Math.max(10, newHeight) + 'px';
        return;
    }

    // Movement Logic
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;

    let newLeft = initX + dx;
    let newTop = initY + dy;

    // Boundary Constraints
    const minLeft = 0;
    const maxLeft = designCanvas.clientWidth - el.offsetWidth;
    const minTop = 0;
    const maxTop = designCanvas.clientHeight - el.offsetHeight;

    // Apply clamped coordinates
    el.style.left = Math.max(minLeft, Math.min(newLeft, maxLeft)) + 'px';
    el.style.top = Math.max(minTop, Math.min(newTop, maxTop)) + 'px';
  }

  function dragUp(){
    document.removeEventListener('mousemove', dragMove);
    document.removeEventListener('mouseup', dragUp);
    isResizing=false;
    saveHistory();
    updatePreview();
  }
}
function setDefaultPreviewScale() {
  const scales = {
    tshirt: 0.8,
    tumbler: 0.8,
    mug: 1.0
  };

  document.querySelectorAll('.product-view').forEach(view => {
    view.style.transform = `scale(${scales[currentProduct]})`;
  });

  zoomSlider.value = scales[currentProduct];
}
/********************************************
 * LAYER MANAGER
 ********************************************/
function updateLayerList(){
  const container = document.getElementById('layerList');
  container.innerHTML='';
  Array.from(designCanvas.children).forEach((child,i)=>{
    const div=document.createElement('div');
    div.classList.add('layer-item');
    div.innerHTML=`<span>Layer ${i+1}</span> <button class="btn-icon btn-delete">X</button>`;
        div.querySelector('button').addEventListener('click', () => {
      designCanvas.removeChild(child);
      updateLayerList();
      saveHistory();
      updatePreview();
    });
    div.addEventListener('click', () => {
      activeItem = child;
      Array.from(designCanvas.children).forEach(c => c.classList.remove('active-layer'));
      child.classList.add('active-layer');
      showTextEditor();
    });
    container.appendChild(div);
  });
}

/********************************************
 * IMAGE UPLOAD
 ********************************************/
const imageInput = document.getElementById('imageInput');
imageInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    const img = document.createElement('img');
    img.src = ev.target.result;
    const div = document.createElement('div');
    div.classList.add('draggable');
    div.style.left = '50%';
    div.style.top = '50%';
    div.style.transform = 'translate(-50%, -50%)';
    div.appendChild(img);
    const handle = document.createElement('div');
    handle.classList.add('resize-handle', 'handle-br');
    div.appendChild(handle);
    designCanvas.appendChild(div);
    makeDraggable(div);
    activeItem = div;
    updateLayerList();
    saveHistory();
    updatePreview();
  };
  reader.readAsDataURL(file);
});

/********************************************
 * PIXABAY SEARCH
 ********************************************/
const pixabayGrid = document.getElementById('pixabayGrid');
const gallerySearch = document.getElementById('gallerySearch');

async function fetchPixabay(query = 'vector') {
  const res = await fetch(`https://pixabay.com/api/?key=${PIXABAY_API_KEY}&q=${encodeURIComponent(query)}&image_type=vector&per_page=20`);
  const data = await res.json();
  pixabayGrid.innerHTML = '';
  
  data.hits.forEach(hit => {
    const imgThumb = document.createElement('img');
    imgThumb.src = hit.previewURL;
    imgThumb.classList.add('gallery-item');
    
    imgThumb.addEventListener('click', () => {
      const div = document.createElement('div');
      div.classList.add('draggable');
      
      const initialSize = 120;
      div.style.width = initialSize + 'px';
      div.style.height = initialSize + 'px';

      const centerX = (designCanvas.clientWidth / 2) - (initialSize / 2);
      const centerY = (designCanvas.clientHeight / 2) - (initialSize / 2);

      div.style.left = centerX + 'px';
      div.style.top = centerY + 'px';
      div.style.transform = 'none';

      const image = document.createElement('img');
      image.src = hit.largeImageURL;
      image.style.width = "100%";
      image.style.height = "100%";
      image.style.objectFit = "contain";
      image.style.pointerEvents = "none";

      div.appendChild(image);
      const handle = document.createElement('div');
      handle.classList.add('resize-handle', 'handle-br');
      div.appendChild(handle);
      
      designCanvas.appendChild(div);
      makeDraggable(div);
      activeItem = div;
      
      updateLayerList();
      saveHistory();
      updatePreview();
    });
    pixabayGrid.appendChild(imgThumb);
  });
}
fetchPixabay();

gallerySearch.addEventListener('keypress', e => {
  if(e.key==='Enter') fetchPixabay(gallerySearch.value);
});

/********************************************
 * SAVE PNG
 ********************************************/
document.getElementById('downloadBtn').addEventListener('click', () => {
  const activeStage = document.querySelector('.product-stage.active-product .product-view');
  html2canvas(activeStage).then(canvas => {
    const link = document.createElement('a');
    link.download = `${currentProduct}_design.png`;
    link.href = canvas.toDataURL();
    link.click();
  });
});

/********************************************
 * INITIALIZATION
 ********************************************/
updateLayerList();
setDefaultPreviewScale();
</script>
